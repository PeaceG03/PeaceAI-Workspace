name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    # about 16 min on main with parallel files; --test-concurrency=1 (shared peaceai-cand3
    # oop e2e) stretches wall-clock past 40, so leave headroom for the full serial tools suite.
    timeout-minutes: 90
    permissions:
      contents: read
    # M202/M204 oop-v1 e2e only (direct verify(), no loop isolation). Do NOT set M146_CAND:
    # that would enable every loop e2e and fail ISOLATION_UNAVAILABLE without the userns wrapper.
    # M203 e2e stays skipped on CI (needs runLoopTask isolation); its pure/mutation cases still run.
    env:
      M202_CAND: peaceai-cand3
      M204_CAND: peaceai-cand3
      PEACEAI_VERIFIER_UID: peaceai-verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Python runtime for the M9 model tests (numpy only, hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/lm-venv"
          "$RUNNER_TEMP/lm-venv/bin/pip" install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r peaceai/model/requirements.txt
          echo "PEACEAI_PYTHON=$RUNNER_TEMP/lm-venv/bin/python" >> "$GITHUB_ENV"
      - name: Create peaceai-cand3 and peaceai-verify for oop-v1 e2e (M202/M204)
        run: |
          # Candidate for verifier.ts sudo -u (not the loop userns path) and a THIRD verifier uid.
          # Verifier has no sudo of its own.
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin peaceai-cand3
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin peaceai-verify
          # Minimum grants used by verifier.ts for the judge uid (GHA runner already has broader
          # NOPASSWD:ALL; this documents and covers the verify-specific need on hosts that do not).
          printf '%s\n' \
            'runner ALL=(peaceai-verify) NOPASSWD: ALL' \
            'runner ALL=(root) NOPASSWD: /usr/bin/install' \
            | sudo tee /etc/sudoers.d/peaceai-verify >/dev/null
          sudo chmod 440 /etc/sudoers.d/peaceai-verify
          sudo visudo -cf /etc/sudoers.d/peaceai-verify
      - name: Assert oop-v1 uids are set and reachable (no silent M202/M204 e2e skip in CI)
        run: |
          test -n "$M202_CAND"
          test -n "$M204_CAND"
          test -n "$PEACEAI_VERIFIER_UID"
          test "$M202_CAND" != "$PEACEAI_VERIFIER_UID"
          test "$M204_CAND" != "$PEACEAI_VERIFIER_UID"
          # Must not enable the loop-isolation e2e matrix on CI.
          test -z "${M146_CAND:-}"
          test -z "${M203_CAND:-}"
          id -u "$M202_CAND" >/dev/null
          id -u "$PEACEAI_VERIFIER_UID" >/dev/null
          sudo -n -u "$M202_CAND" -- true
          sudo -n -u "$PEACEAI_VERIFIER_UID" -- true
          # verifier must not itself have sudo (m204-guard:has-sudo)
          if sudo -n -u "$PEACEAI_VERIFIER_UID" -- sudo -n true 2>/dev/null; then
            echo "peaceai-verify must not have sudo" >&2
            exit 1
          fi
          # install -d -o <verifier> must work (verdict dir)
          D="$RUNNER_TEMP/peaceai-verify-dir-check"
          sudo -n install -d -o "$PEACEAI_VERIFIER_UID" -m 0755 "$D"
          test "$(stat -c %U "$D")" = "$PEACEAI_VERIFIER_UID"
          sudo -n rm -rf -- "$D"
      - run: npm run typecheck
      - name: Source corrections valid + add-only against the base revision (M119)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            ./node_modules/.bin/tsx peaceai/bin/source-corrections-check.ts --base "$BASE_SHA"
          else
            ./node_modules/.bin/tsx peaceai/bin/source-corrections-check.ts
          fi
      - run: npm test
      - run: npm run test:tools
      - run: npm run test:self

  tamper-proof:
    name: tamper-proof
    runs-on: ubuntu-24.04
    # 10 min of work + check-approved-list.ts waiting out a GitHub rate limit for at most 17 min (gh-ratelimit.ts; m155).
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Create the unprivileged candidate user (same as Job B)
        run: sudo useradd --system --no-create-home --shell /usr/sbin/nologin peaceai-cand
      - name: Same read-only tools as Job B
        run: chmod -R a-w node_modules peaceai package.json package-lock.json tsconfig.json
      - name: Every approved learned rule traces to Peace's /approve-rule comment; list changes only via approval branches (M8)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./node_modules/.bin/tsx peaceai/bin/check-approved-list.ts
      - name: A malicious candidate cannot forge its recorded result
        env:
          PROOF_SANDBOX_USER: peaceai-cand
        run: ./node_modules/.bin/tsx peaceai/proof/tamper-proof.ts

name: peace-approve-rule

# M8: the ONLY writer of peaceai/rules/approved.json (also under CODEOWNERS).
#  - workspace: Peace's `/approve-rule <hash>` comment on a Workspace rule-proposal issue (public rules).
#  - results-read + results-write: approvals of core-mined rules happen on private PeaceAI-Results issues;
#    the Results workflow (peaceai/results-repo/) validates the comment there and writes an attestation.
#    This sync reads the attestations (results-read), checks the core spec hash against a core checkout
#    (results-verify, proposes a list only), then re-reads every new entry's attestation from a fresh Results
#    clone and fails closed on any mismatch (results-reverify). results-land pushes one approval branch with the
#    workflow token, opens the PR and starts the required checks on it by workflow_dispatch (no deploy key).
#    No core text leaves core or Results. Nothing here ever pushes to main: the only push is an approval branch, merged after checks.
# Every list change lands as a PR whose commit message cites the approval comment(s), after required checks.
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      push_proof:
        description: "Push proof only: results-land shows its workflow token cannot push to main (lands nothing)"
        type: boolean
        default: false

permissions: {}

# #273 prep: one group per approval issue, so a second /approve-rule queues on its own issue instead of replacing
# (dropping) the single pending run of a shared group. cron / dispatch runs keep one group per event.
concurrency:
  group: peace-approve-rule-${{ github.event.issue.number || github.event_name }}
  cancel-in-progress: false

jobs:
  workspace:
    name: approve a public rule (Workspace comment)
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'PeaceG03/PeaceAI-Workspace' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'rule-proposal') &&
      github.event.comment.user.login == 'PeaceG03' &&
      startsWith(github.event.comment.body, '/approve-rule')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    outputs:
      changed: ${{ steps.approve.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Validate the approval comment against the proposal and the spec
        id: approve
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          PEACEAI_MESSAGE_FILE: ${{ runner.temp }}/approval-message.txt
        run: ./node_modules/.bin/tsx peaceai/bin/approve-rule.ts workspace
      - name: Hand the list change to the landing job
        if: steps.approve.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/landing"
          cp peaceai/rules/approved.json "$RUNNER_TEMP/landing/approved.json"
          cp "$RUNNER_TEMP/approval-message.txt" "$RUNNER_TEMP/landing/approval-message.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.approve.outputs.changed == 'true'
        with:
          name: peaceai-landing
          path: ${{ runner.temp }}/landing
          retention-days: 1
          if-no-files-found: error
      - name: Report on the proposal issue
        if: always()
        env:
          OK: ${{ steps.approve.outputs.ok }}
          REASON: ${{ steps.approve.outputs.reason }}
          CHANGED: ${{ steps.approve.outputs.changed }}
        run: |
          case "$REASON" in ''|[A-Z_]*) ;; *) REASON=UNKNOWN ;; esac
          if [ "$OK" = "true" ] && [ "$CHANGED" = "true" ]; then
            body="Approval validated. The landing job opens the list PR and merges it after the required checks."
          elif [ "$OK" = "true" ] && [ "$REASON" = "NOTHING_NEW" ]; then
            body="Nothing to record."
          else
            body="Approval not recorded (${REASON:-NOT_LANDED}). Usage: \`/approve-rule <sha256 from this proposal>\`, by PeaceG03."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

  results-read:
    name: read Results approval attestations
    if: github.event_name != 'issue_comment' && github.ref == 'refs/heads/main' && inputs.push_proof != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: peaceai-results
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clone Results (read only use) and collect attestations with their commits
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          ./peaceai/bin/with-deploy-key.sh git clone --quiet --no-tags git@github.com:PeaceG03/PeaceAI-Results.git "$RUNNER_TEMP/results" >/dev/null 2>&1
          mkdir -p "$RUNNER_TEMP/attestations"
          for f in "$RUNNER_TEMP"/results/rules/approvals/*.json; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            case "$name" in [0-9a-f]*.json) ;; *) continue ;; esac
            cp "$f" "$RUNNER_TEMP/attestations/$name"
            commit="$(git -C "$RUNNER_TEMP/results" log -1 --format=%H -- "rules/approvals/$name")"
            message="$(git -C "$RUNNER_TEMP/results" log -1 --format=%B "$commit")"
            COMMIT="$commit" MESSAGE="$message" node -e 'process.stdout.write(JSON.stringify({commit:process.env.COMMIT,message:process.env.MESSAGE}))' > "$RUNNER_TEMP/attestations/${name%.json}.commit.json"
          done
          rm -rf "$RUNNER_TEMP/results"
          echo "attestations=$(find "$RUNNER_TEMP/attestations" -name '*.commit.json' | wc -l)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peaceai-attestations
          path: ${{ runner.temp }}/attestations
          retention-days: 1
          if-no-files-found: ignore

  results-verify:
    name: verify Results attestations against core
    needs: results-read
    if: github.event_name != 'issue_comment' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: peaceai-core
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.approve.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: peaceai-attestations
          path: ${{ runner.temp }}/attestations
      - name: Clone core (read-only key, outside the workspace)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_CORE_DEPLOY_KEY }}
        run: ./peaceai/bin/clone-core.sh "$RUNNER_TEMP/peaceai-core"
      - name: Verify attestations against the core spec hashes (writes the proposed list only)
        id: approve
        env:
          PEACEAI_ATTESTATIONS_DIR: ${{ runner.temp }}/attestations
          PEACEAI_CORE_DIR: ${{ runner.temp }}/peaceai-core
          PEACEAI_APPROVED_LIST_OUT: ${{ runner.temp }}/proposed/approved.json
        run: |
          mkdir -p "$RUNNER_TEMP/proposed"
          cp peaceai/rules/approved.json "$RUNNER_TEMP/proposed/approved.json"
          ./node_modules/.bin/tsx peaceai/bin/approve-rule.ts sync
      - name: Delete core
        if: always()
        run: rm -rf "$RUNNER_TEMP/peaceai-core" "$RUNNER_TEMP"/peaceai-ssh.*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.approve.outputs.changed == 'true'
        with:
          name: peaceai-proposed-list
          path: ${{ runner.temp }}/proposed/approved.json
          retention-days: 1
          if-no-files-found: error

  results-reverify:
    name: re-verify against a fresh Results clone
    needs: results-verify
    if: needs.results-verify.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: peaceai-results
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.reverify.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: peaceai-proposed-list
          path: ${{ runner.temp }}/proposed
      - name: Fresh Results clone; re-verify every new entry against its attestation (fail closed)
        id: reverify
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
          PEACEAI_PROPOSED_LIST: ${{ runner.temp }}/proposed/approved.json
          PEACEAI_RESULTS_DIR: ${{ runner.temp }}/results
          PEACEAI_APPROVED_LIST_OUT: ${{ runner.temp }}/landing/approved.json
          PEACEAI_MESSAGE_FILE: ${{ runner.temp }}/landing/approval-message.txt
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/landing"
          cp peaceai/rules/approved.json "$RUNNER_TEMP/landing/approved.json"
          ./peaceai/bin/with-deploy-key.sh git clone --quiet --no-tags git@github.com:PeaceG03/PeaceAI-Results.git "$RUNNER_TEMP/results" >/dev/null 2>&1
          status=0
          ./node_modules/.bin/tsx peaceai/bin/approve-rule.ts reverify || status=$?
          rm -rf "$RUNNER_TEMP/results"
          exit "$status"
      - name: Fail closed unless the re-verification passed
        if: steps.reverify.outputs.ok != 'true'
        run: |
          echo "Results re-verification refused the proposed list; nothing is landed."
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.reverify.outputs.changed == 'true'
        with:
          name: peaceai-landing
          path: ${{ runner.temp }}/landing
          retention-days: 1
          if-no-files-found: error

  results-land:
    # Pushes one peaceai-approve-rule/ branch with the workflow token (no deploy key, no environment), opens
    # the PR, dispatches the required checks on that branch, polls the head commit's check-runs and
    # squash-merges. No artifact upload here. On a push_proof dispatch it only tries (and must fail) to push main.
    name: land the re-verified list by PR
    needs: [workspace, results-reverify]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (inputs.push_proof == true ||
       needs.workspace.outputs.changed == 'true' || needs.results-reverify.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # #286: dispatched checks (<=25 min) + held-run approval wait (<=25 min)
    permissions:
      contents: write
      pull-requests: write
      issues: read
      # gh workflow run: start leak-check.yml and ci.yml on the approval branch (the one trigger the token may use).
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.push_proof != true
        with:
          name: peaceai-landing
          path: ${{ runner.temp }}/landing
      - name: Put the re-verified list in place and check it
        if: inputs.push_proof != true
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/landing/approved.json" peaceai/rules/approved.json
          ./node_modules/.bin/tsx peaceai/bin/check-approved-list.ts
      - name: Land the list change (token branch push, PR, dispatched required checks, squash merge), or the push proof
        env:
          PUSH_PROOF: ${{ inputs.push_proof == true }}
        run: |
          if [ "$PUSH_PROOF" = "true" ]; then ./peaceai/bin/push-proof-main.sh; else ./peaceai/bin/approve-rule-pr.sh "$RUNNER_TEMP/landing/approval-message.txt"; fi

  approval-catchup:
    # M82: a late "Approve and run" no longer strands an approval PR. results-land gives up after its waits and
    # leaves the PR open; this hourly pass re-verifies such a PR from scratch (approve-rule-catchup.ts:
    # bot-opened approval branch, one bot commit changing only the list, exactly one commit ahead, main's list
    # unchanged since, the entry re-validated against Peace's /approve-rule and the spec sha on main, the
    # required checks and the PR's own pull_request runs green on the exact head) and only then squash-merges
    # it with --match-head-commit. It pushes nothing, updates no branch, approves no run and uses no secret.
    name: land a re-verified approval PR the landing job gave up on
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.push_proof != true))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Re-verify open approval PRs and land at most one (exact head, squash)
        run: ./node_modules/.bin/tsx peaceai/bin/approve-rule-catchup.ts

name: peace-model-v1-dev

# M167 model-v1 dev run (peaceai/spec/edit-proposer-model-v1.md; Auditor rulings a-f). Manual dispatch on main only.
# Two jobs, so no job that runs candidate code ever holds the weights:
#   model-v1-score (environment peaceai-results; runs NO candidate code): FIRST rebuilds repair-v1's candidate lists
#     for the public dev tasks (anonymous clones, no install, no tests; no key and no weights on the runner yet), THEN
#     restores the Results LM pinned in peaceai/model/model-v1-proposer.json by its weights sha256 (model-v1-fetch.sh,
#     fetch only), scores the lists with NO network (unshare --net; lib/modelscore.ts offline + scoringJobAllowed +
#     lm.ts verifyModelDir: the pinned LM's strict memcheck is FAIL, it is accepted via the core-free-64 recheck bound
#     to its config, tokenizer and weights shas, for dev-split use only) and deletes the model. Step logs are filtered
#     to the counts lines. Its only result is the ranking: one compact JSON line of index lists (no code, no text),
#     size- and schema-checked with jq, handed to the next job as two job outputs, ranking and ranking_sha256.
#     No artifact, no cache, no upload.
#   model-v1-attempt (no environment, no secrets, PEACEAI_CANDIDATE_JOB): runs bin/loop.ts at the pinned --max on the
#     pinned public task file for repair-v1, model-v1 (whose ranking must hash to ranking_sha256 and bind each task
#     key and candidate list, else every task is PROPOSER_FAILED) and rules-v1, with the team tests as the
#     peaceai-cand uid, with this runner's tools read-only as in Job B (only the loop log is writable); prints the
#     appended loop rows (public set: codes and numbers) and their sha256. The job fails unless every loop run exits 0
#     and each proposer wrote exactly one row per task of the task file (12); a refused ranking fails the job.
# Counts-only logs; dev split only, no hidden data anywhere; no gain claim.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: peace-model-v1-dev
  cancel-in-progress: false

env:
  PIN: peaceai/model/model-v1-proposer.json
  KEY_SCRIPTS_SHA256: |-
    bee71029e4a528f4ea7a9aae3c25d8591f4f35db398c9fb24cf11d645b4b355e  peaceai/bin/with-deploy-key.sh
    c6b22d38ae980d77dd41ab849be815b1105abcbef8c1bb5190cfd4d55e167f8f  peaceai/bin/model-v1-fetch.sh

jobs:
  model-v1-score:
    name: score repair-v1's candidates with the pinned Results LM (no candidate code; no network while scoring)
    if: github.repository == 'PeaceG03/PeaceAI-Workspace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: peaceai-results
    permissions:
      contents: read
    outputs:
      ranking: ${{ steps.score.outputs.ranking }}
      ranking_sha256: ${{ steps.score.outputs.ranking_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Install hash-pinned numpy
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps --require-hashes -r peaceai/model/requirements.txt
      - name: Build repair-v1's candidate lists for the public dev tasks first (anonymous clones; no key, no weights yet; counts line only)
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsx peaceai/bin/model-v1-score.ts candidates --out "$RUNNER_TEMP/candidates.json" 2>&1 \
            | grep -E '^(candidates tasks=[0-9]+ lists=[0-9]+ nonEmpty=[0-9]+ candidates=[0-9]+ refused=[A-Za-z0-9_:,-]+|refused [A-Z0-9_]+)$'
      - name: Verify the checkout and the key scripts before any key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$KEY_SCRIPTS_SHA256" | sha256sum -c --quiet - || { echo "key script hash mismatch: key refused"; exit 1; }
      - name: Restore the pinned model by its weights sha256 (fetch only)
        env:
          # The peaceai-results environment holds only the Results deploy key; this step only clones with it.
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "${DEPLOY_KEY:-}" ] || { echo "PEACEAI_RESULTS_DEPLOY_KEY is not set: refused (fail closed)"; exit 1; }
          ./peaceai/bin/model-v1-fetch.sh "$RUNNER_TEMP/m"
      - name: Score with no network (unshare --net), emit the ranking as job outputs, nothing else
        id: score
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && test -z "$(git status --porcelain --untracked-files=all)" || { echo "checkout changed: refused"; exit 1; }
          R="$RUNNER_TEMP/ranking.json"
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
            PEACEAI_PYTHON="$RUNNER_TEMP/venv/bin/python" GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_JOB="$GITHUB_JOB" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REF="$GITHUB_REF" \
            ./node_modules/.bin/tsx peaceai/bin/model-v1-score.ts score --candidates "$RUNNER_TEMP/candidates.json" --model "$RUNNER_TEMP/m" --out "$R" 2>&1 \
            | grep -E '^(scored model=[a-z0-9-]+ lists=[0-9]+ candidates=[0-9]+ reordered=[0-9]+ bytes=[0-9]+|refused [A-Z0-9_]+)$'
          test -s "$R" && test "$(wc -l < "$R")" = 0 || { echo "ranking is not one line: refused"; exit 1; }
          # size and exact schema before the ranking becomes a job output (the attempt job checks it again, with its binding)
          [ "$(stat -c %s "$R")" -le 65536 ] || { echo "ranking over 64 KiB: refused"; exit 1; }
          T=$(jq -r .taskFile "$PIN"); [ "$T" = peaceai/plan/tasks-public-v1.json ] || { echo "not the public dev task file: refused"; exit 1; }
          jq -e --arg tf "$(sha256sum "$T" | cut -c1-64)" --argjson n "$(jq '.tasks | length' "$T")" '
            def h(k): type == "string" and test("^[0-9a-f]{" + (k | tostring) + "}$");
            type == "object" and keys == ["entries", "modelManifestSha256", "schema", "taskFileSha256", "weightsSha256"]
            and .schema == "peaceai-model-v1-ranking:v1" and .taskFileSha256 == $tf and (.weightsSha256 | h(64)) and (.modelManifestSha256 | h(64))
            and (.entries | type == "array" and length == $n and ([.[].taskKey] | unique | length) == $n and all(
              type == "object" and keys == ["bindingSha256", "candidatesSha256", "order", "taskKey"]
              and (.taskKey | h(16)) and (.candidatesSha256 | h(64)) and (.bindingSha256 | h(64))
              and (.order | type == "array" and length <= 60 and (unique | length) == length and all(type == "number" and . >= 0 and . < 60 and floor == .))))
          ' "$R" > /dev/null || { echo "ranking fails the schema check: refused"; exit 1; }
          s=$(sha256sum "$R" | cut -c1-64)
          { echo "ranking=$(cat "$R")"; echo "ranking_sha256=$s"; } >> "$GITHUB_OUTPUT"
          echo "ranking sha256 $s"
      - name: Delete the model, the candidate lists and the ranking file
        if: always()
        run: rm -rf "$RUNNER_TEMP/m" "$RUNNER_TEMP/candidates.json" "$RUNNER_TEMP/ranking.json" "$RUNNER_TEMP/venv" "$RUNNER_TEMP"/peaceai-ssh.*

  model-v1-attempt:
    name: loop runs at the pinned --max (repair-v1, model-v1, rules-v1) as the candidate uid; no weights, no secrets
    needs: model-v1-score
    if: github.repository == 'PeaceG03/PeaceAI-Workspace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      PEACEAI_CANDIDATE_JOB: "true"
      PEACEAI_STAGE2_CAND: peaceai-cand
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Create the unprivileged candidate user (same as Job B)
        run: sudo useradd --system --no-create-home --shell /usr/sbin/nologin peaceai-cand
      - name: Pre-flight (fail closed) - the candidate uid can traverse and write the deps dir (M169, run 41488888877)
        # The install cache was under $RUNNER_TEMP (inside the runner's home), which the candidate uid cannot enter, so
        # every install ended DEPS_INSTALL_FAILED. The deps dir is now a fresh dir under /tmp; this step proves the
        # candidate uid can reach it and write a dir it owns there before any loop runs, else the job stops here.
        run: |
          set -euo pipefail
          if sudo -n -u peaceai-cand -- test -x "$RUNNER_TEMP"; then echo "runner-temp candidate-traversable=yes"; else echo "runner-temp candidate-traversable=no"; fi
          # octal modes only (settles the 0750 theory on the next run); "none" if the path is missing
          if m=$(stat -c %a /home/runner 2>/dev/null); then echo "mode home-runner=$m"; else echo "mode home-runner=none"; fi
          if m=$(stat -c %a "$(dirname "$RUNNER_TEMP")" 2>/dev/null); then echo "mode runner-temp-parent=$m"; else echo "mode runner-temp-parent=none"; fi
          D=$(mktemp -d /tmp/peaceai-deps.XXXXXX); chmod 755 "$D"
          P="$D/preflight"; mkdir "$P"; sudo -n chown peaceai-cand: "$P"
          sudo -n -u peaceai-cand -- test -x "$D" || { echo "refused DEPS_DIR_CAND_NO_TRAVERSE"; exit 1; }
          sudo -n -u peaceai-cand -- sh -c 'touch "$1/w" && rm "$1/w"' sh "$P" || { echo "refused DEPS_DIR_CAND_NO_WRITE"; exit 1; }
          sudo -n rm -rf -- "$P"
          echo "PEACEAI_DEPS_DIR=$D" >> "$GITHUB_ENV"
          echo "deps dir pre-flight ok"
      - name: Make this runner's tools read-only (same as Job B; only the loop log it appends to stays writable)
        run: |
          chmod -R a-w node_modules peaceai package.json package-lock.json tsconfig.json
          chmod u+w peaceai/plan/loop-runs.jsonl
      - name: The ranking from the scoring job (job outputs only; checked by bin/loop.ts against ranking_sha256)
        env:
          RANKING: ${{ needs.model-v1-score.outputs.ranking }}
        run: printf '%s' "$RANKING" > "$RUNNER_TEMP/ranking.json"
      - name: Loop runs (repair-v1, then model-v1, then rules-v1) at the pinned --max on the pinned public dev task file
        env:
          RANKING_SHA256: ${{ needs.model-v1-score.outputs.ranking_sha256 }}
        run: |
          set -euo pipefail
          T=$(jq -r .taskFile "$PIN"); M=$(jq -r .maxAttempts "$PIN")
          [ "$T" = peaceai/plan/tasks-public-v1.json ] || { echo "not the public dev task file: refused"; exit 1; }
          N=$(jq '.tasks | length' "$T"); [ "$N" = 12 ] || { echo "task file has $N tasks, not 12: refused"; exit 1; }
          L=peaceai/plan/loop-runs.jsonl; n0=$(wc -l < "$L")
          # every run is attempted and its exit code kept; the job fails below (after printing the rows) unless all are 0
          r1=0; ./node_modules/.bin/tsx peaceai/bin/loop.ts run "$T" --max "$M" --proposer repair-v1 --deps-dir "$PEACEAI_DEPS_DIR" || r1=$?
          r2=0; ./node_modules/.bin/tsx peaceai/bin/loop.ts run "$T" --max "$M" --proposer model-v1 --ranking "$RUNNER_TEMP/ranking.json" --ranking-sha256 "$RANKING_SHA256" --deps-dir "$PEACEAI_DEPS_DIR" || r2=$?
          r3=0; ./node_modules/.bin/tsx peaceai/bin/loop.ts run "$T" --max "$M" --proposer rules-v1 --deps-dir "$PEACEAI_DEPS_DIR" || r3=$?
          # the appended rows (public set: codes and numbers only), for Builder to commit verbatim; their sha256 binds the copy
          tail -n +"$((n0 + 1))" "$L" > "$RUNNER_TEMP/rows.jsonl"
          ! jq -e 'select(.set != "public")' "$RUNNER_TEMP/rows.jsonl" > /dev/null || { echo "a non-public row: refused to print"; exit 1; }
          cat "$RUNNER_TEMP/rows.jsonl"
          echo "appended rows $(wc -l < "$RUNNER_TEMP/rows.jsonl"), sha256 $(sha256sum < "$RUNNER_TEMP/rows.jsonl" | cut -c1-64)"
          echo "loop exit codes repair-v1=$r1 model-v1=$r2 rules-v1=$r3"
          [ "$r1" = 0 ] && [ "$r2" = 0 ] && [ "$r3" = 0 ] || { echo "a loop run exited non-zero (a refused model-v1 ranking exits 1): job failed"; exit 1; }
          for p in repair-v1 model-v1 rules-v1; do
            k=$(jq -s --arg p "$p" 'map(select(.proposer == $p)) | length' "$RUNNER_TEMP/rows.jsonl")
            [ "$k" = "$N" ] || { echo "$p wrote $k rows, not $N: job failed"; exit 1; }
          done

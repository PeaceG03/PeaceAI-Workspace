name: peace-lm-train

# M31 (Architect): trains the from-scratch PeaceAI LM on a free runner. M37: the corpus is the M36 external
# pretraining corpus, rebuilt from the committed provenance manifest (peaceai/model/ext-manifest.jsonl) by
# ext-fetch.ts: each licensed repo (and Peace's public repos) at its pinned commit, with every file's sha256 checked
# against the manifest. No private code is cloned, no external model or weights are downloaded, and nothing about the
# model reaches this public repository: no artifacts, quiet logs (counts and step metrics only). Weights land only in
# Results through results-write.sh. No latest.json is written, so every loader refuses the model until the model
# memcheck (on the box, against core) passes. Stage: pretrain only; finetune is a reserved hook and is refused.
# lb-train v1 first run (Auditor ruling after #654; input run=lb-first-run, main only, refused on any other ref): the
# cleared lb-clean corpus is rebuilt in-run at b149d9b and refused unless its three pins match; train.py runs with
# easy_to_hard, adamw8bit, early stopping and a deadline inside the job cap (no LoRA, no replay). Weights, checkpoints
# and the corpus never leave the runner (no artifacts, no cache, no R2); Results gets one metrics-only add-only row
# runs/lb-train/<run id>.json (pins, shas, steps, stop reason, held-out and unigram-baseline bpb, wall time).
on:
  workflow_dispatch:
    inputs:
      run:
        description: "ext-pretrain (M37, lands the model in Results) or lb-first-run (lb-train v1: metrics row only)"
        type: choice
        options:
          - ext-pretrain
          - lb-first-run
        default: ext-pretrain

permissions: {}

concurrency:
  group: peace-lm-train
  cancel-in-progress: false

jobs:
  lb-ref-gate:
    name: lb-first-run ref gate (main only)
    if: inputs.run == 'lb-first-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse unless dispatched from main
        run: test "$GITHUB_REF" = refs/heads/main || { echo "LB_RUN_REF_NOT_MAIN"; exit 1; }

  lb-first-run:
    name: lb-train v1 first run (weights stay on the runner; one metrics row in Results)
    needs: lb-ref-gate
    if: inputs.run == 'lb-first-run' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment: peaceai-results
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      KEY_SCRIPTS_SHA256: |
        bee71029e4a528f4ea7a9aae3c25d8591f4f35db398c9fb24cf11d645b4b355e  peaceai/bin/with-deploy-key.sh
        da2a4c6e32d3f6dc2e5587767bf4e01885b37e4011ce3a223ea7493506600e42  peaceai/bin/results-write.sh
    steps:
      - name: Record the job start (the training deadline is measured from here)
        run: echo "LB_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install hash-pinned numpy
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps --require-hashes -r peaceai/model/requirements.txt
      - name: Rebuild the cleared corpus at b149d9b (anonymous, read-only; lb-clean with the hidden drop hashes)
        run: ./peaceai/bin/lb-corpus-rebuild.sh "$RUNNER_TEMP/lbc"
      - name: Pin check, train (easy_to_hard, adamw8bit, early stop and deadline; no LoRA, no replay), held-out bpb vs unigram baseline
        env:
          PY: ${{ runner.temp }}/venv/bin/python
        run: ./peaceai/bin/lb-first-run.sh "$RUNNER_TEMP/lbc/out" "$RUNNER_TEMP/lbw" "$RUNNER_TEMP/lbm" "$RUNNER_TEMP/lb-row.json"
      - name: Verify the checkout and the key scripts before the key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s' "$KEY_SCRIPTS_SHA256" | sha256sum -c --quiet - || { echo "key script hash mismatch: key refused"; exit 1; }
      - name: Record one metrics-only row in Results (runs/lb-train/<run id>.json, new file only; no weights, no latest.json)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
        run: |
          ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh --sparse "/runs/lb-train/$GITHUB_RUN_ID.json" "lb-train v1 first run metrics (run $GITHUB_RUN_ID)" \
            python3 peaceai/model/lb_run.py land --row "$RUNNER_TEMP/lb-row.json" --run-id "$GITHUB_RUN_ID"
      - name: Remove the corpus, work and model dirs (nothing leaves the runner)
        if: always()
        run: rm -rf "$RUNNER_TEMP/lbc" "$RUNNER_TEMP/lbw" "$RUNNER_TEMP/lbm" "$RUNNER_TEMP/lbw.log" "$RUNNER_TEMP/lb-row.json" "$RUNNER_TEMP/venv"

  train:
    name: train LM (external pretrain corpus)
    if: github.ref == 'refs/heads/main' && inputs.run == 'ext-pretrain'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment: peaceai-results
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage gate (the stage comes from ext-train.json; finetune is a reserved hook, refused until built)
        run: |
          set -euo pipefail
          stage=$(jq -r .stage peaceai/model/ext-train.json)
          if [ "$stage" != pretrain ]; then echo "stage $stage refused: only pretrain is built"; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling and hash-pinned numpy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps --require-hashes -r peaceai/model/requirements.txt
      - name: Fetch the corpus from the provenance manifest (anonymous, read-only, sha256 per file)
        run: ./node_modules/.bin/tsx peaceai/bin/ext-fetch.ts "$RUNNER_TEMP/src" "$RUNNER_TEMP/corpus" --manifest-sha 8458eac61cc414128e98eedb6c3b3ad9c50813e62ab680f5a9ef9d909ccfc231
      - name: Manifest check (stage, provenance, sha256, A/B/C and set C v2 hashes, set C v2 repos, whole-corpus memcheck record)
        run: ./node_modules/.bin/tsx peaceai/bin/ext-manifest-check.ts "$RUNNER_TEMP/corpus" pretrain --manifest-sha 8458eac61cc414128e98eedb6c3b3ad9c50813e62ab680f5a9ef9d909ccfc231
      - name: Train (ctx 512, CPU, early stopping) and export
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/venv/bin/python"
          m() { jq -r ".model.$1" peaceai/model/ext-train.json; }
          "$py" peaceai/model/train.py --corpus "$RUNNER_TEMP/corpus" --work "$RUNNER_TEMP/work" \
            --ctx "$(m ctx)" --d-model "$(m d_model)" --n-layer "$(m n_layer)" --n-head "$(m n_head)" --vocab "$(m vocab)" --batch "$(m batch)" \
            --steps "$(m steps)" --eval-every 50 --patience 4 --threads 4 --max-seconds 14400 > "$RUNNER_TEMP/train.log" 2>&1 \
            || { echo "train failed exit=$?"; exit 1; }
          grep -E '^(params=|tokens |best val_loss|stopped )' "$RUNNER_TEMP/train.log" || true
          ck=best.npz; test -f "$RUNNER_TEMP/work/best.npz" || ck=checkpoint.npz
          "$py" peaceai/model/export.py --work "$RUNNER_TEMP/work" --out "$RUNNER_TEMP/model" --threads 4 --checkpoint "$ck" > /dev/null
          cp "$RUNNER_TEMP/work/metrics.jsonl" "$RUNNER_TEMP/model/train-metrics.jsonl"
          cp "$RUNNER_TEMP/corpus/manifest.jsonl" "$RUNNER_TEMP/model/manifest.jsonl"
          rm -rf "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/src"
          jq -r '"model \(.version) ctx=\(.ctx) params=\(.params)"' "$RUNNER_TEMP/model/config.json"
      - name: Set C v2 eval (only once wired by the Architect; aggregate loss only; NON-FATAL so a trained model is never lost)
        run: |
          if [ "$(jq -r .wiredAsEval peaceai/model/heldout-c.json)" != true ]; then echo "set C v2 not wired as eval: skipped"; exit 0; fi
          if ./node_modules/.bin/tsx peaceai/bin/ext-fetch.ts "$RUNNER_TEMP/csrc" "$RUNNER_TEMP/setc" --set-c \
            && "$RUNNER_TEMP/venv/bin/python" peaceai/model/eval_c.py --model "$RUNNER_TEMP/model" --corpus "$RUNNER_TEMP/setc" --threads 4 > "$RUNNER_TEMP/eval.txt"; then
            cat "$RUNNER_TEMP/eval.txt"; cp "$RUNNER_TEMP/eval.txt" "$RUNNER_TEMP/model/eval-setc-v2.txt"
          else
            echo "set C v2 eval FAILED (non-fatal): the model still lands; score it on the box"
          fi
          rm -rf "$RUNNER_TEMP/csrc" "$RUNNER_TEMP/setc" "$RUNNER_TEMP/eval.txt"
          exit 0
      - name: Land the model in Results only (no latest.json; refused until memcheck PASS)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
          MODEL_DIR: ${{ runner.temp }}/model
        run: |
          ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh "M37 external-pretrain LM (run $GITHUB_RUN_ID)" \
            bash -c 'set -euo pipefail
              v=$(jq -r .version "$MODEL_DIR/config.json")
              [[ "$v" =~ ^[A-Za-z0-9._-]+$ && "$v" != "." && "$v" != ".." ]] || { echo "landing refused: bad version"; exit 1; }
              if [ -n "$(find "$MODEL_DIR" -type l)" ]; then echo "landing refused: symlink in model dir"; exit 1; fi
              d="$RESULTS_DIR/models/lm/$v"; test ! -e "$d"; mkdir -p "$d"; cp -P "$MODEL_DIR"/* "$d"/
              git -C "$RESULTS_DIR" add -A
              staged=$(git -C "$RESULTS_DIR" diff --cached --name-only --no-renames) || exit 1
              prefix="models/lm/$v/"
              while IFS= read -r name; do
                [ -z "$name" ] && continue
                if [ "${name:0:${#prefix}}" != "$prefix" ]; then echo "landing refused: path outside models/lm/$v/"; exit 1; fi
              done <<< "$staged"'
          rm -rf "$RUNNER_TEMP/model" "$RUNNER_TEMP/work"

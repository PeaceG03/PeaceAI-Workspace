name: peace-lm-judge-v2

# Judge set v2 (Auditor, after the identity-gap audit; lands after PR #549): rebuild the LM judge set on
# free GitHub-hosted minutes and land it in Results under a NEW path, lm-judge-v2/ (append-only; lm-judge/ on
# notes/lm-judge-eval is never touched):
#   (1) the v1 items (JUDGE_SET=v1), the live model and its recorded v1 judge aggregates are fetched (no write) and checked
#       (peaceai/bin/lm-retrain-live.sh: live = lm-retrain.json replayBase, never latest.json; weights hash to the version, v1 item count pinned);
#   (2) each upstream function is read from its public repo at the head pinned in peaceai/model/judge-v2-sources.json
#       (git output discarded, so a failed fetch prints only the refusal line, never a repo URL);
#   (3) peaceai/bin/judge-v2-build.ts rebuilds each item's v1 grid (must reproduce the v1 held-out counts), runs the
#       upstream function on a wider grid from its own literals, drops items whose grid never shows that returning a
#       parameter is wrong, and re-labels the rest; items sha256 and counts must equal peaceai/model/judge-v2.json;
#   (4) judge364.py scores the live model on the v2 items; every kept item's aggregates must reproduce the live model's
#       recorded v1 aggregates (item texts are unchanged; tokens equal, mean within 1e-4, as the retrain), and the AUC
#       must equal the pinned one;
#   (5) only lm-judge-v2/ lands (items.json, build.json, scores-<live>.json, README.md); the path must not exist yet.
# Never: a retrain, a model change, latest.json, an artifact or a cache. Counts-only logs.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: peace-lm-judge-v2
  cancel-in-progress: false

env:
  CFG: peaceai/model/lm-retrain.json
  V2: peaceai/model/judge-v2.json
  RESULTS_SHA256: |-
    bee71029e4a528f4ea7a9aae3c25d8591f4f35db398c9fb24cf11d645b4b355e  peaceai/bin/with-deploy-key.sh
    da2a4c6e32d3f6dc2e5587767bf4e01885b37e4011ce3a223ea7493506600e42  peaceai/bin/results-write.sh

jobs:
  build-score-land:
    name: rebuild the judge set (v2), score the live model on it, land lm-judge-v2/ only
    if: github.repository == 'PeaceG03/PeaceAI-Workspace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: peaceai-results
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling and hash-pinned numpy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps --require-hashes -r peaceai/model/requirements.txt
      - name: Check the v2 pins against the sources file and the retrain config
        run: |
          set -euo pipefail
          S=$(jq -r .sources "$V2"); test "$S" = peaceai/model/judge-v2-sources.json || { echo "unexpected sources path"; exit 1; }
          test "$(sha256sum "$S" | cut -c1-64)" = "$(jq -r .sourcesSha256 "$V2")" || { echo "sources file differs from its pin: refused"; exit 1; }
          test "$(jq -r .v1.commit "$S")" = "$(jq -r .eval.judgeV1.commit "$CFG")" || { echo "sources are not for the pinned v1 judge commit: refused"; exit 1; }
          test "$(jq -r .live.version "$V2")" = "$(jq -r .replayBase.version "$CFG")" || { echo "v2 pins are not for the configured live model: refused"; exit 1; }
          test "$(jq -r .out "$V2")" = lm-judge-v2 || { echo "unexpected output path: refused"; exit 1; }
      - name: Verify the checkout and the key scripts before any key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$RESULTS_SHA256" | sha256sum -c --quiet - || { echo "key script hash mismatch: key refused"; exit 1; }
      - name: Restore the live model, the v1 items and the live model's recorded v1 aggregates (fetch only)
        env:
          # The peaceai-results environment holds only the Results deploy key (run 40462457225 failed closed on the
          # read key, which lives in peaceai-core). This step only clones and fetches with it; the land step writes.
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
          JUDGE_SET: v1
        run: |
          set -euo pipefail
          [ -n "${DEPLOY_KEY:-}" ] || { echo "PEACEAI_RESULTS_DEPLOY_KEY is not set: refused (fail closed)"; exit 1; }
          ./peaceai/bin/lm-retrain-live.sh "$RUNNER_TEMP/r"
      - name: Fetch each upstream function's public repo at its pinned head (no key)
        run: |
          set -euo pipefail
          up="$RUNNER_TEMP/up"; mkdir -p "$up"
          jq -r --slurpfile s peaceai/model/judge-v2-sources.json '[to_entries[] | "\(.value.repo) \($s[0].items[.key].head)"] | unique[]' "$RUNNER_TEMP/r/items.json" > "$RUNNER_TEMP/pairs.txt"
          n=0
          while read -r repo head; do
            [[ "$repo" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ && "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "bad repo or head: refused"; exit 1; }
            d="$up/${repo/\//__}"; [ -d "$d" ] || git init --quiet "$d" >/dev/null 2>&1
            env -u GIT_SSH_COMMAND GIT_TERMINAL_PROMPT=0 git -C "$d" fetch --quiet --depth 1 --filter=blob:none "https://github.com/$repo.git" "$head" >/dev/null 2>&1 || { echo "an upstream head could not be fetched: refused"; exit 1; }
            n=$((n + 1))
          done < "$RUNNER_TEMP/pairs.txt"
          echo "upstream heads fetched: $n"
      - name: Build the v2 items (must equal the pinned sha256 and counts)
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsx peaceai/bin/judge-v2-build.ts --items "$RUNNER_TEMP/r/items.json" --sources peaceai/model/judge-v2-sources.json --repos "$RUNNER_TEMP/up" --out "$RUNNER_TEMP/v2"
          B="$RUNNER_TEMP/v2/build.json"
          test "$(sha256sum "$RUNNER_TEMP/v2/items.json" | cut -c1-64)" = "$(jq -r .items.sha256 "$V2")" || { echo "v2 items differ from the pinned build: refused"; exit 1; }
          test "$(jq -c '.summary.v2' "$B")" = "$(jq -c '{n: .items.n, right: .items.right, wrong: .items.wrong}' "$V2")" || { echo "v2 counts differ from the pin: refused"; exit 1; }
          test "$(jq -c '.summary.dropped.reasons' "$B")" = "$(jq -c .dropped "$V2")" || { echo "v2 drops differ from the pin: refused"; exit 1; }
          rm -rf "$RUNNER_TEMP/up"
      - name: Score the live model on the v2 items (must reproduce its recorded per-item aggregates and the pinned AUC)
        run: |
          set -euo pipefail
          live=$(jq -r .replayBase.version "$CFG")
          "$RUNNER_TEMP/venv/bin/python" peaceai/model/judge364.py --model "$RUNNER_TEMP/r/live" --items "$RUNNER_TEMP/v2/items.json" --out "$RUNNER_TEMP/v2/scores-$live.json" --threads 4
          # Same rule as the retrain's scorer-repro check (peaceai/model/judge_repro.py): every kept item's key is in the
          # recorded v1 aggregates, token counts are equal and every mean is within 1e-4. The largest drift is printed.
          "$RUNNER_TEMP/venv/bin/python" peaceai/model/judge_repro.py "$RUNNER_TEMP/r/scores-live-recorded.json" "$RUNNER_TEMP/v2/scores-$live.json" --subset --drift \
            || { echo "aggregates differ from the recorded v1 aggregates (tokens equal, mean within 1e-4): refused"; exit 1; }
          # The AUC (3 dp), both 95% bounds (3 dp), n and the right / wrong counts must still equal the pins exactly.
          "$RUNNER_TEMP/venv/bin/python" - "$RUNNER_TEMP/v2/scores-$live.json" "$V2" <<'PY'
          import json, sys
          new, pin = (json.load(open(p)) for p in sys.argv[1:3])
          s = new["summary"]
          if (s["auc_derived_right_vs_wrong_mean"], s["auc_ci95"], s["n"], s["right"], s["wrong"]) != (pin["live"]["auc"], pin["live"]["auc_ci95"], pin["items"]["n"], pin["items"]["right"], pin["items"]["wrong"]):
              sys.exit("live AUC on v2 differs from the pin: refused")
          print(f"live model on judge v2: n={s['n']} auc={s['auc_derived_right_vs_wrong_mean']} aggregates reproduced={len(new['agg'])}")
          PY
      - name: Verify the checkout and the landing scripts before the key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$RESULTS_SHA256" | sha256sum -c --quiet - || { echo "landing script hash mismatch: key refused"; exit 1; }
      - name: Land lm-judge-v2/ in Results (new path only; nothing else changes)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
          V2_DIR: ${{ runner.temp }}/v2
        run: |
          set -euo pipefail
          live=$(jq -r .replayBase.version "$CFG"); export live
          cat > "$V2_DIR/README.md" <<EOF
          # LM judge set v2

          Built by peace-lm-judge-v2.yml run $GITHUB_RUN_ID at Workspace $GITHUB_SHA from lm-judge/items.json at
          notes/lm-judge-eval $(jq -r .eval.judgeV1.commit "$CFG") (peaceai/lib/judge-grid.ts). Item texts and keys are the
          v1 texts; labels are re-computed on wider held-out grids from each upstream function's own behaviour; items whose
          grid never shows that returning a parameter is wrong are dropped (build.json lists each drop and its reason).
          v1 labels are kept as labelV1. scores-$live.json: the live model on these items (aggregates reproduce v1: tokens equal, mean within 1e-4).
          EOF
          ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh "Judge set v2: lm-judge-v2/ (run $GITHUB_RUN_ID)" \
            bash -c 'set -euo pipefail
              d="$RESULTS_DIR/lm-judge-v2"
              test ! -e "$d" || { echo "lm-judge-v2/ already exists: refused (append-only)"; exit 1; }
              mkdir -p "$d"
              cp "$V2_DIR/items.json" "$V2_DIR/build.json" "$V2_DIR/scores-$live.json" "$V2_DIR/README.md" "$d/"
              git -C "$RESULTS_DIR" add -A
              while IFS= read -r name; do [ -z "$name" ] && continue
                case "$name" in lm-judge-v2/items.json|lm-judge-v2/build.json|lm-judge-v2/README.md|"lm-judge-v2/scores-$live.json") ;; *) echo "landing refused: unexpected path"; exit 1 ;; esac
              done <<< "$(git -C "$RESULTS_DIR" diff --cached --name-only --no-renames)"
              test -z "$(git -C "$RESULTS_DIR" diff --cached --name-only --no-renames --diff-filter=DMRT)" || { echo "landing refused: only new files"; exit 1; }'
      - name: Delete the model, the items and the clones
        if: always()
        run: rm -rf "$RUNNER_TEMP/r" "$RUNNER_TEMP/v2" "$RUNNER_TEMP/up" "$RUNNER_TEMP/pairs.txt" "$RUNNER_TEMP"/peaceai-ssh.* "$RUNNER_TEMP"/peaceai-results.*

name: peace-task

# One task per run. Runs are serialized by the concurrency group; a newer pending sweep replacing an
# older one loses nothing, because every sweep takes the oldest queued issue and each finished run
# starts another sweep while tasks are waiting. A schedule backs this up.
on:
  workflow_dispatch:
    inputs:
      force_visibility_fail:
        description: "Test only: treat the target's visibility check as failed (the task fails closed)"
        type: boolean
        default: false
  schedule:
    - cron: "*/30 * * * *"

permissions: {}

concurrency:
  group: peace-task
  cancel-in-progress: false

jobs:
  select:
    name: pick next task
    if: >-
      github.repository == 'PeaceG03/PeaceAI-Workspace' &&
      github.ref == 'refs/heads/main' &&
      vars.PEACEAI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
    outputs:
      # Empty unless the target is confirmed public and configured: later jobs never see a private target.
      issue: ${{ steps.target.outputs.run == 'true' && steps.pick.outputs.issue || '' }}
      source: ${{ steps.pick.outputs.source }}
      target: ${{ steps.target.outputs.target }}
      is_default: ${{ steps.target.outputs.is_default }}
      install: ${{ steps.target.outputs.install }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Pick the oldest queued owner task
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: select
        run: ./node_modules/.bin/tsx peaceai/bin/select.ts
      # M5: visibility through the GitHub API on every run. Not confirmed public (or not configured) means the
      # task fails closed here with a content-free comment, before anything of the target is fetched.
      - name: Resolve the target and check its visibility
        id: target
        if: steps.pick.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: select
          ISSUE_NUMBER: ${{ steps.pick.outputs.issue }}
          PEACEAI_FORCE_VISIBILITY_FAIL: ${{ inputs.force_visibility_fail == true }}
        run: ./node_modules/.bin/tsx peaceai/bin/target-check.ts
      - name: Chain the next sweep after a fail-closed task
        # `waiting` was counted before the pick, so it includes the task that just failed closed.
        if: steps.target.outputs.run == 'false' && fromJSON(steps.pick.outputs.waiting) > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run peace-task.yml --repo "$GITHUB_REPOSITORY" --ref main

  # M9: template gap fill by the from-scratch model. Off unless vars.PEACEAI_LM_FILL is exactly 'true'.
  # Reads only the public target and the memcheck-verified model from Results; writes fills.json, a value
  # chosen among literals already in the target. Weights are deleted before the upload.
  lm-fill:
    name: "LM gap fill (PEACEAI_LM_FILL)"
    needs: select
    if: needs.select.outputs.issue != '' && vars.PEACEAI_ENABLED == 'true' && vars.PEACEAI_LM_FILL == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: peaceai-results
    permissions:
      contents: read
      issues: read
    env:
      ISSUE_NUMBER: ${{ needs.select.outputs.issue }}
      PEACEAI_TARGET: ${{ needs.select.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Re-check the target is public
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.select.outputs.target }}
        run: ./node_modules/.bin/tsx peaceai/bin/target-check.ts
      - name: Clone the target anonymously (outside the workspace)
        if: needs.select.outputs.is_default != 'true'
        run: ./peaceai/bin/clone-target.sh "$PEACEAI_TARGET" "$RUNNER_TEMP/peaceai-target"
      - name: Fetch the task text
        env:
          GH_TOKEN: ${{ github.token }}
        run: ISSUE_JSON="$RUNNER_TEMP/issue.json" ./node_modules/.bin/tsx peaceai/bin/issue-fetch.ts
      - name: Python runtime for the LM (numpy only, hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/lm-venv"
          "$RUNNER_TEMP/lm-venv/bin/pip" install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r peaceai/model/requirements.txt
          echo "PEACEAI_PYTHON=$RUNNER_TEMP/lm-venv/bin/python" >> "$GITHUB_ENV"
      - name: Fetch the verified model from Results (outside the workspace)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
        run: ./peaceai/bin/with-deploy-key.sh git clone --quiet --depth 1 git@github.com:PeaceG03/PeaceAI-Results.git "$RUNNER_TEMP/results" >/dev/null 2>&1
      - name: Choose the gap value
        env:
          PEACEAI_LM_FILL: ${{ vars.PEACEAI_LM_FILL }}
        run: |
          mkdir -p "$RUNNER_TEMP/lm-fills"
          export ISSUE_JSON="$RUNNER_TEMP/issue.json" PEACEAI_FILLS_OUT="$RUNNER_TEMP/lm-fills/fills.json"
          PEACEAI_LM_MODEL_DIR="$RUNNER_TEMP/results/models/lm/$(node -p 'require(process.env.RUNNER_TEMP+"/results/models/lm/latest.json").version' 2>/dev/null || echo none)"
          export PEACEAI_LM_MODEL_DIR
          if [ "${{ needs.select.outputs.is_default }}" != "true" ]; then export PEACEAI_WORKSPACE_DIR="$RUNNER_TEMP/peaceai-target"; fi
          ./node_modules/.bin/tsx peaceai/bin/lm-fill.ts
      - name: Delete Results, the model and the target
        if: always()
        run: rm -rf "$RUNNER_TEMP/results" "$RUNNER_TEMP"/peaceai-ssh.* "$RUNNER_TEMP/peaceai-target" "$RUNNER_TEMP/issue.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peaceai-lm-fills
          path: ${{ runner.temp }}/lm-fills
          retention-days: 1
          if-no-files-found: ignore

  generate:
    name: "Job A: generate"
    needs: [select, lm-fill]
    if: >-
      always() && needs.select.result == 'success' &&
      needs.select.outputs.issue != '' && vars.PEACEAI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: peaceai-core
    permissions:
      contents: read
      issues: read
    outputs:
      candidates: ${{ steps.generate.outputs.candidates }}
      matrix: ${{ steps.generate.outputs.matrix }}
      # M10: the parse decision (enums only: canonical|parsed|unsure|off, a refusal code, a family name).
      nl: ${{ steps.generate.outputs.nl }}
      nl_reason: ${{ steps.generate.outputs.nl_reason }}
      nl_hint: ${{ steps.generate.outputs.nl_hint }}
    env:
      ISSUE_NUMBER: ${{ needs.select.outputs.issue }}
      PEACEAI_TARGET: ${{ needs.select.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Re-check the target is public
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.select.outputs.target }}
          PEACEAI_FORCE_VISIBILITY_FAIL: ${{ inputs.force_visibility_fail == true }}
        run: ./node_modules/.bin/tsx peaceai/bin/target-check.ts
      - name: Clone the target anonymously (outside the workspace)
        if: needs.select.outputs.is_default != 'true'
        run: ./peaceai/bin/clone-target.sh "$PEACEAI_TARGET" "$RUNNER_TEMP/peaceai-target"
      - name: Confirm the task is still live (remove the label to cancel)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ISSUE_JSON="$RUNNER_TEMP/issue.json" ./node_modules/.bin/tsx peaceai/bin/issue-fetch.ts
      - name: Clone core (read-only key, outside the workspace)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_CORE_DEPLOY_KEY }}
        run: ./peaceai/bin/clone-core.sh "$RUNNER_TEMP/peaceai-core"
      - name: Build the Actions kernel (synthesis, edit families, planner) and guard it
        run: ./peaceai/bin/build-kernel.sh "$RUNNER_TEMP/peaceai-core" "$RUNNER_TEMP/peaceai-kernel/kernel.cjs"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: vars.PEACEAI_LM_FILL == 'true' && needs.lm-fill.result == 'success'
        continue-on-error: true
        with:
          name: peaceai-lm-fills
          path: ${{ runner.temp }}/lm-fills
      - name: Generate candidates
        id: generate
        env:
          PEACEAI_LM_FILL: ${{ vars.PEACEAI_LM_FILL }}
          PEACEAI_LM_FILLS: ${{ runner.temp }}/lm-fills/fills.json
          # M10 kill switch: "off" uses the task text unchanged (pre-M10 behaviour); anything else parses.
          PEACEAI_NL_PARSE: ${{ vars.PEACEAI_NL_PARSE }}
        run: |
          export PEACEAI_KERNEL_BUNDLE="$RUNNER_TEMP/peaceai-kernel/kernel.cjs"
          export PEACEAI_OUT_DIR="$RUNNER_TEMP/peaceai-out"
          export ISSUE_JSON="$RUNNER_TEMP/issue.json"
          # M8: core-mined learned rules are read from the core checkout; the approved list from this repo.
          export PEACEAI_CORE_DIR="$RUNNER_TEMP/peaceai-core"
          if [ "${{ needs.select.outputs.is_default }}" != "true" ]; then export PEACEAI_WORKSPACE_DIR="$RUNNER_TEMP/peaceai-target"; fi
          ./node_modules/.bin/tsx peaceai/bin/generate.ts
          node -e 'const s=require(process.env.PEACEAI_OUT_DIR+"/summary.json");console.log("candidates="+s.candidates.length);console.log("matrix="+JSON.stringify(s.candidates.map(c=>c.id)))' >> "$GITHUB_OUTPUT"
      - name: Leak and scope gate
        run: |
          if [ "${{ needs.select.outputs.is_default }}" != "true" ]; then export PEACEAI_WORKSPACE_DIR="$RUNNER_TEMP/peaceai-target"; fi
          PEACEAI_OUT_DIR="$RUNNER_TEMP/peaceai-out" PEACEAI_CORE_DIR="$RUNNER_TEMP/peaceai-core" \
            ./node_modules/.bin/tsx peaceai/bin/gate.ts
      - name: Delete core
        if: always()
        run: rm -rf "$RUNNER_TEMP/peaceai-core" "$RUNNER_TEMP/peaceai-kernel" "$RUNNER_TEMP"/peaceai-ssh.* "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/peaceai-target"
      - name: Upload candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peaceai-candidates
          path: ${{ runner.temp }}/peaceai-out
          retention-days: 1
          if-no-files-found: error

  test:
    name: "Job B: test ${{ matrix.candidate }}"
    needs: [select, generate]
    if: needs.generate.outputs.candidates != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PEACEAI_TARGET: ${{ needs.select.outputs.target }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        candidate: ${{ fromJSON(needs.generate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: peaceai-candidates
          path: ${{ runner.temp }}/peaceai-in
      - name: Re-check the target is public
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.select.outputs.target }}
          PEACEAI_FORCE_VISIBILITY_FAIL: ${{ inputs.force_visibility_fail == true }}
        run: ./node_modules/.bin/tsx peaceai/bin/target-check.ts
      - name: Clone the target anonymously at the base commit and install its locked dependencies
        if: needs.select.outputs.is_default != 'true'
        env:
          INSTALL: ${{ needs.select.outputs.install }}
        run: |
          base="$(node -p 'require(process.env.RUNNER_TEMP+"/peaceai-in/summary.json").baseSha')"
          ./peaceai/bin/clone-target.sh "$PEACEAI_TARGET" "$RUNNER_TEMP/peaceai-target" "$base"
          ./peaceai/bin/install-target.sh "$RUNNER_TEMP/peaceai-target" "$INSTALL"
          chmod -R a-w "$RUNNER_TEMP/peaceai-target/node_modules"
      - name: Make this runner's tools read-only
        run: chmod -R a-w node_modules peaceai package.json package-lock.json tsconfig.json
      # Tamper-proof results: candidate code runs only as this unprivileged user, which cannot write
      # the harness, the candidate tree or the results path. The harness (runner user) captures the
      # exit codes, kills every process of this user, and only then writes the result file.
      - name: Create the unprivileged candidate user
        run: sudo useradd --system --no-create-home --shell /usr/sbin/nologin peaceai-cand
      - name: Test the candidate (original suite alone, then new tests alone)
        env:
          PEACEAI_ONLY_CANDIDATE: ${{ matrix.candidate }}
          PEACEAI_SANDBOX_USER: peaceai-cand
          PEACEAI_REQUIRE_SANDBOX: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/peaceai-testresults"
          if [ "${{ needs.select.outputs.is_default }}" != "true" ]; then export PEACEAI_WORKSPACE_DIR="$RUNNER_TEMP/peaceai-target"; fi
          PEACEAI_IN_DIR="$RUNNER_TEMP/peaceai-in" \
          PEACEAI_RESULTS_FILE="$RUNNER_TEMP/peaceai-testresults/$PEACEAI_ONLY_CANDIDATE.json" \
            ./node_modules/.bin/tsx peaceai/bin/test-candidates.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peaceai-test-${{ matrix.candidate }}
          path: ${{ runner.temp }}/peaceai-testresults
          retention-days: 1
          if-no-files-found: error

  regate:
    name: "Job B2: re-gate repaired candidates"
    needs: [select, generate, test]
    # M7: a candidate repaired in Job B is used only after the same leak/scope gate as Job A, with the core
    # (read-only key, deleted after). Without repairs the core is not cloned and the set passes through.
    if: >-
      always() && needs.generate.result == 'success' &&
      (needs.test.result == 'success' || needs.generate.outputs.candidates == '0')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: peaceai-core
    permissions:
      contents: read
    env:
      PEACEAI_TARGET: ${{ needs.select.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: peaceai-candidates
          path: ${{ runner.temp }}/peaceai-in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.generate.outputs.candidates != '0'
        with:
          pattern: peaceai-test-*
          merge-multiple: true
          path: ${{ runner.temp }}/peaceai-testresults
      - name: Any repaired candidates?
        id: repaired
        run: |
          if compgen -G "$RUNNER_TEMP/peaceai-testresults/repair/*.diff" >/dev/null; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
      - name: Re-check the target is public
        if: steps.repaired.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.select.outputs.target }}
          PEACEAI_FORCE_VISIBILITY_FAIL: ${{ inputs.force_visibility_fail == true }}
        run: ./node_modules/.bin/tsx peaceai/bin/target-check.ts
      - name: Clone the target anonymously at the base commit
        if: steps.repaired.outputs.any == 'true' && needs.select.outputs.is_default != 'true'
        run: |
          base="$(node -p 'require(process.env.RUNNER_TEMP+"/peaceai-in/summary.json").baseSha')"
          ./peaceai/bin/clone-target.sh "$PEACEAI_TARGET" "$RUNNER_TEMP/peaceai-target" "$base"
      - name: Clone core (read-only key, outside the workspace)
        if: steps.repaired.outputs.any == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_CORE_DEPLOY_KEY }}
        run: ./peaceai/bin/clone-core.sh "$RUNNER_TEMP/peaceai-core"
      - name: Re-gate repaired diffs and assemble the final candidate set
        env:
          ANY_REPAIRED: ${{ steps.repaired.outputs.any }}
        run: |
          mkdir -p "$RUNNER_TEMP/peaceai-testresults"
          if [ "${{ needs.select.outputs.is_default }}" != "true" ]; then export PEACEAI_WORKSPACE_DIR="$RUNNER_TEMP/peaceai-target"; fi
          if [ "$ANY_REPAIRED" = "true" ]; then export PEACEAI_CORE_DIR="$RUNNER_TEMP/peaceai-core"; fi
          PEACEAI_IN_DIR="$RUNNER_TEMP/peaceai-in" PEACEAI_TESTRESULTS_DIR="$RUNNER_TEMP/peaceai-testresults" \
          PEACEAI_FINAL_DIR="$RUNNER_TEMP/peaceai-final" ./node_modules/.bin/tsx peaceai/bin/regate.ts
      - name: Delete core
        if: always()
        run: rm -rf "$RUNNER_TEMP/peaceai-core" "$RUNNER_TEMP"/peaceai-ssh.* "$RUNNER_TEMP/peaceai-target"
      - name: Upload the final candidate set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peaceai-final
          path: ${{ runner.temp }}/peaceai-final
          retention-days: 1
          if-no-files-found: error

  record:
    name: "Job C: record and blind-rank"
    needs: [select, generate, test, regate]
    if: >-
      always() && needs.generate.result == 'success' && needs.regate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: peaceai-results
    permissions:
      contents: read
      issues: read
    outputs:
      eligible: ${{ steps.record.outputs.eligible }}
      presentation: ${{ steps.record.outputs.presentation }}
      results_sha: ${{ steps.record.outputs.results_sha }}
    env:
      ISSUE_NUMBER: ${{ needs.select.outputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: peaceai-final
          path: ${{ runner.temp }}/peaceai-final
      - name: Fetch the task text
        env:
          GH_TOKEN: ${{ github.token }}
        run: ISSUE_JSON="$RUNNER_TEMP/issue.json" ./node_modules/.bin/tsx peaceai/bin/issue-fetch.ts
      - name: Python runtime for the LM shadow score (numpy only, hash-pinned)
        if: vars.PEACEAI_LM_SHADOW == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/lm-venv"
          "$RUNNER_TEMP/lm-venv/bin/pip" install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r peaceai/model/requirements.txt
          echo "PEACEAI_PYTHON=$RUNNER_TEMP/lm-venv/bin/python" >> "$GITHUB_ENV"
      - name: Commit records and the blind ranking to Results (before any review output)
        id: record
        env:
          PEACEAI_LM_SHADOW: ${{ vars.PEACEAI_LM_SHADOW }}
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
          TASK_SOURCE: ${{ needs.select.outputs.source }}
          TASK_TARGET: ${{ needs.select.outputs.target }}
          PEACEAI_RANKER: ${{ vars.PEACEAI_RANKER }}
        run: |
          mkdir -p "$RUNNER_TEMP/peaceai-final/testresults"
          export PEACEAI_IN_DIR="$RUNNER_TEMP/peaceai-final" PEACEAI_TESTRESULTS_DIR="$RUNNER_TEMP/peaceai-final/testresults"
          export ISSUE_JSON="$RUNNER_TEMP/issue.json" RUN_ID="$GITHUB_RUN_ID"
          RECORDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RECORDED_AT
          ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh "task #$ISSUE_NUMBER run $GITHUB_RUN_ID" \
            ./node_modules/.bin/tsx peaceai/bin/record-task.ts

  review:
    name: blind review comment
    needs: [select, generate, record]
    # always(): Job B is skipped when there are no candidates, and a skipped ancestor would skip this job.
    if: always() && needs.record.result == 'success' && needs.generate.outputs.candidates != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ needs.select.outputs.issue }}
    steps:
      - name: No eligible candidates
        if: needs.record.outputs.eligible == '0'
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "PeaceAI found no eligible candidate for this task. The attempt was recorded."
      - if: needs.record.outputs.eligible != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.record.outputs.eligible != '0'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: needs.record.outputs.eligible != '0'
        name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.record.outputs.eligible != '0'
        with:
          name: peaceai-final
          path: ${{ runner.temp }}/peaceai-in
      - name: Re-check the target is public before posting its diffs
        if: needs.record.outputs.eligible != '0'
        env:
          TARGET: ${{ needs.select.outputs.target }}
          PEACEAI_FORCE_VISIBILITY_FAIL: ${{ inputs.force_visibility_fail == true }}
        run: ./node_modules/.bin/tsx peaceai/bin/target-check.ts
      - name: Post every eligible candidate, shuffled, unranked
        if: needs.record.outputs.eligible != '0'
        env:
          PRESENTATION: ${{ needs.record.outputs.presentation }}
          PEACEAI_TARGET: ${{ needs.select.outputs.target }}
        run: |
          PEACEAI_IN_DIR="$RUNNER_TEMP/peaceai-in" PEACEAI_BODY_FILE="$RUNNER_TEMP/review.md" \
            ./node_modules/.bin/tsx peaceai/bin/review-comment.ts
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/review.md"

  finish:
    name: update state and chain the next sweep
    needs: [select, generate, test, regate, record, review]
    if: always() && needs.select.outputs.issue != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ needs.select.outputs.issue }}
      REVIEW_RESULT: ${{ needs.review.result }}
      NO_CANDIDATES: ${{ needs.generate.result == 'success' && needs.generate.outputs.candidates == '0' && needs.record.result == 'success' }}
      NL_REASON: ${{ needs.generate.outputs.nl == 'unsure' && needs.generate.outputs.nl_reason || '' }}
      NL_HINT: ${{ needs.generate.outputs.nl_hint }}
      FAILED_STAGE: >-
        ${{ needs.generate.result != 'success' && 'generation or the leak/scope gate' ||
            (needs.test.result == 'failure' || needs.test.result == 'cancelled') && 'testing' ||
            needs.regate.result != 'success' && 'the repair re-gate' ||
            needs.record.result != 'success' && 'recording to Results' || 'the review comment' }}
    steps:
      - name: Mark done or failed
        run: |
          if [ "$NO_CANDIDATES" = "true" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label peaceai:failed --remove-label peaceai:running >/dev/null
            # M10: an unsure parse gets the phrasing list instead (posted below, after the leak check).
            [ -n "$NL_REASON" ] || gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "PeaceAI: no candidates generated for this task. The attempt was recorded. Rephrase the issue, then remove \`peaceai:failed\` to retry."
          elif [ "$REVIEW_RESULT" = "success" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label peaceai:done --remove-label peaceai:running >/dev/null
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label peaceai:failed --remove-label peaceai:running >/dev/null
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "PeaceAI stopped during $FAILED_STAGE. Remove \`peaceai:failed\` to retry."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Say the parser was unsure, with the supported phrasings (fixed text; leak-checked)
        if: env.NL_REASON != '' && env.NO_CANDIDATES == 'true'
        run: |
          PEACEAI_BODY_FILE="$RUNNER_TEMP/nl-refusal.md" ./node_modules/.bin/tsx peaceai/bin/nl-refusal.ts
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/nl-refusal.md"
      - name: Chain the next sweep while tasks are waiting
        id: count
        env:
          MODE: count
        run: ./node_modules/.bin/tsx peaceai/bin/select.ts
      - name: Start the next sweep
        if: steps.count.outputs.waiting != '0'
        run: gh workflow run peace-task.yml --repo "$GITHUB_REPOSITORY" --ref main

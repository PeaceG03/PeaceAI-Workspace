name: peace-lb-chain2

# lb-chain2 v1 (spec peaceai/spec/lb-chain2-v1.md; Auditor #673 conditions): ONE day of chain 2 per manual dispatch from
# main (workflow_dispatch only; never scheduled; any other ref is refused) on GitHub-hosted runners (free compute).
# Build isolation (binding): the lb-corpus v2 is built by the c2-corpus job, which has NO environment, NO secrets and
# contents: read only; it passes on only docs.jsonl, manifest.jsonl and fingerprint.json (a short-lived artifact of this
# run). The c2-train job never runs node; before any secret step it checks all three against the protected pins
# (lb_chain2.py pins: lb-train.json chain2Run.corpus = lb-corpus2.json build, fingerprint.json byte-equal to the
# committed lb-corpus2-fingerprint.json) and fails closed on any mismatch.
# The trusted record is the add-only Results rows runs/lb-chain2/<day>-<run id>.json plus the one pinned chain-1 day-3
# row; day 1 warm-starts from chain 1's save-000006000 (R2 lb-daily/41222155935/), verified against its pinned manifest
# sha256 before use; later days resume the chain-2 save (R2 lb-daily/<chain-2 id>/). The R2 secrets are in env only for
# the R2 steps, the Results key only for the Results steps; nothing echoes them. Results gets one add-only row per
# trained day; latest.json is never written.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: peace-lb-chain2
  cancel-in-progress: false

jobs:
  c2-ref-gate:
    name: chain 2 ref gate (main only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse unless dispatched from main
        run: test "$GITHUB_REF" = refs/heads/main || { echo "LB_C2_REF_NOT_MAIN"; exit 1; }

  c2-corpus:
    name: chain 2 corpus build (no secrets, contents read only)
    needs: c2-ref-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the pinned node tools (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Build the lb-corpus v2 (anonymous; refuses if any secret-like variable is set)
        run: ./peaceai/bin/lb-chain2-corpus.sh "$RUNNER_TEMP/c2w" "$RUNNER_TEMP/c2out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c2-corpus
          path: ${{ runner.temp }}/c2out
          retention-days: 1
          if-no-files-found: error

  c2-train:
    name: chain 2 day (pins checked first; saves in R2 lb-daily/; one row in Results runs/lb-chain2/)
    needs: [c2-ref-gate, c2-corpus]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    environment: peaceai-results
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      KEY_SCRIPTS_SHA256: |
        bee71029e4a528f4ea7a9aae3c25d8591f4f35db398c9fb24cf11d645b4b355e  peaceai/bin/with-deploy-key.sh
        da2a4c6e32d3f6dc2e5587767bf4e01885b37e4011ce3a223ea7493506600e42  peaceai/bin/results-write.sh
    steps:
      - name: Record the job start and the day (the train deadline is measured from here)
        run: |
          echo "LB_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "LB_TODAY=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ref and config checks (main only; chain 2 enabled; pins and warm start agree; only allowed settings)
        run: python3 peaceai/model/lb_chain2.py ref --ref "$GITHUB_REF" && python3 peaceai/model/lb_chain2.py config
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c2-corpus
          path: ${{ runner.temp }}/lbc2
      - name: Check the built corpus against the protected pins (before any secret; fail closed)
        run: python3 peaceai/model/lb_chain2.py pins --corpus "$RUNNER_TEMP/lbc2"
      - name: Install hash-pinned numpy
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps --require-hashes -r peaceai/model/requirements.txt
      - name: Verify the checkout and the key scripts before any key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s' "$KEY_SCRIPTS_SHA256" | sha256sum -c --quiet - || { echo "key script hash mismatch: key refused"; exit 1; }
      - name: Read the trusted record (Results runs/lb-chain2/ and the pinned day-3 row, read only; writes nothing)
        id: trusted
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
        run: |
          ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh --sparse /runs/lb-chain2/ --sparse /runs/lb-daily/2026-11-03-41572356445.json "lb chain2 trusted record read (run $GITHUB_RUN_ID; writes nothing)" \
            python3 peaceai/model/lb_chain2.py trusted --out "$RUNNER_TEMP/lb-trusted.json" --today "$LB_TODAY"
      - name: Chain finished (the trusted record says no more steps; nothing is trained)
        if: steps.trusted.outputs.kind == 'done'
        run: echo "LB_C2_CHAIN_DONE"
      - name: Restore the warm-start or resume save from R2 lb-daily/ (verified against its pin before any use)
        if: steps.trusted.outputs.kind == 'warm' || steps.trusted.outputs.kind == 'resume'
        env:
          LM_SAVES_R2_ACCOUNT_ID: ${{ secrets.LM_SAVES_R2_ACCOUNT_ID }}
          LM_SAVES_R2_ACCESS_KEY_ID: ${{ secrets.LM_SAVES_R2_ACCESS_KEY_ID }}
          LM_SAVES_R2_SECRET_ACCESS_KEY: ${{ secrets.LM_SAVES_R2_SECRET_ACCESS_KEY }}
          LM_SAVES_R2_BUCKET: ${{ secrets.LM_SAVES_R2_BUCKET }}
          T_KIND: ${{ steps.trusted.outputs.kind }}
          T_CHAIN: ${{ steps.trusted.outputs.chain }}
          T_WARM_CHAIN: ${{ steps.trusted.outputs.warm_chain }}
          T_SAVE: ${{ steps.trusted.outputs.save }}
          T_SHA: ${{ steps.trusted.outputs.trusted_sha }}
        run: |
          set -euo pipefail
          ./peaceai/bin/lm-saves-r2.sh --folder lb-daily check
          mkdir -p "$RUNNER_TEMP/lbs/saves" "$RUNNER_TEMP/lbw"
          if [ "$T_KIND" = warm ]; then
            ./peaceai/bin/lm-saves-r2.sh --folder lb-daily get "$T_WARM_CHAIN" "$T_SAVE" "$RUNNER_TEMP/lbw/$T_SAVE"
          else
            ./peaceai/bin/lm-saves-r2.sh --folder lb-daily get "$T_CHAIN" "$T_SAVE" "$RUNNER_TEMP/lbs/saves/$T_SAVE"
          fi
          "$RUNNER_TEMP/venv/bin/python" peaceai/model/lb_chain2.py restore --trusted "$RUNNER_TEMP/lb-trusted.json" --trusted-sha "$T_SHA" --state "$RUNNER_TEMP/lbs" --warm "$RUNNER_TEMP/lbw"
      - name: Chain 2 day (train within the budget; held-out bpb vs the same-split unigram baseline; heldout_v2 separately)
        if: steps.trusted.outputs.kind == 'warm' || steps.trusted.outputs.kind == 'resume'
        env:
          PY: ${{ runner.temp }}/venv/bin/python
          T_SHA: ${{ steps.trusted.outputs.trusted_sha }}
        run: ./peaceai/bin/lb-chain2-run.sh "$RUNNER_TEMP/lbc2" "$RUNNER_TEMP/lbs" "$RUNNER_TEMP/lb-trusted.json" "$T_SHA" "$RUNNER_TEMP/lbw"
      - name: Re-verify the checkout and the key scripts right before the R2 key is used again (copy)
        if: steps.trusted.outputs.kind == 'warm' || steps.trusted.outputs.kind == 'resume'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s' "$KEY_SCRIPTS_SHA256" | sha256sum -c --quiet - || { echo "key script hash mismatch: key refused"; exit 1; }
      - name: Copy the new save to R2 lb-daily/<chain 2 id>/ (only its own manifest sha256 is accepted; an existing name is refused; nothing is removed)
        if: steps.trusted.outputs.kind == 'warm' || steps.trusted.outputs.kind == 'resume'
        env:
          LM_SAVES_R2_ACCOUNT_ID: ${{ secrets.LM_SAVES_R2_ACCOUNT_ID }}
          LM_SAVES_R2_ACCESS_KEY_ID: ${{ secrets.LM_SAVES_R2_ACCESS_KEY_ID }}
          LM_SAVES_R2_SECRET_ACCESS_KEY: ${{ secrets.LM_SAVES_R2_SECRET_ACCESS_KEY }}
          LM_SAVES_R2_BUCKET: ${{ secrets.LM_SAVES_R2_BUCKET }}
          T_CHAIN: ${{ steps.trusted.outputs.chain }}
        run: |
          set -euo pipefail
          save=$(jq -r .save "$RUNNER_TEMP/lbs/chain.json"); sha=$(jq -r .manifestSha256 "$RUNNER_TEMP/lbs/chain.json")
          chain=${T_CHAIN:-$GITHUB_RUN_ID}
          ./peaceai/bin/lm-saves-r2.sh --folder lb-daily put-one "$chain" "$RUNNER_TEMP/lbs/saves" "$save" "$sha"
          echo "LB_UPLOADED=$save:$sha" >> "$GITHUB_ENV"
      - name: Build the metrics row (pins, shas, steps, stop reason, held-out and baseline bpb, heldout_v2, wall time, save marker)
        if: steps.trusted.outputs.kind == 'warm' || steps.trusted.outputs.kind == 'resume'
        env:
          T_SHA: ${{ steps.trusted.outputs.trusted_sha }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" peaceai/model/lb_chain2.py row --trusted "$RUNNER_TEMP/lb-trusted.json" --trusted-sha "$T_SHA" --state "$RUNNER_TEMP/lbs" \
            --today "$LB_TODAY" --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA" --job-start "$LB_JOB_START" --uploaded "$LB_UPLOADED" --out "$RUNNER_TEMP/lb-chain2-row.json"
      - name: Re-verify the checkout and the key scripts right before the deploy key is used again (land)
        if: steps.trusted.outputs.kind == 'warm' || steps.trusted.outputs.kind == 'resume'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s' "$KEY_SCRIPTS_SHA256" | sha256sum -c --quiet - || { echo "key script hash mismatch: key refused"; exit 1; }
      - name: Record one add-only row in Results (runs/lb-chain2/<day>-<run id>.json, new file only; no weights, no latest.json)
        if: steps.trusted.outputs.kind == 'warm' || steps.trusted.outputs.kind == 'resume'
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
        run: |
          ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh --sparse "/runs/lb-chain2/$LB_TODAY-$GITHUB_RUN_ID.json" "lb chain2 metrics ($LB_TODAY, run $GITHUB_RUN_ID)" \
            python3 peaceai/model/lb_chain2.py land --row "$RUNNER_TEMP/lb-chain2-row.json" --run-id "$GITHUB_RUN_ID" --today "$LB_TODAY"
      - name: Remove the corpus, state, warm save and venv (weights and saves leave the runner only to R2)
        if: always()
        run: rm -rf "$RUNNER_TEMP/lbc2" "$RUNNER_TEMP/lbs" "$RUNNER_TEMP/lbw" "$RUNNER_TEMP/lb-trusted.json" "$RUNNER_TEMP/lb-chain2-row.json" "$RUNNER_TEMP/venv"

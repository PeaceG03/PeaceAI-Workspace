name: peace-lm-retrain

# M119 (Builder + Auditor, free compute under Peace's 2026-10-25 rule): fine-tune the LIVE LM on the reviewed commit
# list (peaceai/model/lm-retrain-commits.txt: Workspace PR merges at their Auditor-PASSed heads, merged PeaceSTOCKS
# verdict PRs, builder-log rows added since 2026-10-16), with the Auditor's gate inside the run:
#   (1) live and candidate are scored in THIS run on the same set C v2 byte slice (slice_sha256 checked), same code;
#   (2) the corpus is deduplicated against all of set C v2 and the judge items (judge set v2, 230 items; exact,
#       24-token windows, whole short items) and re-checked to 0 overlaps; the overlap counts are recorded;
#   (3) both models are scored on judge set v2 (Results lm-judge-v2/ on main, pinned by items sha256). The candidate's
#       set C v2 bits/byte must be <= the live model's (blocking). The judge AUC is REPORT-ONLY (full set and the
#       non-identity subset, each with its 95% interval, recorded for both models): it can neither block nor pass a
#       candidate until peaceai/model/judge_gate.py's promote-to-hard rule holds (live model's lower 95% bound above
#       0.5 on both the full set and the non-identity subset; spec peaceai/spec/lm-retrain-judge-gate-v1.md).
#       judge364.py must reproduce the live model's recorded judge aggregates in the run (blocking);
#   tuning: two sweep arms (finetune.sweep.lrs) run up to finetune.steps with early stopping on validation loss over
#       pretrain-heldout windows (finetune.valWindows docs of the replay corpus, one window per doc; never set C v2, the
#       judge items or the fine-tune corpus; its sha256 is recorded); the arm/step with the lowest validation loss is
#       re-trained to exactly that step as the candidate;
#   forgetting fix (run 40375535718, set C v2 bpb 1.6506 -> 2.0670): the fine-tune pairs keep one version per (repo, path,
#       function) and are split by file path (ft_prepare.py); finetune.replayFrac of every batch replays the live model's
#       own pretrain train split (lm-retrain-replay.sh: rebuilt from the public ext manifest, must hash to
#       replay.manifestSha256); the replay corpus is proven, by doc id and sha256, to overlap neither set C v2 nor the
#       judge-v2 items before any training (replay_proof.py; refuses on any overlap);
#   dry run (workflow_dispatch input dry_run=true): corpus-gate and both sweep arms run; each arm then prints ONLY the set
#       C v2 bits/byte of every kept checkpoint and of the live model (lm-retrain-dryrun-score.sh, after training);
#       finetune-eval-land, retrain-memcheck and record-memcheck are skipped, nothing is uploaded, and every Results write
#       runs through lm-retrain-dryrun-guard.sh, which refuses unless DRY_RUN is exactly "false";
#   outcome (run 40555453905, a dry run that finished green with select, memcheck and record skipped; Auditor's design 2):
#       retrain-outcome (always(), last, no secrets, no environment; checkout only to run the shared select rule) runs
#       lm-retrain-outcome.sh. Real run: RED unless finetune-eval-land, retrain-memcheck and record-memcheck all succeeded.
#       Dry run: RED unless every sweep arm left a parseable summary that stopped on "steps" or "patience" (early stop)
#       and peaceai/model/sweep_select.py (the select step's own rule) picks a candidate arm/step, which it prints;
#   (4) GitHub-hosted runners only; counts-only logs; no artifacts, no caches; model, scores and record land in the
#       private Results repo only; finetune mode: the memcheck uses the strict 32-character rule (no pretrain-corpus
#       proof attached); pretrain mode: lm-memcheck.ts's two-corpus mode (see "Run 40694718190" below);
#   (5) no promotion: latest.json is never touched; promotion needs the Auditor's review of this run id and weights sha.
# M123 continued pretraining (workflow_dispatch input mode = finetune | pretrain, default finetune; passed only through the
#   MODE env and validated by peaceai/bin/lm-retrain-mode.sh against that fixed allowlist): every schedule value is read
#   from lm-retrain.json .<mode> (pretrain: steps, warmup, evalEvery, patience, batch, sweep.lrs, maxSeconds, replayFrac
#   1.0, valWindows); pretrain mode replays the live model's FULL pretrain train split (replay.pretrainTrainMaxBytes, read
#   only in pretrain mode; replay_proof.py proves the whole split against set C v2 and the judge-v2 items), refuses unless
#   every batch row is a replay row (ftRows == 0), starts a fresh AdamW from the live weights (--init-from), and ends
#   cleanly at a wall-clock deadline inside the job limit (pretrain.budget) so a record is always written. The record
#   (schema v5) carries the mode and the replay corpus sha256 and byte count used. Gate (both modes): candidate set C v2
#   bits/byte <= live - eval.minBpbGain (bpb_gate.py, decimal), at the validation-selected step; set C is the final gate
#   only. Memcheck in pretrain mode: a fine-tune-corpus run AND a replay-corpus run, both required
#   (memcheck_combine.py). Dry run (both modes): per-arm phase times (numbers) and set C bpb only; no Results write.
# M125 durable sweep arms and candidate reuse (Peace 2026-10-28, after run 40624227227 lost ~10 h; Auditor's reuse idea):
#   each sweep arm, as soon as it finishes and before select runs, stages its summary, losses and (bestStep > 0) the
#   export of its best.npz (the checkpoint at its validation-selected step) with lm-retrain-arm-save.sh, and saves them in
#   Results runs/lm-retrain/<run>/arms/<arm>/ (save.json binds every file by sha256; written only through the dry-run
#   guard, path-allowlisted; the arm job's "saved" output carries {saveSha256, weightsSha256} only after the push).
#   A save failure does not fail the arm (the run continues as before M125). finetune-eval-land fetches the saved arms
#   (sparse, Results key), lm-retrain-arm-verify.sh checks them by sha256 against the arm jobs' outputs (a mismatch
#   refuses), select runs on the verified summaries, and lm-retrain-arm-reuse.sh makes the selected arm's checkpoint the
#   candidate (sha256, step, lr and the valSplit / replay.val / replay.corpus / mode identity checks; a mismatch refuses).
#   An unsaved selected arm is re-trained (the pre-M125 path, 15300 s candidate deadline). Input resume_run_id (real runs
#   only): the sweep is skipped and select, scoring and landing run on that run's saved arms (every arm must be saved and
#   verify; run, mode, lr, live, fine-tune manifest and training config must equal this run's). No artifacts, no caches.
# Run 40694718190 follow-up (Auditor's ruling; the pretrain candidate lm-v1-858573767465 landed but its strict memcheck
#   FAILed): (1) pretrain mode uses lm-memcheck.ts's existing two-corpus mode, no new rule: PEACEAI_LM_TRAIN_CORPUS = the
#   replay corpus, PEACEAI_LM_FT_CORPUS = the fine-tune corpus, both rebuilt in the memcheck job; the replay link is the
#   live model's corefree-proof.json (sha256 pinned, lm-retrain.json replayBase.corefreeProofSha256) checked against the live
#   training manifest rebuilt in the job (replay_corpus.py --manifest-out, sha256 = replayBase.manifestSha256), the fine-tune
#   link is corpus-gate's proof (sha256 from the run record). Any missing or mismatched link: FAIL (never the strict
#   fallback); line, shingle and personal-info hits stay hard. Initial weights vs the live model: a note, not a check.
#   (2) memcheck-only (input memcheck_only_run_id, real runs only): corpus-gate rebuilds and proves the corpora; the sweep
#   and finetune-eval-land are skipped; retrain-memcheck re-verifies that run's landed candidate (lm-retrain-memcheck-
#   fetch.sh: weights vs the record, config/tokenizer/weights vs that run's first memcheck record) and runs the same
#   memcheck; record-memcheck APPENDS runs/lm-retrain/<that run>/memcheck-recheck-<this run>.json only (path-allowlisted,
#   never an existing file): nothing promoted, latest.json, record.json and memcheck.json untouched.
#   (3) outcome: a landed FAIL record prints "memcheck FAIL (record landed)" (still RED).
# Jobs: corpus-gate (peaceai-core: core-free proof of the exact corpus, read-only keys) -> sweep-a, sweep-b (peaceai-core,
# Results read key only; losses only) -> finetune-eval-land
# (peaceai-results) -> retrain-memcheck (peaceai-core, read-only keys; LM job id pinned in lm.ts LM_JOB_WORKFLOWS) -> record-memcheck (peaceai-results).
# Every step that uses a key is preceded by a check that the checkout is GITHUB_SHA, unmodified, and the key scripts
# match their pins.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry run: train both sweep arms, print only set C v2 bpb per checkpoint (and the live model's); no Results write"
        type: boolean
        default: false
      mode:
        description: "finetune (default) or pretrain (continued pretraining on the live model's full pretrain train split)"
        type: choice
        options:
          - finetune
          - pretrain
        default: finetune
      resume_run_id:
        description: "real runs only: skip the sweep; select, score and land from this earlier run's sweep arms saved in Results (sha256-verified)"
        type: string
        default: ""
      memcheck_only_run_id:
        description: "real runs only: no training; re-run the memcheck on this earlier run's landed candidate and append a memcheck-recheck record under that run (no promotion)"
        type: string
        default: ""

permissions: {}

concurrency:
  group: peace-lm-train
  cancel-in-progress: false

env:
  CFG: peaceai/model/lm-retrain.json
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  MODE: ${{ inputs.mode || 'finetune' }}
  RESUME: ${{ inputs.resume_run_id || '' }}
  MCO: ${{ inputs.memcheck_only_run_id || '' }}
  RESULTS_SHA256: |-
    bee71029e4a528f4ea7a9aae3c25d8591f4f35db398c9fb24cf11d645b4b355e  peaceai/bin/with-deploy-key.sh
    da2a4c6e32d3f6dc2e5587767bf4e01885b37e4011ce3a223ea7493506600e42  peaceai/bin/results-write.sh
    d4d7c4614fc1c88d806ef66d4e813e8bc31f4ff1f3a89835b9e1efa304a60361  peaceai/bin/lm-retrain-dryrun-guard.sh
  CORE_SHA256: |-
    bee71029e4a528f4ea7a9aae3c25d8591f4f35db398c9fb24cf11d645b4b355e  peaceai/bin/with-deploy-key.sh
    7e2650ddd67247f4a45a0968409e448fa00d3a66ee1acc9409c8c29aab018754  peaceai/bin/clone-core.sh

jobs:
  corpus-gate:
    name: build, dedup and core-free-prove the fine-tune corpus
    if: github.repository == 'PeaceG03/PeaceAI-Workspace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: peaceai-core
    permissions:
      contents: read
    outputs:
      drops: ${{ steps.prove.outputs.drops }}
      manifest: ${{ steps.prove.outputs.manifest }}
      proof: ${{ steps.prove.outputs.proof }}
      replay: ${{ steps.replay.outputs.replay }}
      replayproof: ${{ steps.replay.outputs.replayproof }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the resume input (a run id; real runs only; never this run)
        run: |
          set -euo pipefail
          [ -z "$RESUME" ] || { [[ "$RESUME" =~ ^[1-9][0-9]{5,19}$ ]] && [ "$DRY_RUN" = false ] && [ "$RESUME" != "$GITHUB_RUN_ID" ]; } || { echo "bad resume_run_id (needs a run id and a real run): refused"; exit 1; }
          [ -z "${MCO:-}" ] || { [[ "$MCO" =~ ^[1-9][0-9]{5,19}$ ]] && [ "$DRY_RUN" = false ] && [ -z "$RESUME" ] && [ "$MCO" != "$GITHUB_RUN_ID" ]; } || { echo "bad memcheck_only_run_id (needs a run id, a real run, no resume_run_id): refused"; exit 1; }
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Verify the checkout and the key scripts before any key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$CORE_SHA256" | sha256sum -c --quiet - || { echo "key script hash mismatch: key refused"; exit 1; }
      - name: Fetch the judge items (read-only key; lm-judge-v2/items.json on Results main, pinned by sha256 and count)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_READ_KEY }}
        run: |
          set -euo pipefail
          [ -n "${DEPLOY_KEY:-}" ] || { echo "PEACEAI_RESULTS_READ_KEY is not set: refused (fail closed)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/w"; ./peaceai/bin/lm-retrain-judge.sh "$RUNNER_TEMP"   # judge set v2 (eval.judgeItemsSha256); fails closed until lm-judge-v2/ has landed
      - name: Build the corpus at the pinned heads and dedup it against set C v2 and the judge items
        run: ./peaceai/bin/lm-retrain-corpus.sh "$RUNNER_TEMP/w" "$RUNNER_TEMP/items.json"
      - name: Verify the checkout and the key scripts before the core key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$CORE_SHA256" | sha256sum -c --quiet - || { echo "key script hash mismatch: key refused"; exit 1; }
      - name: Clone core (read-only key, outside the workspace)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_CORE_DEPLOY_KEY }}
        run: ./peaceai/bin/clone-core.sh "$RUNNER_TEMP/peaceai-core"
      - name: Core-free proof; drop flagged docs; rebuild; prove again (must be PROVEN)
        id: prove
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/w"; mkdir -p "$RUNNER_TEMP/stub"; echo '{"version":"lm-retrain-corpus"}' > "$RUNNER_TEMP/stub/config.json"
          prove() { python3 peaceai/model/corefree_proof.py --corpus "$W/ft" --core-dir "$RUNNER_TEMP/peaceai-core" --model "$RUNNER_TEMP/stub" --stage finetune --source-root "$W/srcroot"; }
          prove
          jq -r '.near.threshold as $t | .files[] | select(.coreExact or .coreNearMax >= $t) | .doc' "$RUNNER_TEMP/stub/corefree-proof-finetune.json" > "$RUNNER_TEMP/drops.txt"
          echo "core-flagged docs dropped: $(grep -c . "$RUNNER_TEMP/drops.txt" || true)"
          ./peaceai/bin/lm-retrain-corpus.sh "$W" "$RUNNER_TEMP/items.json" "$RUNNER_TEMP/drops.txt"
          prove
          P="$RUNNER_TEMP/stub/corefree-proof-finetune.json"
          test "$(jq -r .noCoreFiles "$P")" = PROVEN || { echo "corpus not proven core-free after the drop: refused"; exit 1; }
          ms=$(sha256sum "$W/ft/manifest.jsonl" | cut -c1-64)
          test "$(jq -r .manifestSha256 "$P")" = "$ms" || { echo "proof is not for this manifest: refused"; exit 1; }
          test "$(jq -r .recheckOverlapDocs "$W/dedup.json")" = 0 || { echo "eval overlap after dedup: refused"; exit 1; }
          echo "drops=$(paste -sd, "$RUNNER_TEMP/drops.txt")" >> "$GITHUB_OUTPUT"
          echo "manifest=$ms" >> "$GITHUB_OUTPUT"
          b64=$(jq 'del(.coreCommit)' "$P" | gzip -9c | base64 -w0)
          [ "${#b64}" -le 800000 ] || { echo "proof too large for a job output: refused"; exit 1; }
          echo "proof=$b64" >> "$GITHUB_OUTPUT"
          echo "fine-tune corpus PROVEN core-free: docs=$(jq '.files | length' "$P")"
          jq -c '{docsIn, keys, olderVersionsDropped, heldoutSharedLineDropped, train, heldout, trainPaths, heldoutPaths}' "$W/ft-prepare.json"
      - name: Build the replay corpus; prove (doc ids, sha256) no overlap with set C v2 or the judge-v2 items, before any training
        id: replay
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/w"
          ./peaceai/bin/lm-retrain-replay.sh "$W" "$RUNNER_TEMP/items.json"
          test "$(jq -r .ok "$W/replay-proof.json")" = true || { echo "replay overlap proof failed: refused"; exit 1; }
          echo "replay=$(sha256sum "$W/replay/manifest.jsonl" | cut -c1-64)" >> "$GITHUB_OUTPUT"
          echo "replayproof=$(jq -r '[.trainIdsSha256, .valIdsSha256, .setcShaListSha256, .judgeItemsSha256] | join(",")' "$W/replay-proof.json")" >> "$GITHUB_OUTPUT"
      - name: Delete core, the corpus, the clones and the judge items
        if: always()
        run: rm -rf "$RUNNER_TEMP/peaceai-core" "$RUNNER_TEMP"/peaceai-ssh.* "$RUNNER_TEMP/w" "$RUNNER_TEMP/stub" "$RUNNER_TEMP/items.json" "$RUNNER_TEMP/res" "$RUNNER_TEMP/drops.txt"

  sweep-a:
    name: sweep arm a (<mode>.sweep.lrs[0]; early stop on pretrain-heldout windows only; saved in Results when it finishes)
    needs: corpus-gate
    if: github.repository == 'PeaceG03/PeaceAI-Workspace' && github.ref == 'refs/heads/main' && inputs.resume_run_id == '' && inputs.memcheck_only_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment: peaceai-results
    permissions:
      contents: read
    outputs:
      summary: ${{ steps.arm.outputs.summary }}
      saved: ${{ steps.save.outputs.saved }}
    env:
      ARM: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Job clock (pretrain mode ends training before the job's time limit)
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install workspace tooling and hash-pinned numpy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps --require-hashes -r peaceai/model/requirements.txt
      - name: Verify the checkout and the landing scripts before the key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$RESULTS_SHA256" | sha256sum -c --quiet - || { echo "landing script hash mismatch: key refused"; exit 1; }
      - name: Restore the live model and the judge items (Results key, read only here; lm-retrain.json replayBase, never latest.json; weights sha checked)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
        run: ./peaceai/bin/lm-retrain-live.sh "$RUNNER_TEMP/r"
      - name: Rebuild the exact proven corpus (same drops; manifest sha must equal the proven one)
        env:
          DROPS: ${{ needs.corpus-gate.outputs.drops }}
          MANIFEST: ${{ needs.corpus-gate.outputs.manifest }}
          REPLAY: ${{ needs.corpus-gate.outputs.replay }}
          REPLAYPROOF: ${{ needs.corpus-gate.outputs.replayproof }}
          PEACEAI_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: |
          set -euo pipefail
          [[ "$DROPS" =~ ^([0-9]+(,[0-9]+)*)?$ && "$MANIFEST" =~ ^[0-9a-f]{64}$ ]] || { echo "bad corpus-gate outputs: refused"; exit 1; }
          printf '%s' "$DROPS" | tr , '\n' > "$RUNNER_TEMP/drops.txt"
          ./peaceai/bin/lm-retrain-corpus.sh "$RUNNER_TEMP/w" "$RUNNER_TEMP/r/items.json" "$RUNNER_TEMP/drops.txt"
          test "$(sha256sum "$RUNNER_TEMP/w/ft/manifest.jsonl" | cut -c1-64)" = "$MANIFEST" || { echo "rebuilt corpus differs from the proven one: refused"; exit 1; }
          ./peaceai/bin/lm-retrain-replay.sh "$RUNNER_TEMP/w" "$RUNNER_TEMP/r/items.json"
          ./peaceai/bin/lm-retrain-replay-check.sh "$RUNNER_TEMP/w" "$REPLAY" "$REPLAYPROOF"
          # set C v2 and the judge items are deleted before training (the dry run re-fetches set C only after training)
          rm -rf "$RUNNER_TEMP/w/srcroot" "$RUNNER_TEMP/w/setc" "$RUNNER_TEMP/r/items.json" "$RUNNER_TEMP/r/scores-live-recorded.json"
      - name: Sweep arm (up to <mode>.steps; replay share; early stop on validation loss over pretrain-heldout windows; losses only)
        id: arm
        env:
          PEACEAI_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: |
          set -euo pipefail
          mode=$(./peaceai/bin/lm-retrain-mode.sh)
          lr=$(jq -r --arg m "$mode" --argjson a "$ARM" '.[$m].sweep.lrs[$a]' "$CFG"); [ "$lr" != null ] || { echo "no sweep arm $ARM"; exit 1; }
          if [ "$DRY_RUN" = true ]; then export KEEP_CHECKPOINTS=1; fi
          ./peaceai/bin/lm-retrain-train.sh "$RUNNER_TEMP/w/ft" "$RUNNER_TEMP/w/dedup.json" "$RUNNER_TEMP/w/replay" "$RUNNER_TEMP/w/replay-dedup.json" "$RUNNER_TEMP/r/live" "$RUNNER_TEMP/arm" "$lr" 0
          echo "summary=$(jq -c --argjson arm "$ARM" '. + {arm: $arm}' "$RUNNER_TEMP/arm/summary.json")" >> "$GITHUB_OUTPUT"
      - name: Stage the finished arm for Results (real runs; summary, losses, best-step export; save.json binds every file by sha256; no key)
        id: stage
        if: env.DRY_RUN != 'true'
        continue-on-error: true
        env:
          PEACEAI_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: ./peaceai/bin/lm-retrain-arm-save.sh "$RUNNER_TEMP/arm" "$RUNNER_TEMP/r/live" "$RUNNER_TEMP/w/ft" "$RUNNER_TEMP/armsave" "$ARM"
      - name: Verify the checkout and the landing scripts before the key is used
        id: verify-save
        if: env.DRY_RUN != 'true' && steps.stage.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$RESULTS_SHA256" | sha256sum -c --quiet - || { echo "landing script hash mismatch: key refused"; exit 1; }
      - name: Save the finished arm in Results before select runs (runs/lm-retrain/<run>/arms/<arm>/ only; a failed save is reported, the run continues)
        id: save
        if: env.DRY_RUN != 'true' && steps.stage.outcome == 'success' && steps.verify-save.outcome == 'success'
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
          STAGE: ${{ runner.temp }}/armsave
        run: |
          set -euo pipefail
          w=null; [ -f "$STAGE/model/weights.npz" ] && w="\"$(sha256sum "$STAGE/model/weights.npz" | cut -c1-64)\""
          export SAVED=$(jq -nc --arg s "$(sha256sum "$STAGE/save.json" | cut -c1-64)" --argjson w "$w" '{saveSha256: $s, weightsSha256: $w}')
          st=0
          ./peaceai/bin/lm-retrain-dryrun-guard.sh ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh --sparse "/runs/lm-retrain/$GITHUB_RUN_ID/arms/$ARM/" "M125 LM retrain sweep arm $ARM (run $GITHUB_RUN_ID)" \
            bash -c 'set -euo pipefail
              p="runs/lm-retrain/$GITHUB_RUN_ID/arms/$ARM/"; a="$RESULTS_DIR/$p"; test ! -e "$a"; mkdir -p "$a"; cp -R "$STAGE"/. "$a"
              if [ -n "$(find "$a" -type l)" ]; then echo "save refused: symlink"; exit 1; fi
              git -C "$RESULTS_DIR" add -A
              while IFS= read -r name; do [ -z "$name" ] && continue
                [ "${name:0:${#p}}" = "$p" ] || { echo "save refused: path outside this arm"; exit 1; }
              done <<< "$(git -C "$RESULTS_DIR" diff --cached --name-only --no-renames)"
              echo "saved=$SAVED" >> "$GITHUB_OUTPUT"' || st=$?
          [ "$st" = 0 ] || echo "arm $ARM save failed (exit $st): not saved; the run continues and re-trains this arm's candidate if it is selected"
          rm -rf "$STAGE"
      - name: Dry run only - set C v2 bpb of every kept checkpoint and of the live model (after training; prints bpb only)
        if: env.DRY_RUN == 'true'
        env:
          PEACEAI_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: ./peaceai/bin/lm-retrain-dryrun-score.sh "$RUNNER_TEMP/arm" "$RUNNER_TEMP/r/live" "$ARM" "$(jq -r .lr "$RUNNER_TEMP/arm/summary.json")" "$RUNNER_TEMP/dry"
      - name: Delete the weights, the corpus and the judge items
        if: always()
        run: rm -rf "$RUNNER_TEMP/r" "$RUNNER_TEMP/w" "$RUNNER_TEMP/arm" "$RUNNER_TEMP/armsave" "$RUNNER_TEMP/dry" "$RUNNER_TEMP/drops.txt" "$RUNNER_TEMP"/peaceai-ssh.* "$RUNNER_TEMP"/peaceai-results.*
  sweep-b:
    name: sweep arm b (<mode>.sweep.lrs[1]; early stop on pretrain-heldout windows only; saved in Results when it finishes)
    needs: corpus-gate
    if: github.repository == 'PeaceG03/PeaceAI-Workspace' && github.ref == 'refs/heads/main' && inputs.resume_run_id == '' && inputs.memcheck_only_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment: peaceai-results
    permissions:
      contents: read
    outputs:
      summary: ${{ steps.arm.outputs.summary }}
      saved: ${{ steps.save.outputs.saved }}
    env:
      ARM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Job clock (pretrain mode ends training before the job's time limit)
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install workspace tooling and hash-pinned numpy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps --require-hashes -r peaceai/model/requirements.txt
      - name: Verify the checkout and the landing scripts before the key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$RESULTS_SHA256" | sha256sum -c --quiet - || { echo "landing script hash mismatch: key refused"; exit 1; }
      - name: Restore the live model and the judge items (Results key, read only here; lm-retrain.json replayBase, never latest.json; weights sha checked)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
        run: ./peaceai/bin/lm-retrain-live.sh "$RUNNER_TEMP/r"
      - name: Rebuild the exact proven corpus (same drops; manifest sha must equal the proven one)
        env:
          DROPS: ${{ needs.corpus-gate.outputs.drops }}
          MANIFEST: ${{ needs.corpus-gate.outputs.manifest }}
          REPLAY: ${{ needs.corpus-gate.outputs.replay }}
          REPLAYPROOF: ${{ needs.corpus-gate.outputs.replayproof }}
          PEACEAI_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: |
          set -euo pipefail
          [[ "$DROPS" =~ ^([0-9]+(,[0-9]+)*)?$ && "$MANIFEST" =~ ^[0-9a-f]{64}$ ]] || { echo "bad corpus-gate outputs: refused"; exit 1; }
          printf '%s' "$DROPS" | tr , '\n' > "$RUNNER_TEMP/drops.txt"
          ./peaceai/bin/lm-retrain-corpus.sh "$RUNNER_TEMP/w" "$RUNNER_TEMP/r/items.json" "$RUNNER_TEMP/drops.txt"
          test "$(sha256sum "$RUNNER_TEMP/w/ft/manifest.jsonl" | cut -c1-64)" = "$MANIFEST" || { echo "rebuilt corpus differs from the proven one: refused"; exit 1; }
          ./peaceai/bin/lm-retrain-replay.sh "$RUNNER_TEMP/w" "$RUNNER_TEMP/r/items.json"
          ./peaceai/bin/lm-retrain-replay-check.sh "$RUNNER_TEMP/w" "$REPLAY" "$REPLAYPROOF"
          # set C v2 and the judge items are deleted before training (the dry run re-fetches set C only after training)
          rm -rf "$RUNNER_TEMP/w/srcroot" "$RUNNER_TEMP/w/setc" "$RUNNER_TEMP/r/items.json" "$RUNNER_TEMP/r/scores-live-recorded.json"
      - name: Sweep arm (up to <mode>.steps; replay share; early stop on validation loss over pretrain-heldout windows; losses only)
        id: arm
        env:
          PEACEAI_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: |
          set -euo pipefail
          mode=$(./peaceai/bin/lm-retrain-mode.sh)
          lr=$(jq -r --arg m "$mode" --argjson a "$ARM" '.[$m].sweep.lrs[$a]' "$CFG"); [ "$lr" != null ] || { echo "no sweep arm $ARM"; exit 1; }
          if [ "$DRY_RUN" = true ]; then export KEEP_CHECKPOINTS=1; fi
          ./peaceai/bin/lm-retrain-train.sh "$RUNNER_TEMP/w/ft" "$RUNNER_TEMP/w/dedup.json" "$RUNNER_TEMP/w/replay" "$RUNNER_TEMP/w/replay-dedup.json" "$RUNNER_TEMP/r/live" "$RUNNER_TEMP/arm" "$lr" 0
          echo "summary=$(jq -c --argjson arm "$ARM" '. + {arm: $arm}' "$RUNNER_TEMP/arm/summary.json")" >> "$GITHUB_OUTPUT"
      - name: Stage the finished arm for Results (real runs; summary, losses, best-step export; save.json binds every file by sha256; no key)
        id: stage
        if: env.DRY_RUN != 'true'
        continue-on-error: true
        env:
          PEACEAI_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: ./peaceai/bin/lm-retrain-arm-save.sh "$RUNNER_TEMP/arm" "$RUNNER_TEMP/r/live" "$RUNNER_TEMP/w/ft" "$RUNNER_TEMP/armsave" "$ARM"
      - name: Verify the checkout and the landing scripts before the key is used
        id: verify-save
        if: env.DRY_RUN != 'true' && steps.stage.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$RESULTS_SHA256" | sha256sum -c --quiet - || { echo "landing script hash mismatch: key refused"; exit 1; }
      - name: Save the finished arm in Results before select runs (runs/lm-retrain/<run>/arms/<arm>/ only; a failed save is reported, the run continues)
        id: save
        if: env.DRY_RUN != 'true' && steps.stage.outcome == 'success' && steps.verify-save.outcome == 'success'
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
          STAGE: ${{ runner.temp }}/armsave
        run: |
          set -euo pipefail
          w=null; [ -f "$STAGE/model/weights.npz" ] && w="\"$(sha256sum "$STAGE/model/weights.npz" | cut -c1-64)\""
          export SAVED=$(jq -nc --arg s "$(sha256sum "$STAGE/save.json" | cut -c1-64)" --argjson w "$w" '{saveSha256: $s, weightsSha256: $w}')
          st=0
          ./peaceai/bin/lm-retrain-dryrun-guard.sh ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh --sparse "/runs/lm-retrain/$GITHUB_RUN_ID/arms/$ARM/" "M125 LM retrain sweep arm $ARM (run $GITHUB_RUN_ID)" \
            bash -c 'set -euo pipefail
              p="runs/lm-retrain/$GITHUB_RUN_ID/arms/$ARM/"; a="$RESULTS_DIR/$p"; test ! -e "$a"; mkdir -p "$a"; cp -R "$STAGE"/. "$a"
              if [ -n "$(find "$a" -type l)" ]; then echo "save refused: symlink"; exit 1; fi
              git -C "$RESULTS_DIR" add -A
              while IFS= read -r name; do [ -z "$name" ] && continue
                [ "${name:0:${#p}}" = "$p" ] || { echo "save refused: path outside this arm"; exit 1; }
              done <<< "$(git -C "$RESULTS_DIR" diff --cached --name-only --no-renames)"
              echo "saved=$SAVED" >> "$GITHUB_OUTPUT"' || st=$?
          [ "$st" = 0 ] || echo "arm $ARM save failed (exit $st): not saved; the run continues and re-trains this arm's candidate if it is selected"
          rm -rf "$STAGE"
      - name: Dry run only - set C v2 bpb of every kept checkpoint and of the live model (after training; prints bpb only)
        if: env.DRY_RUN == 'true'
        env:
          PEACEAI_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: ./peaceai/bin/lm-retrain-dryrun-score.sh "$RUNNER_TEMP/arm" "$RUNNER_TEMP/r/live" "$ARM" "$(jq -r .lr "$RUNNER_TEMP/arm/summary.json")" "$RUNNER_TEMP/dry"
      - name: Delete the weights, the corpus and the judge items
        if: always()
        run: rm -rf "$RUNNER_TEMP/r" "$RUNNER_TEMP/w" "$RUNNER_TEMP/arm" "$RUNNER_TEMP/armsave" "$RUNNER_TEMP/dry" "$RUNNER_TEMP/drops.txt" "$RUNNER_TEMP"/peaceai-ssh.* "$RUNNER_TEMP"/peaceai-results.*

  finetune-eval-land:
    name: select the sweep arm, reuse its saved checkpoint (or re-train it from the live model), score both in this run, gate, land in Results
    needs: [corpus-gate, sweep-a, sweep-b]
    if: github.repository == 'PeaceG03/PeaceAI-Workspace' && github.ref == 'refs/heads/main' && !cancelled() && needs.corpus-gate.result == 'success' && inputs.memcheck_only_run_id == '' && ((inputs.resume_run_id == '' && needs.sweep-a.result == 'success' && needs.sweep-b.result == 'success') || (inputs.resume_run_id != '' && needs.sweep-a.result == 'skipped' && needs.sweep-b.result == 'skipped')) && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    environment: peaceai-results
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Job clock (pretrain mode ends training before the job's time limit)
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install workspace tooling and hash-pinned numpy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps --require-hashes -r peaceai/model/requirements.txt
      - name: Verify the checkout and the landing scripts before the key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$RESULTS_SHA256" | sha256sum -c --quiet - || { echo "landing script hash mismatch: key refused"; exit 1; }
      - name: Restore the live model, its recorded judge scores and the judge items from Results (checked)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          ./peaceai/bin/lm-retrain-live.sh "$RUNNER_TEMP/r"
          mv "$RUNNER_TEMP/r/live" "$RUNNER_TEMP/live"; mv "$RUNNER_TEMP/r/items.json" "$RUNNER_TEMP/items.json"
      - name: Rebuild the exact proven corpus (same drops; manifest sha must equal the proven one)
        env:
          DROPS: ${{ needs.corpus-gate.outputs.drops }}
          MANIFEST: ${{ needs.corpus-gate.outputs.manifest }}
          PROOF: ${{ needs.corpus-gate.outputs.proof }}
          REPLAY: ${{ needs.corpus-gate.outputs.replay }}
          REPLAYPROOF: ${{ needs.corpus-gate.outputs.replayproof }}
          PEACEAI_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: |
          set -euo pipefail
          [[ "$DROPS" =~ ^([0-9]+(,[0-9]+)*)?$ && "$MANIFEST" =~ ^[0-9a-f]{64}$ ]] || { echo "bad corpus-gate outputs: refused"; exit 1; }
          printf '%s' "$DROPS" | tr , '\n' > "$RUNNER_TEMP/drops.txt"
          ./peaceai/bin/lm-retrain-corpus.sh "$RUNNER_TEMP/w" "$RUNNER_TEMP/items.json" "$RUNNER_TEMP/drops.txt"
          test "$(sha256sum "$RUNNER_TEMP/w/ft/manifest.jsonl" | cut -c1-64)" = "$MANIFEST" || { echo "rebuilt corpus differs from the proven one: refused"; exit 1; }
          printf '%s' "$PROOF" | base64 -d | gunzip | head -c 20000000 > "$RUNNER_TEMP/corefree-proof-finetune.json"
          test "$(jq -r .noCoreFiles "$RUNNER_TEMP/corefree-proof-finetune.json")" = PROVEN && test "$(jq -r .manifestSha256 "$RUNNER_TEMP/corefree-proof-finetune.json")" = "$MANIFEST" || { echo "proof does not match: refused"; exit 1; }
          ./peaceai/bin/lm-retrain-replay.sh "$RUNNER_TEMP/w" "$RUNNER_TEMP/items.json"
          ./peaceai/bin/lm-retrain-replay-check.sh "$RUNNER_TEMP/w" "$REPLAY" "$REPLAYPROOF"
          rm -rf "$RUNNER_TEMP/w/srcroot"
          jq -c '{docsIn, docsOut, overlapDocs, overlapDocsSetC, overlapDocsJudge, droppedByList, recheckOverlapDocs}' "$RUNNER_TEMP/w/dedup.json"
      - name: Verify the checkout and the landing scripts before the key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$RESULTS_SHA256" | sha256sum -c --quiet - || { echo "landing script hash mismatch: key refused"; exit 1; }
      - name: Fetch the saved sweep arms from Results (sparse; this run's, or resume_run_id's)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          src="${RESUME:-$GITHUB_RUN_ID}"; [[ "$src" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "bad run id: refused"; exit 1; }
          res="$RUNNER_TEMP/armres"; rm -rf "$res" "$RUNNER_TEMP/arms"; mkdir -p "$RUNNER_TEMP/arms"
          ./peaceai/bin/with-deploy-key.sh git clone --quiet --depth 1 --filter=blob:none --sparse git@github.com:PeaceG03/PeaceAI-Results.git "$res"
          ./peaceai/bin/with-deploy-key.sh git -C "$res" sparse-checkout set --no-cone "/runs/lm-retrain/$src/arms/"
          ./peaceai/bin/with-deploy-key.sh git -C "$res" checkout --quiet
          if [ -d "$res/runs/lm-retrain/$src/arms" ]; then cp -R "$res/runs/lm-retrain/$src/arms/." "$RUNNER_TEMP/arms/"; fi
          rm -rf "$res"; echo "saved arms fetched: $(find "$RUNNER_TEMP/arms" -mindepth 1 -maxdepth 1 | wc -l)"
      - name: Verify the saved sweep arms by sha256 against the arm jobs' outputs (or, resuming, against their save records)
        env:
          SA: ${{ needs.sweep-a.outputs.summary }}
          SB: ${{ needs.sweep-b.outputs.summary }}
          VA: ${{ needs.sweep-a.outputs.saved }}
          VB: ${{ needs.sweep-b.outputs.saved }}
          MANIFEST: ${{ needs.corpus-gate.outputs.manifest }}
        run: ./peaceai/bin/lm-retrain-arm-verify.sh "$RUNNER_TEMP/arms" "$RUNNER_TEMP/armsv"
      - name: Select the sweep arm by validation loss on the pretrain-heldout windows (never set C v2, the judge items or the ft corpus)
        id: select
        run: |
          set -euo pipefail
          vs=$(python3 peaceai/model/val_split.py --corpus "$RUNNER_TEMP/w/replay" --dedup "$RUNNER_TEMP/w/replay-dedup.json")
          mode=$(./peaceai/bin/lm-retrain-mode.sh)
          python3 peaceai/model/sweep_select.py "$CFG" "$vs" "$mode" "$(cat "$RUNNER_TEMP/armsv/arm-0.json")" "$(cat "$RUNNER_TEMP/armsv/arm-1.json")" > "$RUNNER_TEMP/select.json"
          jq -c '{mode, validationSplit, selected, arms: [.arms[] | {arm, lr, step0Val, bestVal, bestStep, stoppedStep, earlyStop, stopReason: .timing.stopReason, timeCut: .timing.timeCut, deadlineCut}]}' "$RUNNER_TEMP/select.json"
          echo "candidate=$(jq -r '.selected.candidate == true' "$RUNNER_TEMP/select.json")" >> "$GITHUB_OUTPUT"
          echo "lr=$(jq -r .selected.lr "$RUNNER_TEMP/select.json")" >> "$GITHUB_OUTPUT"
          echo "step=$(jq -r .selected.step "$RUNNER_TEMP/select.json")" >> "$GITHUB_OUTPUT"
      - name: Reuse the selected sweep arm's saved checkpoint as the candidate (sha256 against the arm summary; same identity checks)
        id: reuse
        if: steps.select.outputs.candidate == 'true'
        run: ./peaceai/bin/lm-retrain-arm-reuse.sh "$RUNNER_TEMP/arms" "$RUNNER_TEMP/armsv" "$RUNNER_TEMP/select.json" "$RUNNER_TEMP/live" "$RUNNER_TEMP/model" "$RUNNER_TEMP/candidate-train.json" "$RUNNER_TEMP/cand-metrics.jsonl"
      - name: Fine-tune the candidate from the live weights (selected lr, same schedule, stops at the selected step) and export
        if: steps.select.outputs.candidate == 'true' && steps.reuse.outputs.reused != 'true'
        env:
          PEACEAI_PYTHON: ${{ runner.temp }}/venv/bin/python
          LR: ${{ steps.select.outputs.lr }}
          STEP: ${{ steps.select.outputs.step }}
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/venv/bin/python"
          [[ "$STEP" =~ ^[1-9][0-9]*$ ]] || { echo "bad selected step"; exit 1; }
          ./peaceai/bin/lm-retrain-train.sh "$RUNNER_TEMP/w/ft" "$RUNNER_TEMP/w/dedup.json" "$RUNNER_TEMP/w/replay" "$RUNNER_TEMP/w/replay-dedup.json" "$RUNNER_TEMP/live" "$RUNNER_TEMP/ftwork" "$LR" "$STEP"
          test "$(jq -cS .valSplit "$RUNNER_TEMP/ftwork/summary.json")" = "$(jq -cS .validationSplit "$RUNNER_TEMP/select.json")" || { echo "candidate used a different validation split: refused"; exit 1; }
          test "$(jq -cS .replay.val "$RUNNER_TEMP/ftwork/summary.json")" = "$(jq -cS '.arms[0].replay.val' "$RUNNER_TEMP/select.json")" || { echo "candidate used different validation windows: refused"; exit 1; }
          test "$(jq -cS .replay.corpus "$RUNNER_TEMP/ftwork/summary.json")" = "$(jq -cS '.arms[0].replay.corpus' "$RUNNER_TEMP/select.json")" || { echo "candidate used a different replay corpus: refused"; exit 1; }
          test "$(jq -r .mode "$RUNNER_TEMP/ftwork/summary.json")" = "$(jq -r .mode "$RUNNER_TEMP/select.json")" || { echo "candidate ran in a different mode: refused"; exit 1; }
          cp "$RUNNER_TEMP/ftwork/summary.json" "$RUNNER_TEMP/candidate-train.json"
          "$py" peaceai/model/export.py --work "$RUNNER_TEMP/ftwork" --out "$RUNNER_TEMP/model" --threads 4 --checkpoint checkpoint.npz > /dev/null
          cp "$RUNNER_TEMP/ftwork/metrics.jsonl" "$RUNNER_TEMP/cand-metrics.jsonl"
          rm -rf "$RUNNER_TEMP/ftwork"
      - name: Candidate files and provenance (re-trained or reused)
        if: steps.select.outputs.candidate == 'true'
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/cand-metrics.jsonl" "$RUNNER_TEMP/model/ft-metrics.jsonl"; cp "$RUNNER_TEMP/w/ft/manifest.jsonl" "$RUNNER_TEMP/model/ft-manifest.jsonl"
          cp "$RUNNER_TEMP/corefree-proof-finetune.json" "$RUNNER_TEMP/model/corefree-proof-finetune.json"
          # Provenance under .retrain (not the two-corpus field: that memcheck mode needs a pretrain-corpus proof this run cannot rebuild).
          fts=$(sha256sum "$RUNNER_TEMP/w/ft/manifest.jsonl" | cut -c1-64)
          jq --arg live "$(jq -r .replayBase.version "$CFG")" --arg f "$fts" --arg l "$(jq -r .list.sha256 "$CFG")" --arg r "$GITHUB_RUN_ID" --arg s "$GITHUB_SHA" \
            --slurpfile sel "$RUNNER_TEMP/select.json" --arg rm "$(sha256sum "$RUNNER_TEMP/w/replay/manifest.jsonl" | cut -c1-64)" --argjson fr "$(jq --arg m "$(jq -r .mode "$RUNNER_TEMP/select.json")" '.[$m].replayFrac' "$CFG")" \
            --slurpfile ct "$RUNNER_TEMP/candidate-train.json" \
            '.retrain = {mode: $sel[0].mode, initFrom: $live, finetuneManifestSha256: $f, commitListSha256: $l, runId: $r, workspaceSha: $s,
              validationSplitSha256: $sel[0].validationSplit.sha256, selected: $sel[0].selected, replayManifestSha256: $rm, replayFrac: $fr, replayCorpus: $ct[0].replay.corpus,
              candidateSource: ($ct[0].source // {kind: "retrained"})}' "$RUNNER_TEMP/model/config.json" > "$RUNNER_TEMP/cfg.json" && mv "$RUNNER_TEMP/cfg.json" "$RUNNER_TEMP/model/config.json"
          jq -r '"candidate \(.version) ctx=\(.ctx) params=\(.params) steps=\(.trained_steps)"' "$RUNNER_TEMP/model/config.json"
      - name: Score live and candidate in this run (same set C v2 byte slice, same judge v2 items, same code)
        env:
          CAND: ${{ steps.select.outputs.candidate }}
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/venv/bin/python"; E="$RUNNER_TEMP/evals"; mkdir -p "$E"; mb=$(jq -r .eval.setcMaxBytes "$CFG")
          # Scoring deadline (both modes, eval.scoringDeadlineRule): JOB_START + pretrain.budget.finalJobSeconds (this job's
          # timeout) - eval.scoringReserveSeconds (kept for the gate and the landing). A scoring command still running at the
          # deadline is killed (exit 124/137), its partial output removed, and scoring stops: the gate then lands a
          # "no candidate" record (failed: scoring_deadline) and the job ends red. Any other scoring failure fails this step.
          [[ "${JOB_START-}" =~ ^[1-9][0-9]{8,10}$ ]] || { echo "no job clock (JOB_START): refused"; exit 1; }
          js=$(jq -r .pretrain.budget.finalJobSeconds "$CFG"); rs=$(jq -r .eval.scoringReserveSeconds "$CFG")
          [[ "$js" =~ ^[1-9][0-9]*$ && "$rs" =~ ^[1-9][0-9]*$ ]] && [ "$rs" -lt "$js" ] || { echo "bad scoring budget: refused"; exit 1; }
          dl=$((JOB_START + js - rs)); rm -f "$RUNNER_TEMP/scoring-cut.txt"
          by_deadline() { local left=$((dl - $(date +%s))); [ "$left" -gt 0 ] || return 124; timeout -k 30 "$left" "$@"; }
          # No candidate (every sweep arm deadline-cut at step 0): only the live model is scored; step 0 IS the live weights.
          whos=(live); [ "$CAND" = true ] && whos+=(model)
          for who in "${whos[@]}"; do
            st=0; by_deadline "$py" peaceai/model/eval_c.py --model "$RUNNER_TEMP/$who" --corpus "$RUNNER_TEMP/w/setc" --max-bytes "$mb" --threads 4 > "$E/setc-$who.txt" || st=$?
            if [ "$st" = 0 ]; then
              cat "$E/setc-$who.txt"
              by_deadline "$py" peaceai/model/judge364.py --model "$RUNNER_TEMP/$who" --items "$RUNNER_TEMP/items.json" --out "$E/judge-$who.json" --threads 4 || st=$?
            fi
            if [ "$st" = 124 ] || [ "$st" = 137 ]; then
              rm -f "$E/setc-$who.txt" "$E/judge-$who.json"; echo "$who" > "$RUNNER_TEMP/scoring-cut.txt"
              echo "scoring deadline ($dl) reached while scoring $who: scoring stopped; no candidate; the record still lands and the job ends red"; break
            fi
            [ "$st" = 0 ] || { echo "scoring $who failed (exit $st)"; exit "$st"; }
          done
      - name: Gate (slice identical and pinned; 0 eval overlap; scorer reproduces the live record; candidate set C bpb <= live - eval.minBpbGain; judge AUC report-only)
        id: gate
        env:
          CAND: ${{ steps.select.outputs.candidate }}
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/evals"; want=$(jq -r .eval.setcSliceSha256 "$CFG")
          # No candidate (condition 4: every sweep arm deadline-cut before its first evaluation after step 0): the selected
          # step is 0, i.e. the live weights, so "model" reads the live score (gain 0; the margin gate fails by construction),
          # the gate records "no candidate", the run record still lands, and nothing is landed as a model or promoted.
          nc=true; [ "$CAND" = true ] && nc=false
          src() { if [ "$1" = model ] && [ "$nc" = true ]; then echo live; else echo "$1"; fi; }
          sl() { sed -n 's/.* slice_sha256=\([0-9a-f]*\) .*/\1/p' "$E/setc-$(src "$1").txt"; }
          bpb() { sed -n 's/.* bits_per_byte=\([0-9.]*\).*/\1/p' "$E/setc-$(src "$1").txt"; }
          ok=true; why=()
          # Scoring cut at the scoring deadline (Score step): no candidate, whatever was trained; the gate fails and the job ends red.
          sc=false; cw=""; if [ -e "$RUNNER_TEMP/scoring-cut.txt" ]; then sc=true; nc=true; cw=$(head -c 16 "$RUNNER_TEMP/scoring-cut.txt" | tr -dc a-z); ok=false; why+=(scoring_deadline); fi
          [ "$nc" = false ] || { ok=false; why+=(no_candidate); mkdir -p "$RUNNER_TEMP/model"
            [ -s "$RUNNER_TEMP/candidate-train.json" ] || jq -n --slurpfile sel "$RUNNER_TEMP/select.json" '{noCandidate: true, mode: $sel[0].mode, stoppedStep: 0, bestStep: 0, replay: {corpus: $sel[0].arms[0].replay.corpus}}' > "$RUNNER_TEMP/candidate-train.json"
            echo '{"summary": null}' > "$RUNNER_TEMP/judge-none.json"; echo '{"blocks": false, "effective": "no candidate"}' > "$E/judge-gate.json"; }
          [ "$(sl live)" = "$want" ] && [ "$(sl model)" = "$want" ] || { ok=false; why+=(slice); }
          [ "$(jq -r .recheckOverlapDocs "$RUNNER_TEMP/w/dedup.json")" = 0 ] || { ok=false; why+=(overlap); }
          # judge364.py must reproduce the live model's recorded per-item aggregates (Results lm-judge-v2/scores-<live>.json):
          # same keys, same token counts, every mean within 1e-4 (peaceai/model/judge_repro.py, shared with peace-lm-judge-v2.yml). Counts only are printed.
          scorer=false
          python3 peaceai/model/judge_repro.py "$RUNNER_TEMP/r/scores-live-recorded.json" "$E/judge-live.json" && scorer=true || { ok=false; why+=(judge_scorer_not_reproduced); }
          # Margin gate (both modes): candidate <= live - eval.minBpbGain, exact decimal (bpb_gate.py refuses a margin <= 0).
          python3 peaceai/model/bpb_gate.py "$(bpb live)" "$(bpb model)" "$(jq -r .eval.minBpbGain "$CFG")" || { ok=false; why+=(setc_bpb); }
          [ "$(jq -r .mode "$RUNNER_TEMP/select.json")" = "$MODE" ] && [ "$(jq -r .mode "$RUNNER_TEMP/candidate-train.json")" = "$MODE" ] || { ok=false; why+=(mode); }
          [ "$(jq -r .replay.corpus.docsSha256 "$RUNNER_TEMP/candidate-train.json")" = "$(jq -r .replayDocsSha256 "$RUNNER_TEMP/w/replay-proof.json")" ] || { ok=false; why+=(replay_corpus); }
          # Judge AUC: report-only. judge_gate.py makes it a hard gate only under the promote-to-hard rule (configured
          # "hard" AND the live model's lower 95% bound > 0.5 on both the full set and the non-identity subset).
          [ "$nc" = true ] || python3 peaceai/model/judge_gate.py --mode "$(jq -r .eval.judgeAucGate "$CFG")" --live "$E/judge-live.json" --candidate "$E/judge-model.json" > "$E/judge-gate.json"
          [ "$(jq -r .blocks "$E/judge-gate.json")" = false ] || { ok=false; why+=(judge_auc); }
          [ "$(jq -r .stoppedStep "$RUNNER_TEMP/candidate-train.json")" = "$(jq -r .selected.step "$RUNNER_TEMP/select.json")" ] || { ok=false; why+=(selected_step_not_reached); }
          v=""; w=""; jmf="$RUNNER_TEMP/judge-none.json"; jlf="$E/judge-live.json"
          if [ "$sc" = true ] && [ ! -s "$jlf" ]; then jlf="$RUNNER_TEMP/judge-none.json"; fi
          if [ "$nc" = false ]; then
            v=$(jq -r .version "$RUNNER_TEMP/model/config.json"); w=$(sha256sum "$RUNNER_TEMP/model/weights.npz" | cut -c1-64); jmf="$E/judge-model.json"
            [[ "$v" =~ ^lm-v1-[0-9a-f]{12}$ ]] || { echo "bad candidate version"; exit 1; }
          fi
          jq -n --arg run "$GITHUB_RUN_ID" --arg ws "$GITHUB_SHA" --slurpfile cfg "$CFG" --slurpfile dd "$RUNNER_TEMP/w/dedup.json" \
            --slurpfile jl "$jlf" --slurpfile jm "$jmf" --slurpfile jg "$E/judge-gate.json" --arg v "$v" --arg w "$w" \
            --arg jc "$(cat "$RUNNER_TEMP/r/judge-commit.txt")" \
            --slurpfile sel "$RUNNER_TEMP/select.json" --slurpfile ct "$RUNNER_TEMP/candidate-train.json" --arg scorer "$scorer" \
            --arg bl "$(bpb live)" --arg bm "$(bpb model)" --arg sl "$(sl live)" --arg sm "$(sl model)" --arg ok "$ok" --arg why "${why[*]:-}" --arg sc "$sc" --arg cw "$cw" \
            --arg proof "$(sha256sum "$RUNNER_TEMP/corefree-proof-finetune.json" | cut -c1-64)" \
            --slurpfile rp "$RUNNER_TEMP/w/replay-proof.json" --slurpfile fp "$RUNNER_TEMP/w/ft-prepare.json" \
            --slurpfile rpl "$RUNNER_TEMP/w/replay-plan.json" --arg mode "$(jq -r .mode "$RUNNER_TEMP/select.json")" --arg rs "${RESUME-}" \
            '{schema: "peaceai-lm-retrain-record:v5", runId: $run, workspaceSha: $ws, mode: $mode, live: $cfg[0].replayBase.version, candidate: (if $v == "" then null else $v end), candidateWeightsSha256: (if $w == "" then null else $w end),
              commitList: $cfg[0].list, finetune: $cfg[0].finetune, training: $cfg[0][$mode], dedup: $dd[0], finetuneCorefreeProofSha256: $proof,
              ftPrepare: $fp[0], replay: {config: $cfg[0].replay, plan: $rpl[0], overlapProof: $rp[0],
                corpus: {docsSha256: $rp[0].replayDocsSha256, docsBytes: $rp[0].replayDocsBytes, trainBytes: $rp[0].trainBytes, valBytes: $rp[0].valBytes}},
              validationSplit: $sel[0].validationSplit, sweep: $sel[0].arms, selected: $sel[0].selected, candidateTraining: (if $ct[0].noCandidate == true then null else $ct[0] end),
              candidateSource: (if $ct[0].noCandidate == true then null else ($ct[0].source // {kind: "retrained"}) end), resumeRunId: (if $rs == "" then null else $rs end),
              setcV2: {maxBytes: $cfg[0].eval.setcMaxBytes, sliceSha256: {live: $sl, candidate: $sm}, bitsPerByte: {live: (if $bl == "" then null else ($bl | tonumber) end), candidate: (if $bm == "" then null else ($bm | tonumber) end)},
                minBpbGain: $cfg[0].eval.minBpbGain, rule: $cfg[0].eval.minBpbGainRule},
              judge: {set: $cfg[0].eval.judgeSet, items: $cfg[0].eval.judgeItems, itemsSha256: $cfg[0].eval.judgeItemsSha256, resultsCommit: $jc,
                live: $jl[0].summary, candidate: $jm[0].summary, scorerReproducesLiveRecord: ($scorer == "true"), aucGate: $jg[0]},
              gate: {pass: ($ok == "true"), failed: ($why | split(" ") | map(select(. != ""))),
                scoringDeadline: {cut: ($sc == "true"), during: (if $cw == "" then null else $cw end), reserveSeconds: $cfg[0].eval.scoringReserveSeconds},
                result: (if $sc != "true" and $sel[0].selected.candidate == true then (if $ok == "true" then "pass" else "fail" end) else "no candidate" end)}, promoted: false,
              memcheck: (if $mode == "pretrain" then "pending (memcheck job: strict 32-character rule on the fine-tune corpus AND on the replay corpus; both must PASS)" else "pending (memcheck job, strict 32-character rule)" end)}' > "$E/record.json"
          jq -c '{mode, live, candidate, candidateWeightsSha256, validationSplitSha256: .validationSplit.sha256, selected, bpb: .setcV2.bitsPerByte,
            judgeAuc: {mode: .judge.aucGate.effective, hardEligible: .judge.aucGate.hardEligible,
              live: {full: .judge.live.auc_exact, full95: .judge.live.auc_ci95, nonidentity: .judge.live.nonidentity.auc_exact, nonidentity95: .judge.live.nonidentity.auc_ci95},
              candidate: {full: .judge.candidate.auc_exact, full95: .judge.candidate.auc_ci95, nonidentity: .judge.candidate.nonidentity.auc_exact, nonidentity95: .judge.candidate.nonidentity.auc_ci95}},
            overlapDocs: .dedup.overlapDocs, gate}' "$E/record.json"
          echo "pass=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" = true ] && [ "$nc" = false ]; then echo "version=$v" >> "$GITHUB_OUTPUT"; fi
      - name: Verify the checkout and the landing scripts before the key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$RESULTS_SHA256" | sha256sum -c --quiet - || { echo "landing script hash mismatch: key refused"; exit 1; }
      - name: Land the run record (and, only on gate PASS, the candidate) in Results only (no latest.json; no promotion)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
          MODEL_DIR: ${{ runner.temp }}/model
          EVALS: ${{ runner.temp }}/evals
          PASS: ${{ steps.gate.outputs.pass }}
        run: |
          set -euo pipefail
          # blobless sparse Results clone (Auditor, #564 follow-up): only this run's dir and, on PASS, the new model dir
          sp=(--sparse "/runs/lm-retrain/$GITHUB_RUN_ID/")
          if [ "$PASS" = true ]; then v=$(jq -r .version "$MODEL_DIR/config.json")
            [[ "$v" =~ ^lm-v1-[0-9a-f]{12}$ ]] || { echo "landing refused: bad version"; exit 1; }; sp+=(--sparse "/models/lm/$v/"); fi
          ./peaceai/bin/lm-retrain-dryrun-guard.sh ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh "${sp[@]}" "M119 LM retrain candidate (run $GITHUB_RUN_ID)" \
            bash -c 'set -euo pipefail
              v=none; if [ "$PASS" = true ]; then v=$(jq -r .version "$MODEL_DIR/config.json")
              [[ "$v" =~ ^lm-v1-[0-9a-f]{12}$ ]] || { echo "landing refused: bad version"; exit 1; }; fi
              if [ -n "$(find "$MODEL_DIR" "$EVALS" -type l)" ]; then echo "landing refused: symlink"; exit 1; fi
              r="$RESULTS_DIR/runs/lm-retrain/$GITHUB_RUN_ID"
              if [ -e "$r" ]; then [ "$(ls -A "$r")" = arms ] || { echo "landing refused: run dir already holds more than the saved arms"; exit 1; }; fi
              mkdir -p "$r"; for f in "$EVALS"/*; do test ! -e "$r/$(basename "$f")"; done; cp "$EVALS"/* "$r"/
              allowed=("runs/lm-retrain/$GITHUB_RUN_ID/")
              if [ "$PASS" = true ]; then d="$RESULTS_DIR/models/lm/$v"; test ! -e "$d"; mkdir -p "$d"; cp -P "$MODEL_DIR"/* "$d"/; allowed+=("models/lm/$v/"); fi
              git -C "$RESULTS_DIR" add -A
              while IFS= read -r name; do [ -z "$name" ] && continue
                okp=false; for p in "${allowed[@]}"; do [ "${name:0:${#p}}" = "$p" ] && okp=true; done
                a="runs/lm-retrain/$GITHUB_RUN_ID/arms/"; [ "${name:0:${#a}}" != "$a" ] || okp=false
                [ "$okp" = true ] || { echo "landing refused: path outside the run record and model dir"; exit 1; }
              done <<< "$(git -C "$RESULTS_DIR" diff --cached --name-only --no-renames)"'
          rm -rf "$RUNNER_TEMP/model" "$RUNNER_TEMP/live" "$RUNNER_TEMP/r" "$RUNNER_TEMP/w" "$RUNNER_TEMP/items.json" "$RUNNER_TEMP/evals" "$RUNNER_TEMP/select.json" "$RUNNER_TEMP/candidate-train.json" "$RUNNER_TEMP/arms" "$RUNNER_TEMP/armsv" "$RUNNER_TEMP/cand-metrics.jsonl"
      - name: Result (fail unless the gate passed)
        env:
          PASS: ${{ steps.gate.outputs.pass }}
        run: |
          test "$PASS" = true || { echo "gate FAILED: record landed, candidate not landed"; exit 1; }

  retrain-memcheck:
    name: verbatim memcheck of the landed candidate (finetune - strict 32-character rule; pretrain - two-corpus mode, both proofs; counts only)
    needs: [corpus-gate, finetune-eval-land]
    if: github.repository == 'PeaceG03/PeaceAI-Workspace' && github.ref == 'refs/heads/main' && !cancelled() && needs.corpus-gate.result == 'success' && ((inputs.memcheck_only_run_id == '' && needs.finetune-eval-land.result == 'success' && needs.finetune-eval-land.outputs.version != '') || (inputs.memcheck_only_run_id != '' && needs.finetune-eval-land.result == 'skipped')) && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: peaceai-core
    permissions:
      contents: read
    outputs:
      memcheck: ${{ steps.mc.outputs.memcheck }}
      version: ${{ steps.fetch.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling and hash-pinned numpy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps --require-hashes -r peaceai/model/requirements.txt
      - name: Verify the checkout and the key scripts before any key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$CORE_SHA256" | sha256sum -c --quiet - || { echo "key script hash mismatch: key refused"; exit 1; }
      - name: Fetch and verify the landed candidate, its run record and the live core-free proof; the judge items (read-only key, sparse)
        id: fetch
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_READ_KEY }}
          V: ${{ needs.finetune-eval-land.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "${DEPLOY_KEY:-}" ] || { echo "PEACEAI_RESULTS_READ_KEY is not set: refused (fail closed)"; exit 1; }
          run="${MCO:-$GITHUB_RUN_ID}"; [ -n "$MCO" ] || [[ "$V" =~ ^lm-v1-[0-9a-f]{12}$ ]] || { echo "bad version"; exit 1; }
          [[ "$run" =~ ^[1-9][0-9]{5,19}$ ]] || { echo "bad run id"; exit 1; }
          res="$RUNNER_TEMP/res"
          ./peaceai/bin/with-deploy-key.sh git clone --quiet --depth 1 --filter=blob:none --sparse git@github.com:PeaceG03/PeaceAI-Results.git "$res"
          ./peaceai/bin/with-deploy-key.sh git -C "$res" sparse-checkout set --no-cone "/runs/lm-retrain/$run/record.json" "/runs/lm-retrain/$run/memcheck.json"
          ./peaceai/bin/with-deploy-key.sh git -C "$res" checkout --quiet
          [ -n "$V" ] || V=$(jq -r '.candidate // ""' "$res/runs/lm-retrain/$run/record.json")
          [[ "$V" =~ ^lm-v1-[0-9a-f]{12}$ ]] || { echo "bad version"; exit 1; }
          live=$(jq -r .replayBase.version "$CFG"); [[ "$live" =~ ^lm-v1-[0-9a-f]{12}$ ]] || { echo "bad replay base version"; exit 1; }
          ./peaceai/bin/with-deploy-key.sh git -C "$res" sparse-checkout add "/models/lm/$V/" "/models/lm/$live/corefree-proof.json"
          ./peaceai/bin/with-deploy-key.sh git -C "$res" checkout --quiet
          MCO="$MCO" ./peaceai/bin/lm-retrain-memcheck-fetch.sh "$res" "$RUNNER_TEMP" "$run" "$V"
          rm -rf "$res"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          ./peaceai/bin/lm-retrain-judge.sh "$RUNNER_TEMP"
      - name: Rebuild the exact training corpus (public prompts for the memcheck; pretrain mode also the replay corpus)
        env:
          DROPS: ${{ needs.corpus-gate.outputs.drops }}
          MANIFEST: ${{ needs.corpus-gate.outputs.manifest }}
          REPLAY: ${{ needs.corpus-gate.outputs.replay }}
          REPLAYPROOF: ${{ needs.corpus-gate.outputs.replayproof }}
          PEACEAI_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: |
          set -euo pipefail
          [[ "$DROPS" =~ ^([0-9]+(,[0-9]+)*)?$ && "$MANIFEST" =~ ^[0-9a-f]{64}$ ]] || { echo "bad corpus-gate outputs: refused"; exit 1; }
          printf '%s' "$DROPS" | tr , '\n' > "$RUNNER_TEMP/drops.txt"
          ./peaceai/bin/lm-retrain-corpus.sh "$RUNNER_TEMP/w" "$RUNNER_TEMP/items.json" "$RUNNER_TEMP/drops.txt"
          test "$(sha256sum "$RUNNER_TEMP/w/ft/manifest.jsonl" | cut -c1-64)" = "$MANIFEST" || { echo "rebuilt corpus differs: refused"; exit 1; }
          test "$(jq -r .retrain.finetuneManifestSha256 "$RUNNER_TEMP/model/config.json")" = "$MANIFEST" || { echo "model was not trained on this corpus: refused"; exit 1; }
          mode=$(./peaceai/bin/lm-retrain-mode.sh)
          test "$(jq -r .retrain.mode "$RUNNER_TEMP/model/config.json")" = "$mode" || { echo "model was not trained in this mode: refused"; exit 1; }
          if [ "$mode" = pretrain ]; then
            # the replay corpus this candidate trained on: rebuilt, re-proven against set C v2 and the judge items, then checked
            ./peaceai/bin/lm-retrain-replay.sh "$RUNNER_TEMP/w" "$RUNNER_TEMP/items.json"
            ./peaceai/bin/lm-retrain-replay-check.sh "$RUNNER_TEMP/w" "$REPLAY" "$REPLAYPROOF"
            test "$(sha256sum "$RUNNER_TEMP/w/replay/docs.jsonl" | cut -c1-64)" = "$(jq -r .retrain.replayCorpus.docsSha256 "$RUNNER_TEMP/model/config.json")" || { echo "replay corpus differs from the one trained on: refused"; exit 1; }
          fi
          rm -rf "$RUNNER_TEMP/w/srcroot" "$RUNNER_TEMP/w/setc" "$RUNNER_TEMP/items.json"
      - name: Verify the checkout and the key scripts before the core key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$CORE_SHA256" | sha256sum -c --quiet - || { echo "key script hash mismatch: key refused"; exit 1; }
      - name: Clone core (read-only key, outside the workspace)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_CORE_DEPLOY_KEY }}
        run: ./peaceai/bin/clone-core.sh "$RUNNER_TEMP/peaceai-core"
      - name: Verbatim memcheck (finetune - strict 32-character rule, no training corpus given; pretrain - two-corpus mode with both proofs, a fine-tune-corpus run and a replay-corpus run; counts only)
        id: mc
        env:
          PEACEAI_PYTHON: ${{ runner.temp }}/venv/bin/python
          PEACEAI_LM_MODEL_DIR: ${{ runner.temp }}/model
          PEACEAI_LM_CORPUS: ${{ runner.temp }}/w/ft
          PEACEAI_CORE_DIR: ${{ runner.temp }}/peaceai-core
          PEACEAI_LM_THREADS: "4"
        run: |
          set -euo pipefail
          mode=$(./peaceai/bin/lm-retrain-mode.sh)
          M="$RUNNER_TEMP/model/memcheck.json"
          if [ "$mode" = finetune ]; then
            ./node_modules/.bin/tsx peaceai/bin/lm-memcheck.ts || true
            test -f "$M" || { echo "no memcheck record"; exit 1; }
            test "$(jq -r .substringRule "$M")" = strict || { echo "memcheck did not use the strict rule: refused"; exit 1; }
          else
            # two-corpus mode (lm-memcheck.ts PEACEAI_LM_TRAIN_CORPUS + PEACEAI_LM_FT_CORPUS); the proof chain is checked
            # against the corpora and the live manifest rebuilt above; a broken link records FAIL (never the strict fallback)
            export PEACEAI_LM_TRAIN_CORPUS="$RUNNER_TEMP/w/replay" PEACEAI_LM_FT_CORPUS="$RUNNER_TEMP/w/ft" PEACEAI_LM_RETRAIN_CFG="$CFG" \
              PEACEAI_LM_LIVE_PROOF="$RUNNER_TEMP/live-proof.json" PEACEAI_LM_LIVE_MANIFEST="$RUNNER_TEMP/w/replay-live-manifest.jsonl" \
              PEACEAI_LM_FT_PROOF_SHA256="$(cat "$RUNNER_TEMP/ft-proof-sha256")"
            ./node_modules/.bin/tsx peaceai/bin/lm-memcheck.ts || true
            test -f "$M" || { echo "no memcheck record"; exit 1; }
            jq -e '.coreFreeProofs | type == "object"' "$M" > /dev/null || { echo "memcheck did not use the two-corpus mode: refused"; exit 1; }
            mv "$M" "$RUNNER_TEMP/memcheck-ft.json"
            PEACEAI_LM_CORPUS="$RUNNER_TEMP/w/replay" ./node_modules/.bin/tsx peaceai/bin/lm-memcheck.ts || true
            test -f "$M" || { echo "no replay-corpus memcheck record"; exit 1; }
            jq -e '.coreFreeProofs | type == "object"' "$M" > /dev/null || { echo "memcheck did not use the two-corpus mode: refused"; exit 1; }
            mv "$M" "$RUNNER_TEMP/memcheck-replay.json"
            python3 peaceai/model/memcheck_combine.py --ft "$RUNNER_TEMP/memcheck-ft.json" --replay "$RUNNER_TEMP/memcheck-replay.json" --out "$M" || true
            jq -e '.pretrainMemcheck.twoCorpus == true' "$M" > /dev/null || { echo "combined memcheck is not two-corpus: refused"; exit 1; }
          fi
          b64=$(gzip -9c "$M" | base64 -w0); [ "${#b64}" -le 800000 ] || { echo "memcheck record too large for a job output: refused"; exit 1; }
          echo "memcheck=$b64" >> "$GITHUB_OUTPUT"
      - name: Delete core, the model and the corpus
        if: always()
        run: rm -rf "$RUNNER_TEMP/peaceai-core" "$RUNNER_TEMP"/peaceai-ssh.* "$RUNNER_TEMP/model" "$RUNNER_TEMP/res" "$RUNNER_TEMP/w" "$RUNNER_TEMP/items.json" "$RUNNER_TEMP"/memcheck-*.json "$RUNNER_TEMP/live-proof.json" "$RUNNER_TEMP/ft-proof-sha256" "$RUNNER_TEMP/version"

  record-memcheck:
    name: record the memcheck in Results (append-only; no promotion)
    needs: [finetune-eval-land, retrain-memcheck]
    if: github.repository == 'PeaceG03/PeaceAI-Workspace' && github.ref == 'refs/heads/main' && !cancelled() && ((inputs.memcheck_only_run_id == '' && needs.finetune-eval-land.result == 'success') || (inputs.memcheck_only_run_id != '' && needs.finetune-eval-land.result == 'skipped')) && needs.retrain-memcheck.result == 'success' && needs.retrain-memcheck.outputs.memcheck != '' && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: peaceai-results
    permissions:
      contents: read
    outputs:
      landed: ${{ steps.land.outputs.landed }}
      status: ${{ steps.decode.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decode the count-level memcheck record
        id: decode
        env:
          MC: ${{ needs.retrain-memcheck.outputs.memcheck }}
          V: ${{ needs.retrain-memcheck.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$V" =~ ^lm-v1-[0-9a-f]{12}$ ]] || { echo "bad version"; exit 1; }
          mkdir -p "$RUNNER_TEMP/mc"; printf '%s' "$MC" | base64 -d | gunzip | head -c 5000000 > "$RUNNER_TEMP/mc/memcheck.json"
          jq -e .status "$RUNNER_TEMP/mc/memcheck.json" > /dev/null
          jq -r '"memcheck status=\(.status) rule=\(.substringRule)"' "$RUNNER_TEMP/mc/memcheck.json"
          st=$(jq -r .status "$RUNNER_TEMP/mc/memcheck.json"); [[ "$st" =~ ^(PASS|FAIL)$ ]] || { echo "bad memcheck status"; exit 1; }
          echo "status=$st" >> "$GITHUB_OUTPUT"
          if [ -n "$MCO" ]; then  # memcheck-only: the recheck record names its source run, this run and the candidate
            jq --arg src "$MCO" --arg run "$GITHUB_RUN_ID" --arg ws "$GITHUB_SHA" --arg v "$V" \
              '. + {recheck: {sourceRunId: $src, recheckRunId: $run, workspaceSha: $ws, candidate: $v, promotes: false}}' "$RUNNER_TEMP/mc/memcheck.json" > "$RUNNER_TEMP/mc/recheck.json"
          fi
      - name: Verify the checkout and the landing scripts before the key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$RESULTS_SHA256" | sha256sum -c --quiet - || { echo "landing script hash mismatch: key refused"; exit 1; }
      - name: Land memcheck.json next to the run record and the candidate (latest.json untouched; memcheck-only - append memcheck-recheck-<this run>.json under that run only)
        id: land
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
          V: ${{ needs.retrain-memcheck.outputs.version }}
          MC_DIR: ${{ runner.temp }}/mc
        run: |
          set -euo pipefail
          if [ -n "$MCO" ]; then
            [[ "$MCO" =~ ^[1-9][0-9]{5,19}$ ]] || { echo "bad memcheck_only_run_id"; exit 1; }
            ./peaceai/bin/lm-retrain-dryrun-guard.sh ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh --sparse "/runs/lm-retrain/$MCO/record.json" --sparse "/runs/lm-retrain/$MCO/memcheck-recheck-$GITHUB_RUN_ID.json" "LM retrain memcheck recheck of run $MCO (run $GITHUB_RUN_ID)" \
              bash -c 'set -euo pipefail
                r="$RESULTS_DIR/runs/lm-retrain/$MCO"; f="$r/memcheck-recheck-$GITHUB_RUN_ID.json"
                test -d "$r" && test -f "$r/record.json" && test ! -e "$f"
                cp "$MC_DIR/recheck.json" "$f"
                git -C "$RESULTS_DIR" add -A
                while IFS= read -r name; do [ -z "$name" ] && continue
                  [ "$name" = "runs/lm-retrain/$MCO/memcheck-recheck-$GITHUB_RUN_ID.json" ] || { echo "landing refused: unexpected path"; exit 1; }
                done <<< "$(git -C "$RESULTS_DIR" diff --cached --name-only --no-renames)"
                test -z "$(git -C "$RESULTS_DIR" diff --cached --name-only --no-renames --diff-filter=MDRT)" || { echo "landing refused: not append-only"; exit 1; }'
            echo "landed=true" >> "$GITHUB_OUTPUT"; rm -rf "$RUNNER_TEMP/mc"; exit 0
          fi
          ./peaceai/bin/lm-retrain-dryrun-guard.sh ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh --sparse "/models/lm/$V/" --sparse "/runs/lm-retrain/$GITHUB_RUN_ID/" "M119 LM retrain memcheck (run $GITHUB_RUN_ID)" \
            bash -c 'set -euo pipefail
              d="$RESULTS_DIR/models/lm/$V"; r="$RESULTS_DIR/runs/lm-retrain/$GITHUB_RUN_ID"
              test -d "$d" && test -d "$r" && test ! -e "$d/memcheck.json" && test ! -e "$r/memcheck.json"
              cp "$MC_DIR/memcheck.json" "$d/memcheck.json"; cp "$MC_DIR/memcheck.json" "$r/memcheck.json"
              git -C "$RESULTS_DIR" add -A
              while IFS= read -r name; do [ -z "$name" ] && continue
                [ "$name" = "models/lm/$V/memcheck.json" ] || [ "$name" = "runs/lm-retrain/$GITHUB_RUN_ID/memcheck.json" ] || { echo "landing refused: unexpected path"; exit 1; }
              done <<< "$(git -C "$RESULTS_DIR" diff --cached --name-only --no-renames)"'
          echo "landed=true" >> "$GITHUB_OUTPUT"
          rm -rf "$RUNNER_TEMP/mc"
      - name: Result (fail unless memcheck PASS; promotion still needs the Auditor's review of this run id and weights sha)
        env:
          MC: ${{ needs.retrain-memcheck.outputs.memcheck }}
        run: test "$(printf '%s' "$MC" | base64 -d | gunzip | jq -r .status)" = PASS

  retrain-outcome:
    name: outcome (real run - select, memcheck and record succeeded; dry run - every arm finished and the select rule picks)
    needs: [corpus-gate, sweep-a, sweep-b, finetune-eval-land, retrain-memcheck, record-memcheck]
    if: always() && github.repository == 'PeaceG03/PeaceAI-Workspace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Outcome (fail unless the run did what its mode promises; results and arm summaries only, no key)
        env:
          SEL: ${{ needs.finetune-eval-land.result }}
          MC: ${{ needs.retrain-memcheck.result }}
          REC: ${{ needs.record-memcheck.result }}
          REC_LANDED: ${{ needs.record-memcheck.outputs.landed }}
          MC_STATUS: ${{ needs.record-memcheck.outputs.status }}
          SA: ${{ needs.sweep-a.outputs.summary }}
          SB: ${{ needs.sweep-b.outputs.summary }}
        run: ./peaceai/bin/lm-retrain-outcome.sh

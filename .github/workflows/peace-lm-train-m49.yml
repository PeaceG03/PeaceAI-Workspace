  finetune-land:
    name: fine-tune, land (no latest.json), static evals
    needs: pretrain-3
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment: peaceai-results
    permissions:
      contents: read
    outputs:
      ab_candidates: ${{ steps.abgen.outputs.ab_candidates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling and hash-pinned numpy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps --require-hashes -r peaceai/model/requirements.txt
      - name: Verify the checkout and the landing scripts before the key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$LANDING_SHA256" | sha256sum -c --quiet - || { echo "landing script hash mismatch: key refused"; exit 1; }
      - name: Restore pretrain part 3 from Results
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          prev="runs/lm-work/$GITHUB_RUN_ID/part-3"
          ./peaceai/bin/with-deploy-key.sh git clone --quiet --depth 1 --filter=blob:none --sparse git@github.com:PeaceG03/PeaceAI-Results.git "$RUNNER_TEMP/res"
          ./peaceai/bin/with-deploy-key.sh git -C "$RUNNER_TEMP/res" sparse-checkout set "$prev"
          ./peaceai/bin/with-deploy-key.sh git -C "$RUNNER_TEMP/res" checkout --quiet
          (cd "$RUNNER_TEMP/res/$prev" && sha256sum -c --quiet SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/work"; cat "$RUNNER_TEMP/res/$prev"/work.tar.part-* | tar -x -C "$RUNNER_TEMP/work"
          rm -rf "$RUNNER_TEMP/res"
      - name: Fine-tune corpus (function-body pairs from all PeaceG03 public commits; A/B, C, #176 and safety-tool files excluded by path and sha)
        run: |
          set -euo pipefail
          # M49 BLOCKING (1): built only from the repo commits pinned in the box core-free record (never HEAD); the
          # record's repos must be exactly the config's fine-tune repos; docs the box proof flagged as core are dropped.
          FTC=peaceai/model/ft-corefree.json
          test "$(jq -c '[.repos[].repo]' "$FTC")" = "$(jq -c '.finetune.repos' "$CFG")" || { echo "ft-corefree repos are not the config's fine-tune repos: refused"; exit 1; }
          gate=()
          while read -r r sha; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "unpinned fine-tune repo: refused"; exit 1; }
            git clone --quiet "https://github.com/$r.git" "$RUNNER_TEMP/peace/${r#*/}"
            git -C "$RUNNER_TEMP/peace/${r#*/}" checkout --quiet --detach "$sha"
            test "$(git -C "$RUNNER_TEMP/peace/${r#*/}" rev-parse HEAD)" = "$sha" || { echo "pinned commit missing: refused"; exit 1; }
            specs+=("$r=$RUNNER_TEMP/peace/${r#*/}@$sha"); gate+=("$r@$sha")
          done < <(jq -r '.repos[] | "\(.repo) \(.sha)"' "$FTC")
          ./node_modules/.bin/tsx peaceai/bin/ft-pairs.ts "$RUNNER_TEMP/ft" "${specs[@]}"
          printf '%s\n' "${gate[@]}" > "$RUNNER_TEMP/ft-gate-repos"
      - name: Fine-tune core gate (refuse unless the box core-free proof's sha is recorded for exactly this corpus)
        run: |
          set -euo pipefail
          mapfile -t gate < "$RUNNER_TEMP/ft-gate-repos"
          ./node_modules/.bin/tsx peaceai/bin/ft-gate.ts "$RUNNER_TEMP/ft" "${gate[@]}"
      - name: Fine-tune from the pretrain best weights (same tokenizer, fresh optimizer)
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/venv/bin/python"; m() { jq -r ".model.$1" "$CFG"; }; f() { jq -r ".finetune.$1" "$CFG"; }
          ck=best.npz; test -f "$RUNNER_TEMP/work/best.npz" || ck=checkpoint.npz
          mkdir -p "$RUNNER_TEMP/ftwork"; cp "$RUNNER_TEMP/work/tokenizer.json" "$RUNNER_TEMP/ftwork/"
          "$py" peaceai/model/train.py --corpus "$RUNNER_TEMP/ft" --work "$RUNNER_TEMP/ftwork" --init-from "$RUNNER_TEMP/work/$ck" \
            --ctx "$(m ctx)" --d-model "$(m d_model)" --n-layer "$(m n_layer)" --n-head "$(m n_head)" --vocab "$(m vocab)" --batch "$(m batch)" \
            --steps "$(f steps)" --lr "$(f lr)" --warmup "$(f warmup)" --eval-every 25 --patience "$(f patience)" --threads 4 --max-seconds 7200 \
            > "$RUNNER_TEMP/ft.log" 2>&1 || { echo "fine-tune failed exit=$?"; exit 1; }
          grep -E '^(params=|tokens |initialized |best val_loss|stopped )' "$RUNNER_TEMP/ft.log" || true
          ck=best.npz; test -f "$RUNNER_TEMP/ftwork/best.npz" || ck=checkpoint.npz
          "$py" peaceai/model/export.py --work "$RUNNER_TEMP/ftwork" --out "$RUNNER_TEMP/model" --threads 4 --checkpoint "$ck" > /dev/null
          cp "$RUNNER_TEMP/work/metrics.jsonl" "$RUNNER_TEMP/model/train-metrics.jsonl"; cp "$RUNNER_TEMP/ftwork/metrics.jsonl" "$RUNNER_TEMP/model/ft-metrics.jsonl"
          cp "$RUNNER_TEMP/ft/manifest.jsonl" "$RUNNER_TEMP/model/ft-manifest.jsonl"
          # M52 (Architect (a)): both manifest shas the model trained on, in config.json; promotion requires a core-free
          # proof per corpus for exactly these shas (corefree_proof.py --stage and the memcheck, both on the box).
          pre=$(cat "$RUNNER_TEMP/work/pretrain-manifest.sha256"); fts=$(sha256sum "$RUNNER_TEMP/ft/manifest.jsonl" | cut -c1-64)
          [[ "$pre" =~ ^[0-9a-f]{64}$ && "$fts" =~ ^[0-9a-f]{64}$ ]] || { echo "manifest sha missing: refused"; exit 1; }
          jq --arg p "$pre" --arg f "$fts" '.trainedOn = {pretrainManifestSha256: $p, finetuneManifestSha256: $f}' "$RUNNER_TEMP/model/config.json" > "$RUNNER_TEMP/cfg.json" && mv "$RUNNER_TEMP/cfg.json" "$RUNNER_TEMP/model/config.json"
          rm -rf "$RUNNER_TEMP/work" "$RUNNER_TEMP/ftwork" "$RUNNER_TEMP/ft"
          jq -r '"model \(.version) ctx=\(.ctx) params=\(.params)"' "$RUNNER_TEMP/model/config.json"
      - name: Verify the checkout and the landing scripts before the key is used
        id: landverify
        if: success() || failure()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$LANDING_SHA256" | sha256sum -c --quiet - || { echo "landing script hash mismatch: key refused"; exit 1; }
      - name: Land the model in Results only (no latest.json; refused until memcheck PASS; no promotion)
        if: (success() || failure()) && steps.landverify.outcome == 'success'
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
          MODEL_DIR: ${{ runner.temp }}/model
        run: |
          set -euo pipefail
          test -f "$MODEL_DIR/config.json" || { echo "no trained model (config.json missing): nothing to land"; exit 1; }
          ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh "M49 LM pretrain+finetune (run $GITHUB_RUN_ID)" \
            bash -c 'set -euo pipefail
              v=$(jq -r .version "$MODEL_DIR/config.json")
              [[ "$v" =~ ^[A-Za-z0-9._-]+$ && "$v" != "." && "$v" != ".." ]] || { echo "landing refused: bad version"; exit 1; }
              if [ -n "$(find "$MODEL_DIR" -type l)" ]; then echo "landing refused: symlink in model dir"; exit 1; fi
              d="$RESULTS_DIR/models/lm/$v"; test ! -e "$d"; mkdir -p "$d"; cp -P "$MODEL_DIR"/* "$d"/
              git -C "$RESULTS_DIR" add -A
              prefix="models/lm/$v/"
              while IFS= read -r name; do [ -z "$name" ] && continue
                if [ "${name:0:${#prefix}}" != "$prefix" ]; then echo "landing refused: path outside models/lm/$v/"; exit 1; fi
              done <<< "$(git -C "$RESULTS_DIR" diff --cached --name-only --no-renames)"'
      - name: Static evals after landing (NON-FATAL; parse and inference only, nothing executed; aggregate counts only)
        id: static
        run: |
          py="$RUNNER_TEMP/venv/bin/python"; M="$RUNNER_TEMP/model"; E="$RUNNER_TEMP/evals"; mkdir -p "$E"
          test -f "$M/config.json" || { echo "no model: evals skipped"; exit 0; }
          checkout_c() { local d; for d in "$RUNNER_TEMP"/csrc/*/; do git -C "$d" checkout -q FETCH_HEAD || return 1; done; }
          if ./node_modules/.bin/tsx peaceai/bin/ext-fetch.ts "$RUNNER_TEMP/csrc" "$RUNNER_TEMP/setc" --set-c && checkout_c \
            && "$py" peaceai/model/eval_c.py --model "$M" --corpus "$RUNNER_TEMP/setc" --max-bytes 4000000 --threads 4 > "$E/eval-setc-v2.txt"; then cat "$E/eval-setc-v2.txt"; else echo "set C v2 loss eval FAILED (non-fatal)"; echo FAILED > "$E/eval-setc-v2.txt"; fi
          if "$py" peaceai/model/gen_c.py --model "$M" --ext "$RUNNER_TEMP/csrc" --out "$RUNNER_TEMP/c-pred.jsonl" \
            && ./node_modules/.bin/tsx peaceai/bin/setc-grade.ts "$RUNNER_TEMP/c-pred.jsonl" "$RUNNER_TEMP/csrc" > "$E/eval-setc-tasks.txt"; then cat "$E/eval-setc-tasks.txt"; else echo "set C task eval FAILED (non-fatal)"; echo FAILED > "$E/eval-setc-tasks.txt"; fi
          rm -rf "$RUNNER_TEMP/csrc" "$RUNNER_TEMP/setc" "$RUNNER_TEMP/c-pred.jsonl"
          exit 0
      - name: Set A/B candidate bodies (NON-FATAL; inference and parsing only; tests run in the secret-free eval-ab job)
        id: abgen
        run: |
          py="$RUNNER_TEMP/venv/bin/python"; M="$RUNNER_TEMP/model"
          test -f "$M/config.json" || { echo "no model: A/B generation skipped"; exit 0; }
          ok=1; for r in PeaceAI-Workspace PeaceSTOCKS; do git clone --quiet "https://github.com/PeaceG03/$r.git" "$RUNNER_TEMP/ab/$r" || ok=0; done
          if [ $ok = 1 ] && "$py" peaceai/model/eval_ab.py --gen "$RUNNER_TEMP/ab-cands.jsonl" --model "$M" --clones "$RUNNER_TEMP/ab" --node "$(command -v node)" --tsc "$PWD/node_modules/typescript"; then
            b64=$(gzip -9c "$RUNNER_TEMP/ab-cands.jsonl" | base64 -w0)
            if [ "${#b64}" -le 900000 ]; then echo "ab_candidates=$b64" >> "$GITHUB_OUTPUT"; echo "A/B candidates: ${#b64} bytes"; else echo "A/B candidates too large (${#b64}); eval-ab will report FAILED"; fi
          else echo "set A/B generation FAILED (non-fatal)"; fi
          rm -rf "$RUNNER_TEMP/ab" "$RUNNER_TEMP/ab-cands.jsonl" "$RUNNER_TEMP/model"
          exit 0
      - name: Verify the checkout and the landing scripts before the key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$LANDING_SHA256" | sha256sum -c --quiet - || { echo "landing script hash mismatch: key refused"; exit 1; }
      - name: Record the static eval counts in Results (append-only)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
          EVALS: ${{ runner.temp }}/evals
        run: |
          set -euo pipefail
          test -d "$EVALS" || { echo "no eval counts to record"; exit 0; }
          ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh "M49 LM static eval counts (run $GITHUB_RUN_ID)" \
            bash -c 'set -euo pipefail
              d="$RESULTS_DIR/runs/lm-evals/$GITHUB_RUN_ID"; test ! -e "$d"; mkdir -p "$d"; cp "$EVALS"/*.txt "$d"/
              git -C "$RESULTS_DIR" add -A
              prefix="runs/lm-evals/$GITHUB_RUN_ID/"
              while IFS= read -r name; do [ -z "$name" ] && continue
                if [ "${name:0:${#prefix}}" != "$prefix" ]; then echo "landing refused: path outside $prefix"; exit 1; fi
              done <<< "$(git -C "$RESULTS_DIR" diff --cached --name-only --no-renames)"'

  eval-ab:
    name: set A/B task success (no environment, no secrets, no model)
    needs: finetune-land
    if: github.ref == 'refs/heads/main' && needs.finetune-land.outputs.ab_candidates != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run each set A/B commit's tests with the candidate bodies (NON-FATAL; aggregate counts only)
        env:
          CANDS: ${{ needs.finetune-land.outputs.ab_candidates }}
        run: |
          printf '%s' "$CANDS" | base64 -d | gunzip | head -c 50000000 > "$RUNNER_TEMP/ab-cands.jsonl" || { echo "set A/B candidates unreadable: FAILED (non-fatal)"; exit 0; }
          [ "$(stat -c %s "$RUNNER_TEMP/ab-cands.jsonl")" -lt 50000000 ] || { echo "set A/B candidates over the 50 MB decompression cap: refused (non-fatal)"; rm -f "$RUNNER_TEMP/ab-cands.jsonl"; exit 0; }
          ok=1; for r in PeaceAI-Workspace PeaceSTOCKS; do
            git clone --quiet "https://github.com/PeaceG03/$r.git" "$RUNNER_TEMP/ab/$r" && (cd "$RUNNER_TEMP/ab/$r" && npm ci --ignore-scripts --no-audit --no-fund --loglevel=error) || ok=0
          done
          if [ $ok = 1 ] && python3 peaceai/model/eval_ab.py --run "$RUNNER_TEMP/ab-cands.jsonl" --clones "$RUNNER_TEMP/ab" --node "$(command -v node)"; then :; else echo "set A/B task eval FAILED (non-fatal)"; fi
          exit 0

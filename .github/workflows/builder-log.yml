name: builder-log

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  builder-log:
    name: builder-log
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - run: ./node_modules/.bin/tsc -p builder-log/tsconfig.json --noEmit
      - run: ./node_modules/.bin/tsx --test builder-log/check.test.ts builder-log/coverage.test.ts builder-log/trace.test.ts builder-log/rule-skill.test.ts
      - name: Schema + append-only against the base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./node_modules/.bin/tsx builder-log/check.ts --base "$BASE_SHA"
      - name: Source corrections valid + add-only against the base revision (M119)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./node_modules/.bin/tsx peaceai/bin/source-corrections-check.ts --base "$BASE_SHA"
      - name: Clone PeaceSTOCKS anonymously (outside the workspace)
        run: git clone --quiet https://github.com/PeaceG03/PeaceSTOCKS.git "$RUNNER_TEMP/stocks"
      # GITHUB_TOKEN quota (#590 follow-up): every repo@sha is resolved in the anonymous PeaceSTOCKS clone and this
      # full-history checkout, with no API calls and no token. Only commits reachable from the repo's refs count.
      - name: PeaceAI repo@sha landings exist (local clones, no API calls)
        run: ./node_modules/.bin/tsx builder-log/check.ts --verify-shas --clone "PeaceG03/PeaceSTOCKS=$RUNNER_TEMP/stocks"
      # On a pull request only the appended rows are traced (trace.ts planTrace: full trace if the base log is not a
      # byte prefix or any trace code, dependency or this workflow changed). On push to main in this repository the
      # results-crosscheck job runs the full trace with Results (a superset of this public trace), so this step is
      # skipped there; anywhere else (a fork's main) it runs in full.
      - name: PeaceAI landings trace to verdict patches (public part; Results verified by the results-crosscheck job on main)
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'PeaceG03/PeaceAI-Workspace') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then mode=(--new-rows-since "$BASE_SHA"); else mode=(); fi
          ./node_modules/.bin/tsx builder-log/trace.ts --no-results "${mode[@]}" --clone "PeaceG03/PeaceSTOCKS=$RUNNER_TEMP/stocks" >> "$GITHUB_STEP_SUMMARY"
      - name: PeaceAI vs Builder coverage
        env:
          PEACESTOCKS_CLONE: ${{ runner.temp }}/stocks
        run: ./node_modules/.bin/tsx builder-log/coverage.ts >> "$GITHUB_STEP_SUMMARY"

  # PR #217 Results cross-check (Architect): push to main only, peaceai-core environment, read-only
  # PEACEAI_RESULTS_READ_KEY (deploy key, read-only), sparse tasks/ clone, nothing written anywhere.
  # Output is codes and fixed details only (trace.ts Results mode; rule-skill.ts errors).
  results-crosscheck:
    name: builder-log Results cross-check (trace + rule-skill)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'PeaceG03/PeaceAI-Workspace'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: peaceai-core
    permissions:
      contents: read
      issues: read
    env:
      LANDING_SHA256: |-
        bee71029e4a528f4ea7a9aae3c25d8591f4f35db398c9fb24cf11d645b4b355e  peaceai/bin/with-deploy-key.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # #575: the Workspace proof checker needs each landing's first parent and `merge-base --is-ancestor <sha> HEAD`.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Clone PeaceSTOCKS anonymously (outside the workspace)
        run: git clone --quiet https://github.com/PeaceG03/PeaceSTOCKS.git "$RUNNER_TEMP/stocks"
      - name: Verify the checkout and the key script before the key is used
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout is not $GITHUB_SHA"; exit 1; }
          git diff --exit-code --stat HEAD -- || { echo "checkout modified: key refused"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "untracked files in checkout: key refused"; exit 1; }
          printf '%s\n' "$LANDING_SHA256" | sha256sum -c --quiet - || { echo "key script hash mismatch: key refused"; exit 1; }
      - name: Clone Results read-only (sparse tasks/ only)
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_READ_KEY }}
        run: |
          set -euo pipefail
          [ -n "${DEPLOY_KEY:-}" ] || { echo "PEACEAI_RESULTS_READ_KEY is not set in the peaceai-core environment: refused (fail closed)"; exit 1; }
          ./peaceai/bin/with-deploy-key.sh git clone --quiet --depth 1 --filter=blob:none --sparse git@github.com:PeaceG03/PeaceAI-Results.git "$RUNNER_TEMP/results"
          ./peaceai/bin/with-deploy-key.sh git -C "$RUNNER_TEMP/results" sparse-checkout set tasks
      - name: PeaceAI landings trace to verdict patches (Results verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./node_modules/.bin/tsx builder-log/trace.ts --results-dir "$RUNNER_TEMP/results" --clone "PeaceG03/PeaceSTOCKS=$RUNNER_TEMP/stocks" >> "$GITHUB_STEP_SUMMARY"
      - name: Rule-skill cross-check against Results
        run: ./node_modules/.bin/tsx builder-log/rule-skill.ts --results-dir "$RUNNER_TEMP/results" --ci >> "$GITHUB_STEP_SUMMARY"
      # #575: the only place both inputs exist. Workspace landings count only here (Results-verified ws-proof); the
      # builder-log job above has no Results and keeps counting none (fail closed). Codes and counts only.
      - name: PeaceAI vs Builder coverage (Workspace landings verified against Results)
        env:
          PEACESTOCKS_CLONE: ${{ runner.temp }}/stocks
          WORKSPACE_CLONE: ${{ github.workspace }}
          PEACEAI_RESULTS_DIR: ${{ runner.temp }}/results
        run: ./node_modules/.bin/tsx builder-log/coverage.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Delete the Results clone
        if: always()
        run: rm -rf "$RUNNER_TEMP/results" "$RUNNER_TEMP"/peaceai-ssh.* "$RUNNER_TEMP/stocks"

name: builder-log

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  builder-log:
    name: builder-log
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - run: ./node_modules/.bin/tsc -p builder-log/tsconfig.json --noEmit
      - run: ./node_modules/.bin/tsx --test builder-log/check.test.ts
      - name: Schema + append-only against the base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./node_modules/.bin/tsx builder-log/check.ts --base "$BASE_SHA"

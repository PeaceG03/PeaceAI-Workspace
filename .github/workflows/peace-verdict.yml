name: peace-verdict

# Owner verdicts on a PeaceAI review: "/verdict <letter> right|wrong|unsure" or "/verdict none wrong|unsure".
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  parse:
    name: parse verdict
    if: >-
      github.repository == 'PeaceG03/PeaceAI-Workspace' &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'PeaceG03' &&
      github.event.sender.login == 'PeaceG03' &&
      contains(github.event.issue.labels.*.name, 'peace-task') &&
      startsWith(github.event.comment.body, '/verdict')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      ok: ${{ steps.parse.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Parse
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: ./node_modules/.bin/tsx peaceai/bin/parse-verdict.ts
      - name: Reject malformed command
        if: steps.parse.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Verdict not recorded. Usage: \`/verdict <letter> right|wrong|unsure\` or \`/verdict none wrong|unsure\`."

  record:
    name: record verdict in Results
    needs: parse
    if: needs.parse.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: peaceai-results
    permissions:
      contents: read
    outputs:
      status: ${{ steps.record.outputs.status }}
      label: ${{ steps.record.outputs.label }}
      verdict: ${{ steps.record.outputs.verdict }}
      candidate: ${{ steps.record.outputs.candidate }}
      withdrew: ${{ steps.record.outputs.withdrew }}
      test: ${{ steps.record.outputs.test }}
      base_sha: ${{ steps.record.outputs.base_sha }}
      chosen: ${{ steps.record.outputs.chosen_diff != '' }}
      target: ${{ steps.record.outputs.target }}
      external: ${{ steps.record.outputs.external }}
      write_env: ${{ steps.record.outputs.write_env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Append the verdict
        id: record
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          export CHOSEN_OUT_DIR="$RUNNER_TEMP/chosen"
          ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh "verdict #$ISSUE_NUMBER comment $COMMENT_ID" \
            ./node_modules/.bin/tsx peaceai/bin/record-verdict.ts
      - name: Hand the chosen candidate to the PR job
        if: steps.record.outputs.chosen_diff != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peaceai-chosen
          path: ${{ runner.temp }}/chosen/chosen.diff
          retention-days: 1
          if-no-files-found: error

  respond:
    name: reply, close stale PRs, open the chosen PR
    needs: [parse, record]
    if: always() && needs.parse.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One respond job per issue at a time, so two quick verdicts cannot both see "no open PR".
    concurrency:
      group: peace-verdict-respond-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      STATUS: ${{ needs.record.outputs.status }}
      LABEL: ${{ needs.record.outputs.label }}
      VERDICT: ${{ needs.record.outputs.verdict }}
      CANDIDATE: ${{ needs.record.outputs.candidate }}
      WITHDREW: ${{ needs.record.outputs.withdrew }}
      EXTERNAL: ${{ needs.record.outputs.external }}
    outputs:
      target_pr: ${{ steps.external.outputs.target_pr }}
    steps:
      - name: Not recorded
        if: needs.record.outputs.status != 'recorded'
        run: |
          case "$STATUS" in
            unknown-label) msg="Verdict not recorded: that letter is not a candidate in the latest review." ;;
            no-task) msg="Verdict not recorded: no PeaceAI review exists for this issue yet." ;;
            *) msg="Verdict not recorded: recording failed." ;;
          esac
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$msg"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.record.outputs.status == 'recorded'
        with:
          persist-credentials: false
          path: tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.record.outputs.status == 'recorded'
        with:
          node-version: 22
      - name: Install tooling
        if: needs.record.outputs.status == 'recorded'
        working-directory: tools
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Plan PRs (same candidate keeps its PR; a different counted candidate replaces it)
        id: guard
        if: needs.record.outputs.status == 'recorded' && needs.record.outputs.external != 'true'
        run: |
          PR_LIST_JSON="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,headRefName,labels)"
          export PR_LIST_JSON
          tools/node_modules/.bin/tsx tools/peaceai/bin/pr-guard.ts
      - name: Close stale PeaceAI PRs for this issue
        if: steps.guard.outputs.close != ''
        env:
          CLOSE: ${{ steps.guard.outputs.close }}
        run: |
          for pr in $CLOSE; do
            case "$pr" in *[!0-9]*) echo "bad PR number"; exit 1 ;; esac
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "Superseded: a later verdict on #${ISSUE_NUMBER} no longer counts this candidate."
          done
      - name: Mark PRs whose verdict was withdrawn
        if: steps.guard.outputs.mark != ''
        env:
          MARK: ${{ steps.guard.outputs.mark }}
        run: |
          gh label create verdict-withdrawn --repo "$GITHUB_REPOSITORY" --color d93f0b --force \
            --description "No verdict backs this PeaceAI PR anymore; do not merge" >/dev/null
          for pr in $MARK; do
            case "$pr" in *[!0-9]*) echo "bad PR number"; exit 1 ;; esac
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --add-label verdict-withdrawn >/dev/null
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" \
              --body "No verdict backs this PR anymore (withdrawn on #${ISSUE_NUMBER}). Do not merge it."
          done
      - name: Unmark PRs a verdict backs again
        if: steps.guard.outputs.unmark != ''
        env:
          UNMARK: ${{ steps.guard.outputs.unmark }}
        run: |
          for pr in $UNMARK; do
            case "$pr" in *[!0-9]*) echo "bad PR number"; exit 1 ;; esac
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --remove-label verdict-withdrawn >/dev/null
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "A verdict on #${ISSUE_NUMBER} backs this PR again."
          done
      - name: Reply
        if: needs.record.outputs.status == 'recorded' && needs.record.outputs.external != 'true'
        env:
          REPLY: ${{ steps.guard.outputs.reply }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$REPLY"
      # M5: the task's diffs apply to another target repository. PRs there need that target's write
      # environment (main-only, holding TARGET_PR_TOKEN). Fail closed: no environment, no PR work at all.
      - name: Hand off to the target's write environment (or say why not)
        id: external
        if: needs.record.outputs.status == 'recorded' && needs.record.outputs.external == 'true'
        env:
          TARGET: ${{ needs.record.outputs.target }}
          WRITE_ENV: ${{ needs.record.outputs.write_env }}
        run: |
          if [ -n "$WRITE_ENV" ] && gh api "repos/$GITHUB_REPOSITORY/environments/$WRITE_ENV" >/dev/null 2>&1; then
            echo "target_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "target_pr=false" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "Verdict recorded: $LABEL $VERDICT. No PR action on \`$TARGET\`: its write environment is not set up, so PeaceAI has no write access there."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.open_pr == 'true'
        with:
          ref: ${{ needs.record.outputs.base_sha }}
          path: work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.guard.outputs.open_pr == 'true'
        with:
          name: peaceai-chosen
          path: ${{ runner.temp }}/chosen
      - name: Open a PR for the chosen candidate
        if: steps.guard.outputs.open_pr == 'true'
        working-directory: work
        run: |
          set -euo pipefail
          case "$CANDIDATE" in candidate-[0-9]*) ;; *) echo "bad candidate id"; exit 1 ;; esac
          branch="peace-task/issue-${ISSUE_NUMBER}-${CANDIDATE}-$(openssl rand -hex 4)"
          git checkout -q -b "$branch"
          git apply --whitespace=nowarn "$RUNNER_TEMP/chosen/chosen.diff"
          git add -A -- src
          git -c user.name=PeaceG03 -c user.email=301894882+PeaceG03@users.noreply.github.com \
            commit -q -m "PeaceAI candidate chosen in review of #${ISSUE_NUMBER}"
          git push -q origin "HEAD:refs/heads/$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "PeaceAI task #${ISSUE_NUMBER} (owner-chosen candidate)" \
            --body "Candidate chosen by owner review on #${ISSUE_NUMBER}."
          # PRs opened with the Actions token do not trigger pull_request workflows; run the checks here.
          gh workflow run leak-check.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  target-pr:
    name: PRs on the target repository
    needs: [parse, record, respond]
    if: always() && needs.respond.outputs.target_pr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Main-only environment holding TARGET_PR_TOKEN for this one target (see docs in README "Targets").
    environment: ${{ needs.record.outputs.write_env }}
    concurrency:
      group: peace-verdict-respond-${{ github.event.issue.number }}-target
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET: ${{ needs.record.outputs.target }}
      LABEL: ${{ needs.record.outputs.label }}
      VERDICT: ${{ needs.record.outputs.verdict }}
      CANDIDATE: ${{ needs.record.outputs.candidate }}
      WITHDREW: ${{ needs.record.outputs.withdrew }}
      HAS_TOKEN: ${{ secrets.TARGET_PR_TOKEN != '' }}
    steps:
      - name: Fail closed without a write token
        if: env.HAS_TOKEN != 'true'
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Verdict recorded: $LABEL $VERDICT. No PR action on \`$TARGET\`: its write environment has no TARGET_PR_TOKEN."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          persist-credentials: false
          path: tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
      - name: Install tooling
        if: env.HAS_TOKEN == 'true'
        working-directory: tools
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Re-check the target is public
        if: env.HAS_TOKEN == 'true'
        run: tools/node_modules/.bin/tsx tools/peaceai/bin/target-check.ts
      - name: Plan PRs on the target
        id: guard
        if: env.HAS_TOKEN == 'true'
        env:
          PR_REF_REPO: ${{ needs.record.outputs.target }}
        run: |
          PR_LIST_JSON="$(gh pr list --repo "$TARGET" --state open --limit 200 --json number,headRefName,labels)"
          export PR_LIST_JSON
          tools/node_modules/.bin/tsx tools/peaceai/bin/pr-guard.ts
      - name: Close stale, mark or unmark PeaceAI PRs on the target
        if: env.HAS_TOKEN == 'true' && (steps.guard.outputs.close != '' || steps.guard.outputs.mark != '' || steps.guard.outputs.unmark != '')
        env:
          GH_TOKEN: ${{ secrets.TARGET_PR_TOKEN }}
          CLOSE: ${{ steps.guard.outputs.close }}
          MARK: ${{ steps.guard.outputs.mark }}
          UNMARK: ${{ steps.guard.outputs.unmark }}
        run: |
          for pr in $CLOSE $MARK $UNMARK; do case "$pr" in *[!0-9]*) echo "bad PR number"; exit 1 ;; esac; done
          for pr in $CLOSE; do
            gh pr close "$pr" --repo "$TARGET" --delete-branch --comment "Superseded: a later PeaceAI verdict no longer counts this candidate."
          done
          if [ -n "$MARK" ]; then
            gh label create verdict-withdrawn --repo "$TARGET" --color d93f0b --force \
              --description "No verdict backs this PeaceAI PR anymore; do not merge" >/dev/null
          fi
          for pr in $MARK; do
            gh pr edit "$pr" --repo "$TARGET" --add-label verdict-withdrawn >/dev/null
            gh pr comment "$pr" --repo "$TARGET" --body "No verdict backs this PR anymore. Do not merge it."
          done
          for pr in $UNMARK; do
            gh pr edit "$pr" --repo "$TARGET" --remove-label verdict-withdrawn >/dev/null
            gh pr comment "$pr" --repo "$TARGET" --body "A PeaceAI verdict backs this PR again."
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_TOKEN == 'true' && steps.guard.outputs.open_pr == 'true'
        with:
          name: peaceai-chosen
          path: ${{ runner.temp }}/chosen
      - name: Open a PR on the target for the chosen candidate
        if: env.HAS_TOKEN == 'true' && steps.guard.outputs.open_pr == 'true'
        env:
          TARGET_PR_TOKEN: ${{ secrets.TARGET_PR_TOKEN }}
          BASE_SHA: ${{ needs.record.outputs.base_sha }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in candidate-[0-9]*) ;; *) echo "bad candidate id"; exit 1 ;; esac
          tools/peaceai/bin/clone-target.sh "$TARGET" "$RUNNER_TEMP/target" "$BASE_SHA"
          cd "$RUNNER_TEMP/target"
          base_branch="$(GH_TOKEN="$TARGET_PR_TOKEN" gh repo view "$TARGET" --json defaultBranchRef -q .defaultBranchRef.name)"
          branch="peace-task/issue-${ISSUE_NUMBER}-${CANDIDATE}-$(openssl rand -hex 4)"
          git checkout -q -b "$branch"
          git apply --whitespace=nowarn "$RUNNER_TEMP/chosen/chosen.diff"
          git add -A -- src
          git -c user.name=PeaceG03 -c user.email=301894882+PeaceG03@users.noreply.github.com \
            commit -q -m "PeaceAI candidate chosen in review of PeaceG03/PeaceAI-Workspace#${ISSUE_NUMBER}"
          auth="$(printf 'x-access-token:%s' "$TARGET_PR_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.extraHeader=Authorization: basic $auth" push -q "https://github.com/$TARGET.git" "HEAD:refs/heads/$branch"
          url="$(GH_TOKEN="$TARGET_PR_TOKEN" gh pr create --repo "$TARGET" --base "$base_branch" --head "$branch" \
            --title "PeaceAI task PeaceG03/PeaceAI-Workspace#${ISSUE_NUMBER} (owner-chosen candidate)" \
            --body "Candidate chosen by owner review on PeaceG03/PeaceAI-Workspace#${ISSUE_NUMBER}.")"
          echo "pr_url=$url" >> "$GITHUB_ENV"
      - name: Reply
        if: env.HAS_TOKEN == 'true'
        env:
          REPLY: ${{ steps.guard.outputs.reply }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$REPLY${pr_url:+ $pr_url}"

  train:
    name: retrain the shadow ranker
    needs: [record]
    # Verdicts on [test] issues never reach training, so they do not retrain.
    if: needs.record.outputs.status == 'recorded' && needs.record.outputs.test != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch peace-train
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run peace-train.yml --repo "$GITHUB_REPOSITORY" --ref main

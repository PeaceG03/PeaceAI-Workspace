name: peace-verdict

# Owner verdicts on a PeaceAI review: "/verdict <letter> right|wrong|unsure" or "/verdict none wrong|unsure".
# Delegated (Peace, Oct 29 2026 scanner-helper; Oct 30 2026 scanner-wiring): Auditor's "/auditor-pass <letter> <candidate diff sha256>"
# on a `scanner-helper` or `scanner-wiring` peace-task is recorded as a `right` with source auditor-pass (lib/auditor-pass.ts). It is never
# an owner verdict (0 credit, no owner tallies). Every agent comments as PeaceG03, so this workflow cannot tell
# Auditor from Builder: the gate relies on the agents' rules (Auditor alone posts /auditor-pass, Builder never does).
on:
  issue_comment:
    types: [created]
  # Carry-forward (lib/carry.ts): dispatched ONLY by peace-task's carry job (github-actions[bot]) with the id of its
  # carry comment; the parse job re-validates it against the owner's original /verdict comment before anything runs.
  workflow_dispatch:
    inputs:
      carry_comment_id:
        description: "Carry comment id (peace-task carry job only)"
        required: true

permissions: {}

jobs:
  parse:
    name: parse verdict
    if: >-
      github.repository == 'PeaceG03/PeaceAI-Workspace' && (
      (github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && github.triggering_actor == 'github-actions[bot]') || (
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'PeaceG03' &&
      github.event.sender.login == 'PeaceG03' && (
      (contains(github.event.issue.labels.*.name, 'peace-task') &&
      startsWith(github.event.comment.body, '/verdict')
      ) ||
      startsWith(github.event.comment.body, '/auditor-pass')
      )
      ))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      ok: ${{ steps.parse.outputs.ok == 'true' || steps.appass.outputs.ok == 'true' }}
      # verdict = the owner's /verdict (or its carry); auditor-pass = the delegated scanner-helper / scanner-wiring pass.
      kind: ${{ steps.src.outputs.kind }}
      ap_scope: ${{ steps.appass.outputs.scope }}
      issue: ${{ steps.src.outputs.issue }}
      body: ${{ steps.src.outputs.body }}
      comment_id: ${{ steps.src.outputs.comment_id }}
      created_at: ${{ steps.src.outputs.created_at }}
      expect_run: ${{ steps.src.outputs.expect_run }}
      source: ${{ steps.src.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Verdict source (the owner's comment, or a re-validated carry)
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CARRY_COMMENT_ID: ${{ inputs.carry_comment_id }}
          C_BODY: ${{ github.event.comment.body }}
          C_ID: ${{ github.event.comment.id }}
          C_AT: ${{ github.event.comment.created_at }}
          C_ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ./node_modules/.bin/tsx peaceai/bin/carry-verdict.ts
            { echo "source=carry"; echo "kind=verdict"; } >> "$GITHUB_OUTPUT"
          else
            kind=verdict
            case "$C_BODY" in /auditor-pass*) kind=auditor-pass ;; esac
            { echo "ok=true"; echo "kind=$kind"; echo "issue=$C_ISSUE"; echo "comment_id=$C_ID"; echo "created_at=$C_AT"; echo "expect_run="; echo "source=comment"
              echo "body<<EOF_VERDICT_BODY"; printf '%s\n' "$C_BODY"; echo "EOF_VERDICT_BODY"; } >> "$GITHUB_OUTPUT"
          fi
      - name: Parse
        id: parse
        if: steps.src.outputs.ok == 'true' && steps.src.outputs.kind == 'verdict'
        env:
          COMMENT_BODY: ${{ steps.src.outputs.body }}
        run: ./node_modules/.bin/tsx peaceai/bin/parse-verdict.ts
      - name: Reject malformed command
        if: steps.src.outputs.source == 'comment' && steps.src.outputs.kind == 'verdict' && steps.parse.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Verdict not recorded. Usage: \`/verdict <letter> right|wrong|unsure\` or \`/verdict none wrong|unsure\`."
      # Auditor pass: parse it and check the issue is a `scanner-helper` or `scanner-wiring` peace-task (labels from the event payload).
      # The record job re-checks the task's recorded source (builder), target and candidate diff against Results.
      - name: Parse auditor pass and check its scope
        id: appass
        if: steps.src.outputs.ok == 'true' && steps.src.outputs.source == 'comment' && steps.src.outputs.kind == 'auditor-pass'
        env:
          COMMENT_BODY: ${{ steps.src.outputs.body }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: ./node_modules/.bin/tsx peaceai/bin/parse-auditor-pass.ts
      - name: Refuse auditor pass (malformed or out of scope)
        if: steps.appass.outcome == 'success' && steps.appass.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REFUSAL: ${{ steps.appass.outputs.refusal }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "${REFUSAL:-Auditor pass not recorded.}"

  record:
    name: record verdict in Results
    needs: parse
    if: needs.parse.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One global queue for every Results write from this workflow: concurrent /verdict comments on
    # different issues raced on the Results clone/push ("results clone failed", Oct 16). queue: max keeps
    # up to 100 pending runs in order instead of cancelling the older pending one (queue: single default).
    concurrency:
      group: peace-verdict-record-results
      cancel-in-progress: false
      queue: max
    environment: peaceai-results
    permissions:
      contents: read
    outputs:
      status: ${{ steps.record.outputs.status }}
      refusal: ${{ steps.record.outputs.refusal }}
      source: ${{ steps.record.outputs.source }}
      delegated_by: ${{ steps.record.outputs.delegated_by }}
      label: ${{ steps.record.outputs.label }}
      verdict: ${{ steps.record.outputs.verdict }}
      candidate: ${{ steps.record.outputs.candidate }}
      withdrew: ${{ steps.record.outputs.withdrew }}
      test: ${{ steps.record.outputs.test }}
      base_sha: ${{ steps.record.outputs.base_sha }}
      chosen: ${{ steps.record.outputs.chosen_diff != '' }}
      target: ${{ steps.record.outputs.target }}
      external: ${{ steps.record.outputs.external }}
      write_env: ${{ steps.record.outputs.write_env }}
      route: ${{ steps.record.outputs.route }}
      run_id: ${{ steps.record.outputs.run_id }}
      diff_sha256: ${{ steps.record.outputs.diff_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Append the verdict
        id: record
        env:
          DEPLOY_KEY: ${{ secrets.PEACEAI_RESULTS_DEPLOY_KEY }}
          COMMENT_BODY: ${{ needs.parse.outputs.body }}
          COMMENT_ID: ${{ needs.parse.outputs.comment_id }}
          COMMENT_CREATED_AT: ${{ needs.parse.outputs.created_at }}
          ISSUE_NUMBER: ${{ needs.parse.outputs.issue }}
          EXPECT_RUN_ID: ${{ needs.parse.outputs.expect_run }}
          VERDICT_KIND: ${{ needs.parse.outputs.kind }}
          AUDITOR_PASS_SCOPE: ${{ needs.parse.outputs.ap_scope }}
        run: |
          export CHOSEN_OUT_DIR="$RUNNER_TEMP/chosen"
          what=verdict
          if [ "$VERDICT_KIND" = "auditor-pass" ]; then what=auditor-pass; fi
          ./peaceai/bin/with-deploy-key.sh ./peaceai/bin/results-write.sh "$what #$ISSUE_NUMBER comment $COMMENT_ID" \
            ./node_modules/.bin/tsx peaceai/bin/record-verdict.ts
      - name: Hand the chosen candidate to the PR job
        if: steps.record.outputs.chosen_diff != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peaceai-chosen
          # M18: chosen.json = what a stale-base regrade request needs (run, candidate, base, kind flags).
          path: |
            ${{ runner.temp }}/chosen/chosen.diff
            ${{ runner.temp }}/chosen/chosen.json
          retention-days: 1
          if-no-files-found: error

  respond:
    name: reply, close stale PRs, open the chosen PR
    needs: [parse, record]
    if: always() && needs.parse.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One respond job per issue at a time, so two quick verdicts cannot both see "no open PR".
    concurrency:
      group: peace-verdict-respond-${{ needs.parse.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ needs.parse.outputs.issue }}
      STATUS: ${{ needs.record.outputs.status }}
      LABEL: ${{ needs.record.outputs.label }}
      VERDICT: ${{ needs.record.outputs.verdict }}
      CANDIDATE: ${{ needs.record.outputs.candidate }}
      WITHDREW: ${{ needs.record.outputs.withdrew }}
      EXTERNAL: ${{ needs.record.outputs.external }}
      VERDICT_FROM: ${{ needs.record.outputs.source }}
      DELEGATED_BY: ${{ needs.record.outputs.delegated_by }}
    outputs:
      target_pr: ${{ steps.external.outputs.target_pr }}
      target_patch: ${{ steps.external.outputs.target_patch }}
    steps:
      - name: Not recorded
        if: needs.record.outputs.status != 'recorded'
        env:
          REFUSAL: ${{ needs.record.outputs.refusal }}
        run: |
          case "$STATUS" in
            unknown-label) msg="Verdict not recorded: that letter is not a candidate in the latest review." ;;
            no-task) msg="Verdict not recorded: no PeaceAI review exists for this issue yet." ;;
            auditor-pass-refused) msg="${REFUSAL:-Auditor pass not recorded.}" ;;
            *) msg="Verdict not recorded: recording failed." ;;
          esac
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$msg"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.record.outputs.status == 'recorded'
        with:
          persist-credentials: false
          path: tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.record.outputs.status == 'recorded'
        with:
          node-version: 22
      - name: Install tooling
        if: needs.record.outputs.status == 'recorded'
        working-directory: tools
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Plan PRs (same candidate keeps its PR; a different counted candidate replaces it)
        id: guard
        if: needs.record.outputs.status == 'recorded' && needs.record.outputs.external != 'true'
        run: |
          PR_LIST_JSON="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,headRefName,labels)"
          export PR_LIST_JSON
          tools/node_modules/.bin/tsx tools/peaceai/bin/pr-guard.ts
      - name: Close stale PeaceAI PRs for this issue
        if: steps.guard.outputs.close != ''
        env:
          CLOSE: ${{ steps.guard.outputs.close }}
        run: |
          for pr in $CLOSE; do
            case "$pr" in *[!0-9]*) echo "bad PR number"; exit 1 ;; esac
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "Superseded: a later verdict on #${ISSUE_NUMBER} no longer counts this candidate."
          done
      - name: Mark PRs whose verdict was withdrawn
        if: steps.guard.outputs.mark != ''
        env:
          MARK: ${{ steps.guard.outputs.mark }}
        run: |
          gh label create verdict-withdrawn --repo "$GITHUB_REPOSITORY" --color d93f0b --force \
            --description "No verdict backs this PeaceAI PR anymore; do not merge" >/dev/null
          for pr in $MARK; do
            case "$pr" in *[!0-9]*) echo "bad PR number"; exit 1 ;; esac
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --add-label verdict-withdrawn >/dev/null
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" \
              --body "No verdict backs this PR anymore (withdrawn on #${ISSUE_NUMBER}). Do not merge it."
          done
      - name: Unmark PRs a verdict backs again
        if: steps.guard.outputs.unmark != ''
        env:
          UNMARK: ${{ steps.guard.outputs.unmark }}
        run: |
          for pr in $UNMARK; do
            case "$pr" in *[!0-9]*) echo "bad PR number"; exit 1 ;; esac
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --remove-label verdict-withdrawn >/dev/null
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "A verdict on #${ISSUE_NUMBER} backs this PR again."
          done
      - name: Reply
        if: needs.record.outputs.status == 'recorded' && needs.record.outputs.external != 'true'
        env:
          REPLY: ${{ steps.guard.outputs.reply }}
        run: |
          if [ "$VERDICT_FROM" = "auditor-pass" ]; then
            case "$DELEGATED_BY" in "owner (scanner-helper class)"|"owner (scanner-wiring class)") ;; *) echo "bad delegation"; exit 1 ;; esac
            REPLY="$(printf 'Auditor pass (delegated by the %s; not an owner verdict, 0 credit).\n%s' "$DELEGATED_BY" "$REPLY")"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$REPLY"
      # M5: the task's diffs apply to another target repository. PRs there need that target's write
      # environment (main-only, holding TARGET_PR_TOKEN). Fail closed: no environment, no PR work at all.
      # M6: a "patch" route target never gets a PR: a `right` verdict posts a format-patch comment instead.
      - name: Hand off to the target's write environment or patch route (or say why not)
        id: external
        if: needs.record.outputs.status == 'recorded' && needs.record.outputs.external == 'true'
        env:
          TARGET: ${{ needs.record.outputs.target }}
          WRITE_ENV: ${{ needs.record.outputs.write_env }}
          ROUTE: ${{ needs.record.outputs.route }}
          CHOSEN: ${{ needs.record.outputs.chosen }}
        run: |
          # A pr target with its main-only write environment opens a bot PR and never merges.
          # Peace approving that environment is the push OK. The PR into the default branch is still theirs.
          # A pr or patch target with no such environment posts the checked patch file, so a missing token never drops a verdict.
          env_ok=false
          if [ "$ROUTE" != "patch" ] && [ -n "$WRITE_ENV" ] && gh api "repos/$GITHUB_REPOSITORY/environments/$WRITE_ENV" >/dev/null 2>&1; then
            env_ok=true
          fi
          if [ "$env_ok" = "true" ]; then
            echo "target_pr=true" >> "$GITHUB_OUTPUT"
            echo "target_patch=false" >> "$GITHUB_OUTPUT"
          elif [ "$ROUTE" = "patch" ] || [ "$ROUTE" = "pr" ]; then
            echo "target_pr=false" >> "$GITHUB_OUTPUT"
            if [ "$CHOSEN" = "true" ]; then
              echo "target_patch=true" >> "$GITHUB_OUTPUT"
            else
              msg="Verdict recorded: $LABEL $VERDICT. No patch is posted for this verdict."
              if [ "$WITHDREW" = "true" ]; then
                msg="$msg The earlier patch on this issue is no longer the effective pick, so the apply script will refuse it."
              fi
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$msg"
            fi
          else
            echo "target_pr=false" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "Verdict recorded: $LABEL $VERDICT. No PR action on \`$TARGET\`: its write environment is not set up, so PeaceAI has no write access there."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.open_pr == 'true'
        with:
          ref: ${{ needs.record.outputs.base_sha }}
          path: work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.guard.outputs.open_pr == 'true'
        with:
          name: peaceai-chosen
          path: ${{ runner.temp }}/chosen
      # Same hash and stale-base rules as the target-pr job: never open a Workspace PR built on an old base.
      - name: Check the chosen diff hash (Workspace PR)
        id: wshash
        if: steps.guard.outputs.open_pr == 'true'
        env:
          DIFF_SHA: ${{ needs.record.outputs.diff_sha256 }}
        run: |
          set -euo pipefail
          got="$(sha256sum "$RUNNER_TEMP/chosen/chosen.diff" | awk '{print $1}')"
          if ! [[ "$DIFF_SHA" =~ ^[0-9a-f]{64}$ ]] || [ "$got" != "$DIFF_SHA" ]; then
            echo "refused: chosen diff hash does not match the Results record"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Stale-base check (Workspace PR)
        id: wsstale
        if: steps.guard.outputs.open_pr == 'true' && steps.wshash.outputs.ok == 'true'
        env:
          TARGET: ${{ github.repository }}
          BASE_SHA: ${{ needs.record.outputs.base_sha }}
          CHOSEN_DIR: ${{ runner.temp }}/chosen
          BODY_FILE: ${{ runner.temp }}/regrade-comment.md
          VERDICT_COMMENT_ID: ${{ needs.parse.outputs.comment_id }}
          VERDICT_SOURCE: ${{ needs.parse.outputs.source }}
        run: tools/node_modules/.bin/tsx tools/peaceai/bin/verdict-stale.ts
      - name: Post the Workspace regrade request
        if: steps.wsstale.outputs.stale == 'true' && steps.wsstale.outputs.ok == 'true'
        env:
          BODY_FILE: ${{ runner.temp }}/regrade-comment.md
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
      - name: Re-queue the Workspace regrade (pending carry)
        if: steps.wsstale.outputs.stale == 'true' && steps.wsstale.outputs.ok == 'true' && needs.parse.outputs.source == 'comment'
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label peaceai:done >/dev/null
          gh workflow run peace-task.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Workspace stale base without a regrade request (fail closed)
        if: steps.wsstale.outputs.stale == 'error' || (steps.wsstale.outputs.stale == 'true' && steps.wsstale.outputs.ok != 'true')
        env:
          REASON: ${{ steps.wsstale.outputs.reason }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Verdict recorded: $LABEL right. No PR opened: stale base, ${REASON:-regrade-request-failed}."
          exit 1
      - name: Open a PR for the chosen candidate
        if: steps.guard.outputs.open_pr == 'true' && steps.wshash.outputs.ok == 'true' && steps.wsstale.outputs.stale == 'false'
        working-directory: work
        env:
          # Self-edit (#575): the PR body carries the ws-proof clause a builder-log row needs, from trusted outputs only.
          RUN_ID: ${{ needs.record.outputs.run_id }}
          DIFF_SHA: ${{ needs.record.outputs.diff_sha256 }}
          COMMENT_ID: ${{ needs.parse.outputs.comment_id }}
        run: |
          set -euo pipefail
          # An auditor-pass is scoped to PeaceSTOCKS scanner helpers (record-verdict.ts refuses any other target before
          # writing); this second check means it never opens a Workspace PR or a ws-proof row even so.
          if [ "${VERDICT_FROM:-}" = "auditor-pass" ]; then echo "refused: only an owner verdict opens a Workspace PR"; exit 1; fi
          case "$CANDIDATE" in candidate-[0-9]*) ;; *) echo "bad candidate id"; exit 1 ;; esac
          case "$RUN_ID" in *[!0-9]*|"") echo "bad run id"; exit 1 ;; esac
          case "$COMMENT_ID" in *[!0-9]*|"") echo "bad comment id"; exit 1 ;; esac
          # Same rule as the target PR job: the PR carries exactly the candidate bytes Results recorded, or no PR.
          got="$(sha256sum "$RUNNER_TEMP/chosen/chosen.diff" | awk '{print $1}')"
          if ! [[ "$DIFF_SHA" =~ ^[0-9a-f]{64}$ ]] || [ "$got" != "$DIFF_SHA" ]; then
            echo "refused: chosen diff hash does not match the Results record"; exit 1
          fi
          branch="peace-task/issue-${ISSUE_NUMBER}-${CANDIDATE}-$(openssl rand -hex 4)"
          git checkout -q -b "$branch"
          # Auditor (#107, change 5): .github/workflows/** never goes through PeaceAI's push path.
          if grep -qE '^(diff --git a/.* b/|\+\+\+ b/|--- a/|rename (from|to) |copy (from|to) )\.github/workflows/' "$RUNNER_TEMP/chosen/chosen.diff"; then
            echo "refused: .github/workflows/** goes in only through a normal PR that Architect merges"; exit 1
          fi
          git apply --whitespace=nowarn "$RUNNER_TEMP/chosen/chosen.diff"
          "$GITHUB_WORKSPACE/tools/peaceai/bin/stage-chosen.sh" "$RUNNER_TEMP/chosen/chosen.diff"
          git -c user.name=PeaceG03 -c user.email=301894882+PeaceG03@users.noreply.github.com \
            commit -q -m "PeaceAI candidate chosen in review of #${ISSUE_NUMBER}"
          git push -q origin "HEAD:refs/heads/$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "PeaceAI task #${ISSUE_NUMBER} (owner-chosen candidate)" \
            --body "$(printf 'Candidate chosen by owner review on #%s.\n\nws-proof: run %s %s diff-sha256 %s verdict %s\n' "$ISSUE_NUMBER" "$RUN_ID" "$CANDIDATE" "$DIFF_SHA" "$COMMENT_ID")"
          # PRs opened with the Actions token do not trigger pull_request workflows; run the checks here.
          gh workflow run leak-check.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  target-pr:
    name: PRs on the target repository
    needs: [parse, record, respond]
    if: always() && needs.respond.outputs.target_pr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Main-only environment holding TARGET_PR_TOKEN for this one target (see docs in README "Targets").
    environment: ${{ needs.record.outputs.write_env }}
    concurrency:
      group: peace-verdict-respond-${{ needs.parse.outputs.issue }}-target
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: write # stale base: re-queue the regrade sweep (same as the patch job; the target token is not used here)
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ needs.parse.outputs.issue }}
      TARGET: ${{ needs.record.outputs.target }}
      LABEL: ${{ needs.record.outputs.label }}
      VERDICT: ${{ needs.record.outputs.verdict }}
      CANDIDATE: ${{ needs.record.outputs.candidate }}
      WITHDREW: ${{ needs.record.outputs.withdrew }}
      HAS_TOKEN: ${{ secrets.TARGET_PR_TOKEN != '' }}
      DIFF_SHA: ${{ needs.record.outputs.diff_sha256 }}
      BASE_SHA: ${{ needs.record.outputs.base_sha }}
      VERDICT_FROM: ${{ needs.record.outputs.source }}
      DELEGATED_BY: ${{ needs.record.outputs.delegated_by }}
      COMMENT_ID: ${{ needs.parse.outputs.comment_id }}
    steps:
      - name: Fail closed without a write token
        if: env.HAS_TOKEN != 'true'
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Verdict recorded: $LABEL $VERDICT. No PR action on \`$TARGET\`: its write environment has no TARGET_PR_TOKEN."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          persist-credentials: false
          path: tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
      - name: Install tooling
        if: env.HAS_TOKEN == 'true'
        working-directory: tools
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Re-check the target is public
        if: env.HAS_TOKEN == 'true'
        run: tools/node_modules/.bin/tsx tools/peaceai/bin/target-check.ts
      - name: Plan PRs on the target
        id: guard
        if: env.HAS_TOKEN == 'true'
        env:
          PR_REF_REPO: ${{ needs.record.outputs.target }}
        run: |
          PR_LIST_JSON="$(gh pr list --repo "$TARGET" --state open --limit 200 --json number,headRefName,labels)"
          export PR_LIST_JSON
          tools/node_modules/.bin/tsx tools/peaceai/bin/pr-guard.ts
      - name: Close stale, mark or unmark PeaceAI PRs on the target
        if: env.HAS_TOKEN == 'true' && (steps.guard.outputs.close != '' || steps.guard.outputs.mark != '' || steps.guard.outputs.unmark != '')
        env:
          GH_TOKEN: ${{ secrets.TARGET_PR_TOKEN }}
          CLOSE: ${{ steps.guard.outputs.close }}
          MARK: ${{ steps.guard.outputs.mark }}
          UNMARK: ${{ steps.guard.outputs.unmark }}
        run: |
          for pr in $CLOSE $MARK $UNMARK; do case "$pr" in *[!0-9]*) echo "bad PR number"; exit 1 ;; esac; done
          for pr in $CLOSE; do
            gh pr close "$pr" --repo "$TARGET" --delete-branch --comment "Superseded: a later PeaceAI verdict no longer counts this candidate."
          done
          if [ -n "$MARK" ]; then
            gh label create verdict-withdrawn --repo "$TARGET" --color d93f0b --force \
              --description "No verdict backs this PeaceAI PR anymore; do not merge" >/dev/null
          fi
          for pr in $MARK; do
            gh pr edit "$pr" --repo "$TARGET" --add-label verdict-withdrawn >/dev/null
            gh pr comment "$pr" --repo "$TARGET" --body "No verdict backs this PR anymore. Do not merge it."
          done
          for pr in $UNMARK; do
            gh pr edit "$pr" --repo "$TARGET" --remove-label verdict-withdrawn >/dev/null
            gh pr comment "$pr" --repo "$TARGET" --body "A PeaceAI verdict backs this PR again."
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_TOKEN == 'true' && steps.guard.outputs.open_pr == 'true'
        with:
          name: peaceai-chosen
          path: ${{ runner.temp }}/chosen
      - name: Check the chosen diff hash
        id: hash
        if: env.HAS_TOKEN == 'true' && steps.guard.outputs.open_pr == 'true'
        run: |
          set -euo pipefail
          got="$(sha256sum "$RUNNER_TEMP/chosen/chosen.diff" | awk '{print $1}')"
          if [ -z "$DIFF_SHA" ] || [ "$got" != "$DIFF_SHA" ]; then
            echo "refused: chosen diff hash does not match the Results record"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      # Same stale-base rule as the patch route: never open a PR built on an old base.
      - name: Stale-base check
        id: stale
        if: env.HAS_TOKEN == 'true' && steps.guard.outputs.open_pr == 'true' && steps.hash.outputs.ok == 'true'
        env:
          CHOSEN_DIR: ${{ runner.temp }}/chosen
          BODY_FILE: ${{ runner.temp }}/regrade-comment.md
          VERDICT_COMMENT_ID: ${{ needs.parse.outputs.comment_id }}
          # An auditor pass is not the owner's verdict: no pending carry is written for it (lib/carry.ts).
          VERDICT_SOURCE: ${{ needs.parse.outputs.kind == 'auditor-pass' && 'auditor-pass' || needs.parse.outputs.source }}
        run: tools/node_modules/.bin/tsx tools/peaceai/bin/verdict-stale.ts
      - name: Post the regrade request
        if: steps.stale.outputs.stale == 'true' && steps.stale.outputs.ok == 'true'
        env:
          BODY_FILE: ${{ runner.temp }}/regrade-comment.md
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
      - name: Re-queue the regrade (pending carry)
        if: steps.stale.outputs.stale == 'true' && steps.stale.outputs.ok == 'true' && needs.parse.outputs.source == 'comment'
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label peaceai:done >/dev/null
          gh workflow run peace-task.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Stale base without a regrade request (fail closed)
        if: steps.stale.outputs.stale == 'error' || (steps.stale.outputs.stale == 'true' && steps.stale.outputs.ok != 'true')
        env:
          REASON: ${{ steps.stale.outputs.reason }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Verdict recorded: $LABEL right. No PR opened on \`$TARGET\`: stale base, ${REASON:-regrade-request-failed}."
          exit 1
      - name: Open a PR on the target for the chosen candidate
        if: env.HAS_TOKEN == 'true' && steps.guard.outputs.open_pr == 'true' && steps.stale.outputs.stale == 'false' && steps.hash.outputs.ok == 'true'
        env:
          TARGET_PR_TOKEN: ${{ secrets.TARGET_PR_TOKEN }}
          BASE_SHA: ${{ needs.record.outputs.base_sha }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in candidate-[0-9]*) ;; *) echo "bad candidate id"; exit 1 ;; esac
          tools/peaceai/bin/clone-target.sh "$TARGET" "$RUNNER_TEMP/target" "$BASE_SHA"
          cd "$RUNNER_TEMP/target"
          base_branch="$(GH_TOKEN="$TARGET_PR_TOKEN" gh repo view "$TARGET" --json defaultBranchRef -q .defaultBranchRef.name)"
          branch="peace-task/issue-${ISSUE_NUMBER}-${CANDIDATE}-$(openssl rand -hex 4)"
          case "$branch" in
            peace-task/issue-"${ISSUE_NUMBER}"-"${CANDIDATE}"-*) ;;
            *) echo "refused: branch is not a peace-task branch"; exit 1 ;;
          esac
          if [ "$branch" = "$base_branch" ] || [ "$branch" = "main" ]; then echo "refused: would push the default branch"; exit 1; fi
          git checkout -q -b "$branch"
          # Auditor (#107, change 5): .github/workflows/** never goes through PeaceAI's push path.
          if grep -qE '^(diff --git a/.* b/|\+\+\+ b/|--- a/|rename (from|to) |copy (from|to) )\.github/workflows/' "$RUNNER_TEMP/chosen/chosen.diff"; then
            echo "refused: .github/workflows/** goes in only through a normal PR that Architect merges"; exit 1
          fi
          git apply --whitespace=nowarn "$RUNNER_TEMP/chosen/chosen.diff"
          "$GITHUB_WORKSPACE/tools/peaceai/bin/stage-chosen.sh" "$RUNNER_TEMP/chosen/chosen.diff"
          git -c user.name=PeaceG03 -c user.email=301894882+PeaceG03@users.noreply.github.com \
            commit -q -m "PeaceAI candidate chosen in review of PeaceG03/PeaceAI-Workspace#${ISSUE_NUMBER}"
          auth="$(printf 'x-access-token:%s' "$TARGET_PR_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.extraHeader=Authorization: basic $auth" push -q "https://github.com/$TARGET.git" "HEAD:refs/heads/$branch"
          if [ "$VERDICT_FROM" = "auditor-pass" ]; then
            case "$COMMENT_ID" in *[!0-9]*|"") echo "bad comment id"; exit 1 ;; esac
            title="PeaceAI task PeaceG03/PeaceAI-Workspace#${ISSUE_NUMBER} (auditor-pass candidate)"
            case "$DELEGATED_BY" in "owner (scanner-helper class)"|"owner (scanner-wiring class)") ;; *) echo "bad delegation"; exit 1 ;; esac
            body="$(printf 'Candidate accepted by Auditor pass on PeaceG03/PeaceAI-Workspace#%s (not an owner verdict: delegated by the %s only, 0 credit).\n\nauditor-pass: %s diff-sha256 %s comment %s source auditor-pass delegatedBy %s\n' "$ISSUE_NUMBER" "$DELEGATED_BY" "$CANDIDATE" "$DIFF_SHA" "$COMMENT_ID" "$DELEGATED_BY")"
          else
            title="PeaceAI task PeaceG03/PeaceAI-Workspace#${ISSUE_NUMBER} (owner-chosen candidate)"
            body="Candidate chosen by owner review on PeaceG03/PeaceAI-Workspace#${ISSUE_NUMBER}."
          fi
          url="$(GH_TOKEN="$TARGET_PR_TOKEN" gh pr create --repo "$TARGET" --base "$base_branch" --head "$branch" \
            --title "$title" --body "$body")"
          echo "pr_url=$url" >> "$GITHUB_ENV"
      - name: Reply
        if: env.HAS_TOKEN == 'true' && steps.stale.outputs.stale != 'true' && steps.stale.outputs.stale != 'error'
        env:
          REPLY: ${{ steps.guard.outputs.reply }}
        run: |
          if [ "$VERDICT_FROM" = "auditor-pass" ]; then
            case "$DELEGATED_BY" in "owner (scanner-helper class)"|"owner (scanner-wiring class)") ;; *) echo "bad delegation"; exit 1 ;; esac
            REPLY="$(printf 'Auditor pass (delegated by the %s; not an owner verdict, 0 credit).\n%s' "$DELEGATED_BY" "$REPLY")"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$REPLY${pr_url:+ $pr_url}"

  # M6: patch-file route (no write token anywhere). The chosen candidate becomes one noreply commit on the
  # target's base, exported with `git format-patch`, and posted on this issue with its SHA-256 values.
  # The owner applies it from the Builder box with peaceai/bin/apply-verdict-patch.sh, which re-verifies
  # everything against Results and never pushes.
  target-patch:
    name: post the chosen candidate as a patch file
    needs: [parse, record, respond]
    if: always() && needs.respond.outputs.target_patch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: peace-verdict-respond-${{ needs.parse.outputs.issue }}-patch
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: write # carry-forward: re-queue the regrade sweep (gh workflow run peace-task.yml)
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ needs.parse.outputs.issue }}
      TARGET: ${{ needs.record.outputs.target }}
      LABEL: ${{ needs.record.outputs.label }}
      CANDIDATE: ${{ needs.record.outputs.candidate }}
      RUN_ID: ${{ needs.record.outputs.run_id }}
      BASE_SHA: ${{ needs.record.outputs.base_sha }}
      COMMENT_CREATED_AT: ${{ needs.parse.outputs.created_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install tooling
        working-directory: tools
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Re-check the target is public
        run: tools/node_modules/.bin/tsx tools/peaceai/bin/target-check.ts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: peaceai-chosen
          path: ${{ runner.temp }}/chosen
      # M18 (Auditor option b): if the target moved past the task base, no patch is built on the old base.
      # A regrade request is posted instead; re-queuing the task re-applies this exact candidate onto the
      # current head and grades it fresh in the sandboxed Job B (new Results attempt, new verdict).
      - name: Stale-base check
        id: stale
        env:
          CHOSEN_DIR: ${{ runner.temp }}/chosen
          BODY_FILE: ${{ runner.temp }}/regrade-comment.md
          VERDICT_COMMENT_ID: ${{ needs.parse.outputs.comment_id }}
          # An auditor pass is not the owner's verdict: no pending carry is written for it (lib/carry.ts).
          VERDICT_SOURCE: ${{ needs.parse.outputs.kind == 'auditor-pass' && 'auditor-pass' || needs.parse.outputs.source }}
        run: tools/node_modules/.bin/tsx tools/peaceai/bin/verdict-stale.ts
      - name: Post the regrade request
        if: steps.stale.outputs.stale == 'true' && steps.stale.outputs.ok == 'true'
        env:
          BODY_FILE: ${{ runner.temp }}/regrade-comment.md
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
      # Carry-forward: re-queue the regrade through the existing path (the owner's peace-task label stays; only
      # peaceai:done is removed) and start a sweep. The carry itself is decided later by peace-task's carry job.
      - name: Re-queue the regrade (pending carry)
        if: steps.stale.outputs.stale == 'true' && steps.stale.outputs.ok == 'true' && needs.parse.outputs.source == 'comment'
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label peaceai:done >/dev/null
          gh workflow run peace-task.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Stale base without a regrade request (fail closed)
        if: steps.stale.outputs.stale != 'false' && steps.stale.outputs.ok != 'true'
        env:
          REASON: ${{ steps.stale.outputs.reason }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Verdict recorded: $LABEL right. No patch posted for \`$TARGET\`: stale base, ${REASON:-regrade-request-failed}."
          exit 1
      - name: Build the format-patch (one noreply commit on the task's base)
        if: steps.stale.outputs.stale == 'false'
        run: |
          set -euo pipefail
          case "$CANDIDATE" in candidate-[0-9]*) ;; *) echo "bad candidate id"; exit 1 ;; esac
          case "$BASE_SHA" in *[!0-9a-f]*|"") echo "bad base sha"; exit 1 ;; esac
          tools/peaceai/bin/clone-target.sh "$TARGET" "$RUNNER_TEMP/target" "$BASE_SHA"
          cd "$RUNNER_TEMP/target"
          # Auditor (#107, change 5): .github/workflows/** never goes through PeaceAI's push path.
          if grep -qE '^(diff --git a/.* b/|\+\+\+ b/|--- a/|rename (from|to) |copy (from|to) )\.github/workflows/' "$RUNNER_TEMP/chosen/chosen.diff"; then
            echo "refused: .github/workflows/** goes in only through a normal PR that Architect merges"; exit 1
          fi
          git apply --whitespace=nowarn "$RUNNER_TEMP/chosen/chosen.diff"
          "$GITHUB_WORKSPACE/tools/peaceai/bin/stage-chosen.sh" "$RUNNER_TEMP/chosen/chosen.diff"
          # No background auto-gc/maintenance: a detached gc writing .git/objects raced the cleanup below
          # ("rm: cannot remove .git/objects: Directory not empty", #86) and failed a patch that was already built.
          GIT_AUTHOR_DATE="$COMMENT_CREATED_AT" GIT_COMMITTER_DATE="$COMMENT_CREATED_AT" \
            git -c gc.auto=0 -c maintenance.auto=false -c user.name=PeaceG03 -c user.email=301894882+PeaceG03@users.noreply.github.com \
            commit -q -m "PeaceAI candidate chosen in review of PeaceG03/PeaceAI-Workspace#${ISSUE_NUMBER}"
          git format-patch -1 --stdout --no-signature --no-stat --full-index --no-renames --no-color > "$RUNNER_TEMP/verdict.patch"
          cd - >/dev/null
          test -s "$RUNNER_TEMP/verdict.patch"
          # Cleanup is best effort: the patch is built and is checked by the next step either way.
          rm -rf "$RUNNER_TEMP/target" || { sleep 2; rm -rf "$RUNNER_TEMP/target" || echo "target cleanup incomplete (ignored)"; }
      - name: Check the patch and write the comment
        id: body
        if: steps.stale.outputs.stale == 'false'
        env:
          PATCH_FILE: ${{ runner.temp }}/verdict.patch
          CHOSEN_DIFF: ${{ runner.temp }}/chosen/chosen.diff
          BODY_FILE: ${{ runner.temp }}/patch-comment.md
        run: tools/node_modules/.bin/tsx tools/peaceai/bin/verdict-patch.ts
      - name: Post the patch
        if: steps.body.outputs.ok == 'true'
        env:
          BODY_FILE: ${{ runner.temp }}/patch-comment.md
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
      - name: Fail closed
        if: always() && steps.stale.outputs.stale == 'false' && steps.body.outputs.ok != 'true'
        env:
          REASON: ${{ steps.body.outputs.reason }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Verdict recorded: $LABEL right. No patch posted for \`$TARGET\`: ${REASON:-patch-build-failed}."
          exit 1

  train:
    name: retrain the shadow ranker
    needs: [record]
    # Verdicts on [test] issues never reach training, so they do not retrain.
    # Off until the gated retrain: Architect ordered no auto-dispatch (run 38852518987 was auto-dispatched by a
    # verdict). It runs only when the repo variable PEACEAI_RANKER_AUTOTRAIN is 'on', which only Architect's
    # explicit approval sets. Manual `gh workflow run peace-train.yml` is unaffected.
    # An auditor pass is never training data (records.ts effectiveVerdict().delegated), so it never retrains.
    if: vars.PEACEAI_RANKER_AUTOTRAIN == 'on' && needs.record.outputs.status == 'recorded' && needs.record.outputs.test != 'true' && needs.record.outputs.source != 'auditor-pass'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch peace-train
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run peace-train.yml --repo "$GITHUB_REPOSITORY" --ref main

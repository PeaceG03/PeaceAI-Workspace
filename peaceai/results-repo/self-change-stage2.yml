name: self-change-stage2
run-name: self-change-stage2 ${{ inputs.id }}

# M106 (installed in PeaceAI-Results from PeaceAI-Workspace peaceai/results-repo/; BUILDER-WRITTEN, Peace-approved
# 2026-10-25, revised for Auditor's #504 review). The private, short-lived grading run for a stage-2 self-change
# PROPOSAL. It only grades; no secrets, no push of code, no PR, no comment; no token is persisted or in any grading
# step's environment (selfChangeAllowedHere refuses CREDENTIALS_IN_ENV). The ONE write is the ledger job below.
# Four kinds of job, so candidate code never shares a job, process tree or dependency install with the grader or
# the record:
#   ledger   (no checkout, no code) round 2 B4: creates self-proposals/ledger/<id>.json in this repo with the
#            contents API WITHOUT a sha, so it fails if the id was ever used (write-once); it names this run id.
#            decide2 refuses a record whose run id is not the ledger's, or a ledger file touched by more than one
#            commit. Its token (job-scoped contents: write) exists only in that one step.
#   prepare  (no candidate code)  the ONLY file read from this repo is self-proposals/<id>.patch (sparse checkout);
#            the grader is a separate read-only Workspace checkout at main with its own install; base pinned to
#            main, never-zone closure of the base tree, strict parse, staged==parsed, check on git's own diff.
#   run      (one fresh VM per phase; the only place candidate code runs) fresh clone + its own npm ci inside
#            run2; a process snapshot before and a leftover check after (leftovers = phase output deleted = failed).
#   record   (no candidate code) builds the record from the prepare output and the phase outputs.
# No retry: run_attempt must be 1, outputs are write-once and the id ledger is write-once across runs.
# ADVISORY COUNTS (round 2 B1): candidate code shares the test process, so the pass/fail counts can be forged by
# what it prints; they can only block, and landing always needs both human approvals on the exact head.
# CANDIDATE UID (Peace 2026-10-25, required before any flag flip): the run job creates peaceai-cand (system user, no
# home, no shell, no sudo) and run2 runs every candidate test only as that uid, on a clone it can read but not
# change, with a private HOME/TMPDIR, killing every process of that uid afterwards. The runner's passwordless sudo,
# its files and its processes are out of the candidate's reach; run2 refuses in this job without the uid.
# Landing is decided later in the Workspace by `self-change.ts decide2 --pr N`: flag peaceai/self/stage2.json on
# main (only Peace flips it), Peace `/verdict <id> <sha> right` AND Auditor `/auditor-pass <id> <sha>` on that exact
# head, base on main and the PR exactly base..head. Credit is refused until a recorded generator run exists.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "proposal id (sc-<name>); the patch is self-proposals/<id>.patch on main"
        required: true
      base:
        description: "Workspace base commit (40 hex, an ancestor of Workspace main)"
        required: true

permissions:
  contents: read

concurrency:
  group: self-change-stage2-${{ inputs.id }}
  cancel-in-progress: false

env:
  ID: ${{ inputs.id }}
  BASE: ${{ inputs.base }}
  SOURCE: https://github.com/PeaceG03/PeaceAI-Workspace.git

jobs:
  ledger:
    if: github.repository == 'PeaceG03/PeaceAI-Results' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Claim the proposal id (write-once; fails if the id was ever used)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ID" =~ ^sc-[a-z0-9-]{3,48}$ ]] || { echo "bad id"; exit 1; }
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "bad base"; exit 1; }
          body=$(printf '{"schema":"peaceai-self-change-ledger:v1","id":"%s","base":"%s","runId":"%s","patchSha256":""}\n' "$ID" "$BASE" "$GITHUB_RUN_ID" | base64 -w0)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/self-proposals/ledger/$ID.json" \
            -f message="self-change ledger: $ID run $GITHUB_RUN_ID" -f content="$body" > /dev/null \
            || { echo "id $ID already used (or ledger write failed): a stage-2 failure is final; use a new id"; exit 1; }

  prepare:
    needs: ledger
    if: github.repository == 'PeaceG03/PeaceAI-Results' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$ID" =~ ^sc-[a-z0-9-]{3,48}$ ]] || { echo "bad id"; exit 1; }
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "bad base"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: results
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /self-proposals/${{ inputs.id }}.patch
      - name: Take only the patch file
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/in"
          cp "results/self-proposals/$ID.patch" "$RUNNER_TEMP/in/proposal.patch"
          rm -rf results
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PeaceG03/PeaceAI-Workspace
          ref: main
          path: grader
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Grader install (read-only after)
        working-directory: grader
        run: npm ci --ignore-scripts --no-audit --no-fund && chmod -R a-w .
      - name: Prepare (no candidate code)
        working-directory: grader
        run: |
          set -euo pipefail
          node_modules/.bin/tsx peaceai/bin/self-change.ts prepare2 --id "$ID" --base "$BASE" \
            --patch "$RUNNER_TEMP/in/proposal.patch" --source "$SOURCE" --out "$RUNNER_TEMP/prep"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: self-change-stage2-${{ inputs.id }}-prep
          path: ${{ runner.temp }}/prep/
          retention-days: 14
          if-no-files-found: ignore

  run:
    needs: prepare
    if: github.repository == 'PeaceG03/PeaceAI-Results' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        phase: [suite, new-on-candidate, new-on-base]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PeaceG03/PeaceAI-Workspace
          ref: main
          path: grader
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Grader install (read-only after)
        working-directory: grader
        run: npm ci --ignore-scripts --no-audit --no-fund && chmod -R a-w .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: self-change-stage2-${{ inputs.id }}-prep
          path: ${{ runner.temp }}/prep
      - name: Candidate user (no home, no shell, no sudo)
        run: |
          set -euo pipefail
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin peaceai-cand
          if sudo -n -u peaceai-cand -- sudo -n true 2>/dev/null; then echo "peaceai-cand must not have sudo"; exit 1; fi
      - name: Process snapshot
        run: ps -e -o pid= | sort -n > "$RUNNER_TEMP/ps-before"
      - name: Run phase ${{ matrix.phase }} (candidate code as peaceai-cand; fresh clone + own install inside)
        working-directory: grader
        env:
          PHASE: ${{ matrix.phase }}
          PEACEAI_STAGE2_CAND: peaceai-cand
        # round 2 B1(4): no runner command files for candidate-code steps (GITHUB_ENV / PATH / OUTPUT / STATE / summary)
        run: |
          set -euo pipefail
          env -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_OUTPUT -u GITHUB_STATE -u GITHUB_STEP_SUMMARY \
            node_modules/.bin/tsx peaceai/bin/self-change.ts run2 --phase "$PHASE" \
            --prep "$RUNNER_TEMP/prep/$ID.prep.json" --bundle "$RUNNER_TEMP/prep/$ID.bundle" \
            --source "$SOURCE" --out "$RUNNER_TEMP/run"
      - name: Leftover process check
        if: always()
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          set -uo pipefail
          ps -e -o pid= | sort -n > "$RUNNER_TEMP/ps-after"
          left=""
          for p in $(comm -13 "$RUNNER_TEMP/ps-before" "$RUNNER_TEMP/ps-after"); do
            [ "$p" = "$$" ] && continue
            [ -d "/proc/$p" ] || continue
            ppid=$(awk '{print $4}' "/proc/$p/stat" 2>/dev/null || echo 0)
            [ "$ppid" = "$$" ] && continue
            left="$left $p"
          done
          if [ -n "$left" ]; then
            echo "LEFTOVER processes after phase $PHASE:$left"
            kill -9 $left 2>/dev/null || true
            rm -f "$RUNNER_TEMP/run/$ID.$PHASE.json"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: self-change-stage2-${{ inputs.id }}-run-${{ matrix.phase }}
          path: ${{ runner.temp }}/run/
          retention-days: 14
          if-no-files-found: ignore

  record:
    needs: [prepare, run]
    if: always() && github.repository == 'PeaceG03/PeaceAI-Results' && github.run_attempt == 1 && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PeaceG03/PeaceAI-Workspace
          ref: main
          path: grader
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Grader install (read-only after)
        working-directory: grader
        run: npm ci --ignore-scripts --no-audit --no-fund && chmod -R a-w .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: self-change-stage2-${{ inputs.id }}-prep
          path: ${{ runner.temp }}/prep
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: self-change-stage2-${{ inputs.id }}-run-suite
          path: ${{ runner.temp }}/runs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: self-change-stage2-${{ inputs.id }}-run-new-on-candidate
          path: ${{ runner.temp }}/runs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: self-change-stage2-${{ inputs.id }}-run-new-on-base
          path: ${{ runner.temp }}/runs
      - name: Record (no candidate code; missing or leftover phase = failed)
        working-directory: grader
        run: |
          set -euo pipefail
          node_modules/.bin/tsx peaceai/bin/self-change.ts record2 --prep "$RUNNER_TEMP/prep/$ID.prep.json" \
            --runs "$RUNNER_TEMP/runs" --out "$RUNNER_TEMP/self-change-records"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: self-change-stage2-${{ inputs.id }}
          path: ${{ runner.temp }}/self-change-records/self-changes/
          retention-days: 14
          if-no-files-found: ignore
